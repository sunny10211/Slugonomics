<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slugonomics: practice the money decisions of college</title>
<meta name="description" content="Free, UCSC-specific money practice: six real decisions, calculators with 2026 numbers, and two Santa Cruz life simulators.">
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(assets/fonts/bricolage-grotesque.woff2) format('woff2');font-weight:200 800;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url(assets/fonts/instrument-sans.woff2) format('woff2');font-weight:400 700;font-stretch:75% 100%;font-display:swap}
/* Slugonomics: coastal fog, redwood-forest ink, banana-slug yellow. One loud thing per page; everything else quiet. */
:root{
  --paper:#EDF1EE;--surface:#FFFFFF;--sunk:#E1E8E3;--ink:#10251F;--text:#22352F;--muted:#56665F;--line:#CFD9D3;
  --slug:#F4C21B;--slug-ink:#231B00;--slug-deep:#B98C00;--sea:#1E5A7A;--bark:#A4432A;
  --good:#1F7048;--good-bg:#DDEFE4;--warn:#875A05;--warn-bg:#F7ECD0;--bad:#A4432A;--bad-bg:#F6E1DA;
  --band:#10251F;--band-2:#1A372E;--band-text:#E6EEE9;--band-muted:#A5B8AF;
  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Bricolage Grotesque','Instrument Sans',ui-sans-serif,system-ui,sans-serif;
  --serif:var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1714;--surface:#13221D;--sunk:#192C26;--ink:#ECF3EF;--text:#D3DED8;--muted:#93A69D;--line:#26392F;
  --sea:#7DB9D6;--good:#6CCB98;--good-bg:#12372A;--warn:#F0BC57;--warn-bg:#382B0F;--bad:#F1907F;--bad-bg:#3D1D19;--bark:#F1907F;
  --band:#0A1310;--band-2:#13221D;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1714;--surface:#13221D;--sunk:#192C26;--ink:#ECF3EF;--text:#D3DED8;--muted:#93A69D;--line:#26392F;
  --sea:#7DB9D6;--good:#6CCB98;--good-bg:#12372A;--warn:#F0BC57;--warn-bg:#382B0F;--bad:#F1907F;--bad-bg:#3D1D19;--bark:#F1907F;
  --band:#0A1310;--band-2:#13221D;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:17px/1.55 var(--sans);font-feature-settings:"ss01";-webkit-font-smoothing:antialiased}
a{color:var(--sea);text-underline-offset:3px;text-decoration-thickness:1px}
h1,h2,h3,h4{font-family:var(--display);color:var(--ink);margin:0;text-wrap:balance;font-variation-settings:"opsz" 96}
h1{font-size:clamp(2.5rem,5.6vw,4.4rem);line-height:.98;font-weight:800;letter-spacing:-.03em}
h2{font-size:clamp(1.8rem,3.3vw,2.6rem);line-height:1.04;font-weight:750;letter-spacing:-.03em}
h3{font-size:1.22rem;line-height:1.2;font-weight:700;letter-spacing:-.015em;font-variation-settings:"opsz" 32}
h4{font-size:1.04rem;font-weight:700;letter-spacing:-.01em;font-variation-settings:"opsz" 24}
p{margin:0;font-family:var(--sans);font-size:1.04rem;line-height:1.6;max-width:62ch}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
@media (max-width:480px){.wrap{padding:0 18px}}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--slug);outline-offset:2px;border-radius:4px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.stack{display:flex;flex-direction:column;gap:14px}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navrow{display:flex;align-items:center;gap:24px;height:70px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:1.32rem;letter-spacing:-.035em;font-variation-settings:"opsz" 48}
.brand svg{width:30px;height:30px}
.links{display:flex;gap:4px;margin-left:auto}
.links a{position:relative;padding:8px 12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem}
.links a:hover{color:var(--ink)}
.links a.on{color:var(--ink)}
.links a.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-16px;height:3px;background:var(--slug);border-radius:2px}
.links a.plan{margin-left:10px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink)}
.links a.plan::after{display:none}
.links a.plan .ct{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:6px;border-radius:10px;background:var(--slug);color:var(--slug-ink);font-size:.75rem;font-weight:800}
.menubtn{display:none;margin-left:auto;background:none;border:1.5px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:700;color:var(--ink)}
@media (max-width:880px){
  .menubtn{display:block}
  .links{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 18px 16px}
  .links.open{display:flex}
  .links a{padding:13px 0;border-bottom:1px solid var(--line)}
  .links a.on::after{display:none}
  .links a.plan{margin:12px 0 0;padding:12px;text-align:center}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:14px 22px;font-weight:650;font-size:1rem;letter-spacing:-.005em;text-decoration:none;background:var(--ink);color:var(--paper);line-height:1}
.btn:hover{filter:brightness(1.12)}
.btn.slug{background:var(--slug);color:var(--slug-ink);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.line:hover{box-shadow:inset 0 0 0 1.5px var(--ink);filter:none}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

main{min-height:60vh}
.page{padding-top:56px;padding-bottom:96px}
.pagehead{display:grid;gap:14px;margin-bottom:36px;max-width:760px}
.pagehead p{color:var(--muted);font-size:1.15rem}
.label{font-weight:700;font-size:.9rem;color:var(--sea)}

/* hero: big statement, then the slug-trail demo across the full width */
.hero{padding:72px 0 40px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px 64px;align-items:end}
.hero h1{max-width:13ch}
.hero .lead{font-size:1.18rem;color:var(--muted);margin:0 0 26px;max-width:38ch}
.hero .who{margin-top:20px;font-size:.93rem;color:var(--muted)}
.hero .who b{color:var(--ink)}
@media (max-width:920px){.hero{grid-template-columns:1fr;padding:44px 0 28px}.hero h1{max-width:15ch}}

.trail{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 34px 28px;margin-bottom:24px}
.trail-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,360px);gap:20px 48px;align-items:end}
.trail h2{font-size:clamp(1.45rem,2.6vw,2rem);max-width:22ch}
.trail .given{margin-top:8px;color:var(--muted);font-size:.98rem}
.trail .given b{color:var(--ink);font-variant-numeric:tabular-nums}
.trail label{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:.95rem;color:var(--ink)}
.trail label output{font-family:var(--display);font-size:1.7rem;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trail input[type=range]{width:100%;margin:10px 0 0;accent-color:var(--ink);height:28px}
.trail svg.path{display:block;width:100%;height:auto;margin:34px 0 6px;overflow:visible}
.trail .wk{font:600 12.5px var(--sans);fill:var(--muted);font-variant-numeric:tabular-nums}
.trail .wk.fin{fill:var(--ink)}
.trail .dry{stroke:var(--line);stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;fill:none}
.trail .wet{stroke:var(--slug);stroke-width:14;stroke-linecap:round;fill:none;transition:stroke-dashoffset .5s cubic-bezier(.3,.7,.2,1)}
.trail .sheen{stroke:#fff;stroke-opacity:.55;stroke-width:3;stroke-linecap:round;fill:none;transition:stroke-dashoffset .5s cubic-bezier(.3,.7,.2,1)}
.trail .tick{fill:var(--surface);stroke:var(--line);stroke-width:2}
.trail .tick.on{stroke:var(--slug-deep);fill:var(--slug)}
.trail #slug{transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.trail .result{display:flex;justify-content:space-between;align-items:baseline;gap:12px 32px;flex-wrap:wrap;margin-top:10px;padding-top:18px;border-top:1px solid var(--line)}
.trail .result b{font-family:var(--display);font-size:clamp(1.3rem,2.3vw,1.7rem);font-weight:750;letter-spacing:-.02em;color:var(--ink)}
.trail .result b.short{color:var(--bark)}
.trail .result span{color:var(--muted);font-size:.98rem}
@media (max-width:760px){.trail{padding:22px 18px}.trail-top{grid-template-columns:1fr}.trail .wk{font-size:17px}.trail .wet{stroke-width:11}}

/* sections */
.sec{padding:88px 0}
.sec+.sec{border-top:1px solid var(--line)}
.sechead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 40px;align-items:end;margin-bottom:34px}
.sechead p{color:var(--muted);margin-top:12px}
@media (max-width:700px){.sechead{grid-template-columns:1fr}.sec{padding:64px 0}}

/* decision index */
.index{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto 20px;gap:20px;align-items:center;padding:22px 6px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:hover{background:var(--surface)}
.row:hover .chev{transform:translateX(3px);color:var(--ink)}
.row .badge{width:40px;height:40px;color:var(--ink);display:grid;place-items:center}
.row .badge .ic{width:28px;height:28px;stroke-width:1.5}
.row h3{margin-bottom:4px;font-size:1.3rem}
.row p{font-size:1rem;color:var(--muted)}
.row .meta{font-size:.9rem;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .meta .st{display:block;font-weight:700;margin-top:2px}
.row .meta .st.done{color:var(--good)}
.row .meta .st.prog{color:var(--warn)}
.chev{color:var(--muted);transition:transform .15s}
@media (max-width:600px){.row{grid-template-columns:32px minmax(0,1fr) 18px;gap:14px}.row .badge{width:32px;height:32px}.row .meta{display:none}}

/* games band */
.band{background:var(--band);color:var(--band-text);padding:96px 0 88px;overflow:hidden}
.band h2,.band h3{color:#fff}
.band p{color:var(--band-muted)}
.band .sechead p{color:var(--band-muted)}
.games{display:grid;gap:96px;margin-top:56px}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px 72px;align-items:center}
.game:nth-child(even) .phones{order:2}
@media (max-width:900px){.game{grid-template-columns:1fr}.game:nth-child(even) .phones{order:0}.games{gap:72px}}
.game h3{font-size:clamp(2rem,3.6vw,2.9rem);font-weight:800;letter-spacing:-.035em;line-height:1;font-variation-settings:"opsz" 96}
.game .kind{color:var(--slug);font-weight:600;font-size:1rem;margin-bottom:12px}
.game p.what{font-size:1.12rem;color:var(--band-text);margin:16px 0 22px;max-width:42ch}
.game dl{margin:0 0 30px;display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:.98rem;max-width:520px}
.game dt{color:var(--band-muted)}
.game dd{margin:0;color:#fff}
.phones{position:relative;display:flex;justify-content:center;align-items:flex-start;min-height:520px}
.phone{width:min(260px,44%);aspect-ratio:390/844;border-radius:34px;padding:8px;background:#05100C;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 30px 60px -28px rgba(0,0,0,.8);flex:none}
.phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:27px;background:#0d1a16}
.phone+.phone{margin-left:-36px;margin-top:64px}
@media (max-width:520px){.phones{min-height:0}.phone{width:56%;border-radius:26px;padding:6px}.phone img{border-radius:21px}.phone+.phone{margin-left:-14%;margin-top:40px}}
.workshop{margin-top:88px;padding-top:28px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;gap:16px 32px;align-items:center;flex-wrap:wrap}
.workshop p{color:var(--band-text);max-width:60ch}
.workshop p b{color:#fff}
.band .btn.line{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.band .btn.line:hover{box-shadow:inset 0 0 0 1.5px #fff}

/* proof list */
.proof{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:40px 80px;align-items:start}
@media (max-width:860px){.proof{grid-template-columns:1fr}}
.proof dl{margin:0;border-top:2px solid var(--ink)}
.proof dl div{display:grid;grid-template-columns:minmax(150px,.7fr) minmax(0,1.3fr);gap:8px 28px;padding:20px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.proof dl div{grid-template-columns:1fr}}
.proof dt{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--ink);letter-spacing:-.01em}
.proof dd{margin:0;color:var(--muted)}
.proof aside p{color:var(--muted);margin-top:14px}

/* founder */
.founder{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px 36px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 34px}
.founder .mark{width:76px;height:76px;border-radius:20px;background:var(--ink);display:grid;place-items:center}
.founder .mark svg{width:58px}
.founder h3{font-size:1.5rem}
.founder p{color:var(--muted);margin-top:6px}
@media (max-width:760px){.founder{grid-template-columns:1fr;padding:24px}}

/* decision player */
.player{display:grid;grid-template-columns:240px minmax(0,1fr);gap:56px;align-items:start}
@media (max-width:860px){.player{grid-template-columns:1fr;gap:24px}}
.stepper{position:sticky;top:92px;display:flex;flex-direction:column;gap:2px}
.stepper button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 0;text-align:left;font-weight:600;color:var(--muted)}
.stepper button i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);font-size:.85rem;font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.stepper button.on{color:var(--ink)}
.stepper button.on i{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.stepper button.done i{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.stepper button:disabled{opacity:.45;cursor:default}
@media (max-width:860px){.stepper{position:static;flex-direction:row;overflow-x:auto;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px}.stepper button{white-space:nowrap;padding:6px 0}}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--muted);margin-bottom:18px}
.back:hover{color:var(--ink)}
.dtitle{display:flex;gap:16px;align-items:center;margin-bottom:36px}
.dtitle .badge{width:56px;height:56px;border-radius:14px;background:var(--slug);color:var(--slug-ink);display:grid;place-items:center;flex:none}
.dtitle .badge .ic{width:28px;height:28px}
.dtitle h1{font-size:clamp(1.9rem,4vw,2.7rem)}
.stage{max-width:720px;display:grid;gap:18px}
.stage .sub{color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:15px 16px;font-size:1rem;line-height:1.45}
.opt i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--sunk);font-weight:800;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.right i{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong i{background:var(--bad);color:#fff}
.opt.meh{border-color:var(--warn);background:var(--warn-bg)}.opt.meh i{background:var(--warn);color:#fff}
.fb{border-left:4px solid var(--ink);background:var(--surface);border-radius:0 10px 10px 0;padding:16px 18px}
.fb.good{border-color:var(--good)}.fb.bad{border-color:var(--bad)}.fb.meh{border-color:var(--warn)}
.fb h4{margin-bottom:4px}
.fb.good h4{color:var(--good)}.fb.bad h4{color:var(--bad)}.fb.meh h4{color:var(--warn)}
.learn{display:grid;gap:0;border-top:1px solid var(--line)}
.learn div{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.learn b{font-size:1.1rem;font-weight:800;color:var(--sea);font-variant-numeric:tabular-nums}
.learn h4{margin-bottom:4px}
.scenario{background:var(--sunk);border-radius:12px;padding:20px 22px}
.scenario p{font-size:1.12rem;color:var(--ink)}
.conf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conf span{font-size:.85rem;color:var(--muted)}
.conf button{width:44px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;color:var(--ink)}
.conf button.pick{background:var(--slug);border-color:var(--slug);color:var(--slug-ink)}
.checks{display:grid;gap:8px}
.check{display:grid;grid-template-columns:22px 1fr;gap:14px;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.check:has(input:checked){border-color:var(--good)}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--good)}
.check b{display:block;color:var(--ink)}
.check small{color:var(--muted);font-size:.9rem}
.note{font-size:.9rem;color:var(--muted)}

/* tools */
.toolwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:900px){.toolwrap{grid-template-columns:1fr;gap:20px}}
.toolnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:92px}
.toolnav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600}
.toolnav a:hover{color:var(--ink);background:var(--sunk)}
.toolnav a.on{background:var(--ink);color:var(--paper)}
@media (max-width:900px){.toolnav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}.toolnav a{white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--line)}}
.toolhead{margin-bottom:22px}
.toolhead p{color:var(--muted);margin-top:6px}
.tool{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
@media (max-width:760px){.tool{grid-template-columns:1fr}}
.tool .card{padding:24px;border-right:1px solid var(--line)}
@media (max-width:760px){.tool .card{border-right:0;border-bottom:1px solid var(--line)}}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field label{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:.93rem;color:var(--ink);margin-bottom:6px}
.field label output{font-weight:800;font-variant-numeric:tabular-nums;color:var(--sea);white-space:nowrap}
.field input[type=range]{width:100%;accent-color:var(--ink)}
.numwrap{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--sea);white-space:nowrap}
.numbox{width:7.5ch;font:inherit;font-weight:700;color:var(--sea);text-align:right;font-variant-numeric:tabular-nums;background:var(--paper);border:1.5px solid var(--line);border-radius:7px;padding:3px 6px;-moz-appearance:textfield}
.numbox::-webkit-inner-spin-button,.numbox::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.numbox:focus{outline:none;border-color:var(--ink);background:var(--surface)}
.field .hint{font-size:.82rem;color:var(--muted);margin-top:2px;line-height:1.4}
.out{padding:24px;background:var(--paper)}
.out .eyebrow{font-weight:600;font-size:.92rem;color:var(--muted)}
.out .big{font-size:2.7rem;font-weight:800;line-height:1.05;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}

 lead:['Your aid offer, first credit card, first lease, first paycheck. Work through each one with real 2026 numbers and leave with a plan for this week.','Tu oferta de ayuda financiera, tu primera tarjeta de crédito, tu primer contrato de renta, tu primer cheque. Recorre cada uno con cifras reales de 2026 y sal con un plan para esta semana.','학자금 지원 제안서, 첫 신용카드, 첫 임대 계약, 첫 월급. 2026년 실제 숫자로 하나씩 따져 보고, 이번 주에 바로 실천할 계획을 세워 보세요.','助学金通知、第一张信用卡、第一份租约、第一份工资单。用 2026 年的真实数字逐一演练，带着本周就能执行的计划离开。'],

 trail_try:['Try it with your own numbers in the <a href="#budget">quarter budget calculator</a>.','Pruébalo con tus propios números en la <a href="#budget">calculadora del presupuesto trimestral</a>.','<a href="#budget">쿼터 예산 계산기</a>에서 내 숫자로 계산해 보세요.','用<a href="#budget">学季预算计算器</a>输入你自己的数字试试。'],
 dec_h:['Start with the decision in front of you','Empieza por la decisión que tienes enfrente','지금 마주한 결정부터 시작하세요','从你眼前的决定开始'],
 dec_p:['Six money moments almost every UCSC student hits. Each takes 5 to 8 minutes: guess first, learn what matters, run your own numbers, decide on a real Santa Cruz scenario, and leave with next steps.','Seis momentos de dinero que casi todo estudiante de UCSC enfrenta. Cada uno toma de 5 a 8 minutos: adivina primero, aprende lo importante, calcula con tus propios números, decide en un caso real de Santa Cruz y sal con tus próximos pasos.','거의 모든 UCSC 학생이 겪는 돈 문제 여섯 가지. 각각 5~8분이면 돼요. 먼저 추측해 보고, 핵심을 배우고, 내 숫자로 계산하고, 실제 산타크루즈 상황에서 결정한 뒤, 다음 할 일을 정리합니다.','几乎每个 UCSC 学生都会遇到的六个理财时刻。每个只需 5 到 8 分钟：先猜一猜，学会关键要点，用自己的数字算一算，在真实的圣克鲁兹情境中做决定，最后带走下一步行动。'],
 checkup2:['Take the 2-minute checkup','Haz el chequeo de 2 minutos','2분 진단 받기','做 2 分钟小测'],
 band_h:['Then live with your choices for years','Luego vive con tus decisiones durante años','그다음엔 그 선택과 함께 몇 년을 살아 보세요','然后，与你的选择共处多年'],
 band_p:['Two simulators set in Santa Cruz. Mistakes cost fake money, and each money lesson appears the moment it happens to you.','Dos simuladores ambientados en Santa Cruz. Los errores cuestan dinero ficticio, y cada lección de dinero aparece en el momento en que te pasa.','산타크루즈를 배경으로 한 시뮬레이터 두 개. 실수해도 가상의 돈만 잃고, 돈에 관한 교훈은 그 일이 일어나는 순간 바로 나타나요.','两款以圣克鲁兹为背景的模拟游戏。犯错只会损失虚拟的钱，每一条理财知识都会在相关情况发生时及时出现。'],
 proof_h:['Built so a campus can see it working','Hecho para que un campus vea que funciona','캠퍼스가 효과를 직접 확인할 수 있도록','让学校看得见成效'],
 proof_p:['Slugonomics is free and needs no account, so anyone can open it and check every claim on this page.','Slugonomics es gratis y no requiere cuenta, así que cualquiera puede abrirlo y comprobar cada afirmación de esta página.','Slugonomics는 무료이고 가입이 필요 없어서, 누구나 열어 보고 이 페이지의 모든 내용을 직접 확인할 수 있어요.','Slugonomics 免费且无需注册，任何人都可以打开它，亲自核实本页的每一项说法。'],
 p1t:['Learning you can measure','Aprendizaje que se puede medir','측정 가능한 학습 효과','可衡量的学习效果'],
 p1d:['Players answer the same six questions before their first run and after they finish. Results show what changed for each question, plus a short survey.','Los jugadores responden las mismas seis preguntas antes de su primera partida y al terminar. Los resultados muestran qué cambió en cada pregunta, además de una breve encuesta.','플레이어는 첫 플레이 전과 끝난 뒤에 같은 6개 질문에 답해요. 결과는 질문별로 무엇이 달라졌는지와 짧은 설문 결과를 보여 줍니다.','玩家在第一次游戏前和结束后回答同样的六道题。结果会逐题显示变化，并附上一份简短问卷。'],
 p2t:['Real 2026 numbers','Cifras reales de 2026','2026년 실제 숫자','真实的 2026 年数据'],
 p2d:['The 6.52% federal loan rate, California\'s $16.90 minimum wage, current UCSC tuition, housing and UC SHIP costs, and CalFresh income limits.','La tasa federal de préstamos de 6.52%, el salario mínimo de California de $16.90, la colegiatura actual de UCSC, los costos de vivienda y de UC SHIP, y los límites de ingreso de CalFresh.','연방 학자금 대출 금리 6.52%, 캘리포니아 최저임금 $16.90, 현재 UCSC 등록금·주거비·UC SHIP 보험료, CalFresh 소득 기준까지 반영했어요.','联邦学生贷款利率 6.52%、加州最低工资 $16.90、UCSC 当前的学费、住宿和 UC SHIP 保险费用，以及 CalFresh 收入上限。'],
 p3t:['Local by design','Local desde el diseño','지역 맞춤 설계','为本地量身打造'],
 p3d:['Quarters instead of semesters, Santa Cruz rent, and the campus offices that actually help: Financial Aid, SlugCents, Basic Needs and Slug Support.','Trimestres en lugar de semestres, rentas de Santa Cruz y las oficinas del campus que de verdad ayudan: Financial Aid, SlugCents, Basic Needs y Slug Support.','학기제가 아닌 쿼터제, 산타크루즈 월세, 그리고 실제로 도움을 주는 캠퍼스 기관들: Financial Aid, SlugCents, Basic Needs, Slug Support.','采用学季制而非学期制，使用圣克鲁兹的真实房租，并介绍真正能提供帮助的校园部门：Financial Aid、SlugCents、Basic Needs 和 Slug Support。'],
 p4t:['Decisions, not a library','Decisiones, no una biblioteca','자료실이 아닌 결정 가이드','是决定，而不是资料库'],
 p4d:['Students start from the moment they\'re in, like an aid offer, a lease or a card offer, and leave with steps for this week.','Los estudiantes empiezan desde el momento que están viviendo, como una oferta de ayuda, un contrato de renta o una oferta de tarjeta, y salen con pasos para esta semana.','학생들은 학자금 제안, 임대 계약, 카드 권유처럼 지금 마주한 순간에서 시작해, 이번 주에 할 일을 들고 나가요.','学生从自己正面对的时刻出发，比如助学金通知、租约或信用卡推销，离开时带走本周就能做的事。'],
 p5t:['Private by default','Privado desde el inicio','기본은 개인정보 보호','默认保护隐私'],
 p5d:['No sign-up. Progress, plans and real budgets stay in the student\'s own browser.','Sin registro. El progreso, los planes y los presupuestos reales se quedan en el navegador de cada estudiante.','가입이 필요 없어요. 진행 상황, 계획, 실제 예산은 모두 학생 본인의 브라우저에만 저장돼요.','无需注册。进度、计划和真实预算都只保存在学生自己的浏览器里。'],
 founder_h:['Made by Sungjun Lee','Creado por Sungjun Lee','Sungjun Lee가 만들었어요','由 Sungjun Lee 创建'],
 founder_p:['A UC Santa Cruz Business Economics student who has worked as a financial accounting analyst since 2023. Slugonomics is shaped by interviews with UCSC students about the money decisions they actually face.','Estudiante de Business Economics en UC Santa Cruz que trabaja como analista de contabilidad financiera desde 2023. Slugonomics se basa en entrevistas con estudiantes de UCSC sobre las decisiones de dinero que realmente enfrentan.','UC Santa Cruz에서 경영경제학(Business Economics)을 전공하며 2023년부터 재무회계 분석가로 일하고 있어요. Slugonomics는 UCSC 학생들이 실제로 겪는 돈 문제에 대한 인터뷰를 바탕으로 만들어졌어요.','UC Santa Cruz 商业经济学（Business Economics）专业学生，自 2023 年起担任财务会计分析师。Slugonomics 的内容来自对 UCSC 学生的访谈，聚焦他们真正面对的理财决定。'],
 contact:['Contact Sungjun','Contactar a Sungjun','Sungjun에게 연락하기','联系 Sungjun'],

function brTax(x,br){let t=0,p=0;for(const[top,r]of br){if(x<=p)break;t+=(Math.min(x,top)-p)*r;p=top;}return t;}
const fedTax=inc=>brTax(Math.max(0,inc-FED_STD),FED_BR);
const caTax=inc=>Math.max(0,brTax(Math.max(0,inc-CA_STD),CA_BR)-CA_CREDIT);
function pmt(P,ratePct,months){const r=ratePct/100/12;if(P<=0)return 0;if(r===0)return P/months;return P*r/(1-Math.pow(1+r,-months));}

function fieldHTML(t_,f,val){
 const v=val??f.v,bool=f.fmt==='';
 const pre=f.fmt==='$'?'$':'',suf=f.fmt==='%'?'%':f.fmt==='$'||bool?'':t('u_'+f.fmt);
 const box=bool?`<output id="${t_}-${f.k}-o">${v?t('yes'):t('no')}</output>`
  :`<span class="numwrap">${pre?`<span aria-hidden="true">${pre}</span>`:''}<input type="number" inputmode="decimal" class="numbox" id="${t_}-${f.k}-n" data-n="${f.k}" min="${f.min}" step="any" value="${+(+v).toFixed(2)}" aria-label="${esc(f.l)}, ${t('type_any')}">${suf?`<span aria-hidden="true">${suf}</span>`:''}</span>`;
 return `<div class="field"><label for="${t_}-${f.k}"><span>${f.l}</span>${box}</label>
 <input type="range" id="${t_}-${f.k}" data-k="${f.k}" min="${f.min}" max="${Math.max(f.max,v)}" step="${f.step}" value="${v}">${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
}
function mountTool(el,id,preset={}){
 const T=TOOLS[id];
 el.innerHTML=`<div class="tool"><div class="card">${T.fields.map(f=>fieldHTML(id,f,preset[f.k])).join('')}<p class="hint" style="margin-top:14px">${t('slide_hint')}</p></div><div class="out" aria-live="polite"></div></div>`;
 const out=$('.out',el);
 const read=()=>{const v={};T.fields.forEach(f=>{const n=$('#'+id+'-'+f.k+'-n',el),r=$('#'+id+'-'+f.k,el);let x=parseFloat(n?n.value:r.value);if(!isFinite(x))x=parseFloat(r.value);v[f.k]=Math.max(f.min,x);});return v;};
 const upd=()=>{out.innerHTML=T.calc(read());T.fields.forEach(f=>{if(f.fmt==='')$('#'+id+'-'+f.k+'-o',el).textContent=+$('#'+id+'-'+f.k,el).value?t('yes'):t('no');});};
 T.fields.forEach(f=>{const r=$('#'+id+'-'+f.k,el),n=$('#'+id+'-'+f.k+'-n',el);
  r.addEventListener('input',()=>{if(n)n.value=+(+r.value).toFixed(2);upd();});
  if(n)n.addEventListener('input',()=>{const x=parseFloat(n.value);if(!isFinite(x))return;if(x>+r.max)r.max=x;r.value=Math.max(f.min,x);upd();});
  if(n)n.addEventListener('blur',()=>{const x=parseFloat(n.value);if(!isFinite(x)||x<f.min){n.value=f.min;r.value=f.min;upd();}});
 });
 upd();
}

 if(step===0){
  const g=p.gut,ans=st.gut;
  body=`<h2>${g.q}</h2><p class="sub">Guess before you learn. Being wrong here costs nothing.</p>
  <div class="opts">${g.opts.map((o,i)=>`<button class="opt ${ans==null?'':i===g.a?'right':i===ans?'wrong':''}" data-gut="${i}" ${ans!=null?'disabled':''}><i>${L[i]}</i><span>${o}</span></button>`).join('')}</div>
  ${ans!=null?`<div class="fb ${ans===g.a?'good':'bad'}"><h4>${ans===g.a?'You got it.':'Not quite.'}</h4><p>${g.ex}</p></div>
  <div><h4 style="margin-bottom:10px">How confident do you feel about this decision right now?</h4><div class="conf"><span>Not at all</span>${[1,2,3,4,5].map(n=>`<button data-c0="${n}" class="${st.c0===n?'pick':''}" aria-label="${n} of 5">${n}</button>`).join('')}<span>Very</span></div></div>`:''}`;
 } else if(step===1){
  body=`<h2>What you need to know</h2><div class="learn">${p.learn.map(([h,t],i)=>`<div><b>${i+1}</b><span><h4>${h}</h4><p>${t}</p></span></div>`).join('')}</div>`;
 } else if(step===2){
  body=`<h2>Run your own numbers</h2><p class="sub">Move the sliders to match your situation. Nothing is saved or sent.</p><div id="ptool"></div>`;
 } else if(step===3){
  const d=p.decide,pick=st.pick;
  body=`<h2>Your call</h2><div class="scenario"><p>${d.s}</p></div>
  <div class="opts">${d.opts.map((o,i)=>`<button class="opt ${pick===i?(o.r==='good'?'right':o.r==='bad'?'wrong':'meh'):''}" data-pick="${i}"><i>${L[i]}</i><span>${o.t}</span></button>`).join('')}</div>
  ${pick!=null?`<div class="fb ${d.opts[pick].r}"><h4>${d.opts[pick].r==='good'?'Strong choice.':d.opts[pick].r==='bad'?'This one costs you.':'This works, with a catch.'}</h4><p>${d.opts[pick].fb}</p></div>${d.opts[pick].r!=='good'?'<p class="note">Pick another option to compare outcomes.</p>':''}`:''}`;
 } else {
  const chosen=new Set(S.plan.filter(x=>x.path===p.id).map(x=>x.t));
  body=`<h2>Choose what you'll actually do</h2><p class="sub">Pick at least one. Your choices go to My plan, where you can check them off.</p>
  <div class="checks">${p.plan.map((a,i)=>`<label class="check"><input type="checkbox" id="pl-${p.id}-${i}" data-plan="${i}" ${chosen.has(a.t)?'checked':''}><span><b>${a.t}</b>${a.w?`<small>${a.href?`<a href="${a.href}" target="_blank" rel="noopener">${a.w}</a>`:a.w}</small>`:''}</span></label>`).join('')}</div>
  <div><h4 style="margin-bottom:10px">How confident do you feel about this decision now?</h4><div class="conf"><span>Not at all</span>${[1,2,3,4,5].map(n=>`<button data-c1="${n}" class="${st.c1===n?'pick':''}" aria-label="${n} of 5">${n}</button>`).join('')}<span>Very</span></div>
  ${st.c0&&st.c1?`<p class="note" style="margin-top:10px">You started at ${st.c0} and you're now at ${st.c1}.</p>`:''}</div>`;
 }
 const canNext=step===0?(st.gut!=null&&!!st.c0):step===3?st.pick!=null:true;
 const reach=st.done?4:(st.step||0);
 return `<div class="wrap page"><a class="back" href="#paths">${icon('left')}${t('all_decisions')}</a>${LANG!=='en'?`<p class="enonly">${t('en_only')}</p>`:''}
 <div class="dtitle"><span class="badge">${icon(PICON[p.id])}</span><div><h1>${pathTitle(p.id)}</h1><p class="muted" style="margin-top:4px">${pathQ(p.id)} ${t('about_time',pathTime(p))}</p></div></div>
 <div class="player"><nav class="stepper" aria-label="Steps">${STEPS.map((s,i)=>`<button data-go="${i}" class="${i===step?'on':i<reach||st.done?'done':''}" ${i>reach?'disabled':''} ${i===step?'aria-current="step"':''}><i>${i+1}</i>${s}</button>`).join('')}</nav>
 <div class="stage">${body}
 <div class="btnrow" style="margin-top:8px">${step>0?'<button class="btn line" id="pv-back">Back</button>':''}
 ${step===4?`<button class="btn slug" id="pv-finish">${st.done?'Update my plan':'Save to my plan'}</button>`:`<button class="btn" id="pv-next" ${canNext?'':'disabled'}>Continue</button>`}</div>
 ${step===0&&st.gut!=null&&!st.c0?'<p class="note">Rate your confidence to continue.</p>':''}</div></div></div>`;
}
function bindPath(p){
 const st=S.paths[p.id];const step=st.view??st.step??0;
 const go=n=>{st.view=n;st.step=Math.max(st.step||0,n);save();render();window.scrollTo({top:0});};
 $$('[data-go]').forEach(b=>b.onclick=()=>{st.view=+b.dataset.go;save();render();});
 $$('[data-gut]').forEach(b=>b.onclick=()=>{st.gut=+b.dataset.gut;save();render();});
 $$('[data-c0]').forEach(b=>b.onclick=()=>{st.c0=+b.dataset.c0;save();render();});
 $$('[data-c1]').forEach(b=>b.onclick=()=>{st.c1=+b.dataset.c1;save();render();});
 $$('[data-pick]').forEach(b=>b.onclick=()=>{st.pick=+b.dataset.pick;save();render();});
 $$('[data-plan]').forEach(c=>c.onchange=()=>{const a=p.plan[+c.dataset.plan];
  if(c.checked){if(!S.plan.some(x=>x.path===p.id&&x.t===a.t))S.plan.push({path:p.id,t:a.t,w:a.w,href:a.href||'',done:false});}
  else S.plan=S.plan.filter(x=>!(x.path===p.id&&x.t===a.t));save();});
 const t=$('#ptool');if(t)mountTool(t,p.tool,p.preset);
 const n=$('#pv-next');if(n)n.onclick=()=>go(step+1);
 const b=$('#pv-back');if(b)b.onclick=()=>{st.view=step-1;save();render();window.scrollTo({top:0});};
 const f=$('#pv-finish');if(f)f.onclick=()=>{
  if(!S.plan.some(x=>x.path===p.id)){toast('Pick at least one step first');return;}
  st.done=true;st.view=4;save();toast('Saved to My plan');location.hash='plan';};
}

const SIT=[
 {id:'food',ic:'cup',t:{en:'I\'m out of food or money for food',es:'Me quedé sin comida o sin dinero para comida',ko:'음식이 떨어졌거나 식비가 없어요',zh:'我没有吃的了，或没钱买吃的'},
  first:['cowell','rfm','slugcrisis'],also:['produce','swipes','calfresh'],
  bring:{en:['Your student ID number','A free PantrySoft account (make it before your first pantry visit)','A reusable bag'],es:['Tu número de estudiante','Una cuenta gratuita de PantrySoft (créala antes de tu primera visita a la despensa)','Una bolsa reutilizable'],ko:['학생 번호','무료 PantrySoft 계정 (첫 방문 전에 만들어 두세요)','장바구니'],zh:['你的学生号','免费的 PantrySoft 账号（第一次去食品站前先注册）','可重复使用的购物袋']},
  say:{en:'Hi, I\'m a UCSC student and I\'m short on food this week. What can I get today, and what should I sign up for so this doesn\'t happen again?',es:'Hola, soy estudiante de UCSC y esta semana no me alcanza para la comida. ¿Qué puedo recibir hoy y a qué me debo inscribir para que no me vuelva a pasar?',ko:'안녕하세요, UCSC 학생인데 이번 주 식비가 부족해요. 오늘 받을 수 있는 게 있을까요? 그리고 다시 이런 일이 없도록 신청해 둘 만한 게 있을까요?',zh:'你好，我是 UCSC 的学生，这周吃饭的钱不够了。今天我能领到什么？我该报名什么，才能避免以后再发生这种情况？'},
  know:{en:['Pantries are for exactly this. You don\'t have to prove anything beyond being a student.','Grants, scholarships and student loans used for school usually don\'t count as income for CalFresh, and CalFresh doesn\'t reduce your financial aid.','CalFresh has immigration rules. Undocumented students can still use every campus pantry listed here.'],es:['Las despensas existen justo para esto. No tienes que demostrar nada más que ser estudiante.','Las becas, subvenciones y préstamos estudiantiles para la escuela normalmente no cuentan como ingreso para CalFresh, y CalFresh no reduce tu ayuda financiera.','CalFresh tiene reglas migratorias. Los estudiantes indocumentados igual pueden usar todas las despensas del campus de esta lista.'],ko:['푸드 팬트리는 바로 이럴 때를 위한 곳이에요. 학생이라는 것 외에는 증명할 게 없어요.','학교 비용에 쓰는 장학금, 보조금, 학자금 대출은 보통 CalFresh 소득으로 계산되지 않고, CalFresh를 받아도 학자금은 줄지 않아요.','CalFresh에는 이민 신분 관련 규정이 있어요. 서류 미비 학생도 여기 있는 캠퍼스 팬트리는 모두 이용할 수 있어요.'],zh:['食品站就是为这种情况而设的，你只需要是学生，不需要证明别的。','用于学业的助学金、奖学金和学生贷款通常不算作 CalFresh 的收入，领取 CalFresh 也不会减少你的助学金。','CalFresh 有移民身份方面的规定，但无证学生仍然可以使用这里列出的所有校园食品站。']},
  site:['quarter','budget']},
 {id:'rent',ic:'house',t:{en:'I can\'t pay rent or might lose my housing',es:'No puedo pagar la renta o podría perder mi vivienda',ko:'월세를 못 내거나 집을 잃을 수도 있어요',zh:'我付不起房租，或可能失去住处'},
  first:['slugcrisis','dos'],also:['finaid','tenant'],
  bring:{en:['Your lease or housing contract','How much you owe and when it\'s due','Any notice from your landlord (a photo is fine)'],es:['Tu contrato de renta o de vivienda','Cuánto debes y para cuándo','Cualquier aviso de tu casero (una foto sirve)'],ko:['임대 계약서 또는 기숙사 계약서','밀린 금액과 납부 기한','집주인에게 받은 통지서 (사진도 괜찮아요)'],zh:['你的租约或住宿合同','欠款金额和截止日期','房东发来的任何通知（拍照也可以）']},
  say:{en:'I\'m a UCSC student and I can\'t cover my rent this month. I owe about [amount] by [date]. What options do I have?',es:'Soy estudiante de UCSC y no me alcanza para la renta de este mes. Debo aproximadamente [cantidad] para el [fecha]. ¿Qué opciones tengo?',ko:'UCSC 학생인데 이번 달 월세를 낼 수가 없어요. [날짜]까지 약 [금액]을 내야 해요. 어떤 방법이 있을까요?',zh:'我是 UCSC 的学生，这个月付不起房租。我需要在[日期]前支付大约[金额]。我有哪些选择？'},
  know:{en:['Call before the due date if you can. There are more options before rent is late than after.','Tell your landlord in writing (text or email) when you expect to pay. Keep a copy.','If you get an eviction notice, don\'t ignore it and don\'t move out right away. Call Tenant Sanctuary first.'],es:['Si puedes, llama antes de la fecha de pago. Hay más opciones antes de atrasarte que después.','Avísale a tu casero por escrito (mensaje o correo) cuándo piensas pagar. Guarda una copia.','Si recibes un aviso de desalojo, no lo ignores y no te mudes de inmediato. Llama primero a Tenant Sanctuary.'],ko:['가능하면 납부일 전에 전화하세요. 연체되기 전이 연체된 후보다 선택지가 많아요.','언제 낼 수 있는지 집주인에게 문자나 이메일로 알리고, 사본을 보관하세요.','퇴거 통지를 받으면 무시하지도, 바로 이사하지도 마세요. 먼저 Tenant Sanctuary에 전화하세요.'],zh:['如果可以，在截止日期前就打电话。逾期前的选择比逾期后多。','用短信或邮件书面告诉房东你预计什么时候能付，并保留副本。','如果收到驱逐通知，不要置之不理，也不要马上搬走。先给 Tenant Sanctuary 打电话。']},
  site:['lease','rent']},
 {id:'aid',ic:'cap',t:{en:'My financial aid is late, short or confusing',es:'Mi ayuda financiera llegó tarde, no alcanza o no la entiendo',ko:'학자금이 늦거나, 부족하거나, 이해가 안 돼요',zh:'我的助学金迟到、不够用或看不懂'},
  first:['finaid','slugcents'],also:['uss'],
  bring:{en:['Your student ID number','Your aid offer or a screenshot of your portal','Any email about a hold, missing document or change'],es:['Tu número de estudiante','Tu oferta de ayuda o una captura de pantalla de tu portal','Cualquier correo sobre una retención, un documento faltante o un cambio'],ko:['학생 번호','학자금 제안서 또는 포털 화면 캡처','홀드, 누락 서류, 변경 사항에 관한 이메일'],zh:['你的学生号','助学金方案或学生门户的截图','任何关于账户冻结、缺少文件或方案变动的邮件']},
  say:{en:'I\'m trying to understand my aid for this quarter. It [hasn\'t arrived / is less than I expected / has a hold]. Can you walk me through what\'s happening and what I need to do?',es:'Estoy tratando de entender mi ayuda de este trimestre. [No ha llegado / es menos de lo que esperaba / tiene una retención]. ¿Me pueden explicar qué está pasando y qué tengo que hacer?',ko:'이번 쿼터 학자금을 이해하려고 하는데요, [아직 안 들어왔어요 / 예상보다 적어요 / 홀드가 걸려 있어요]. 무슨 상황인지, 제가 뭘 해야 하는지 설명해 주실 수 있을까요?',zh:'我想弄清楚这个学季的助学金。它[还没到账 / 比我预期的少 / 被冻结了]。能帮我解释一下是怎么回事，以及我需要做什么吗？'},
  know:{en:['If your family\'s situation changed (a job loss, divorce, medical bills), you can ask Financial Aid to review your aid. It\'s called a special circumstances appeal.','You can accept part of a loan instead of all of it, and you can ask for more later in the year if you need it.','File the FAFSA or California Dream Act Application every year. The priority deadline is March 2.'],es:['Si la situación de tu familia cambió (pérdida de trabajo, divorcio, gastos médicos), puedes pedirle a Financial Aid que revise tu ayuda. Se llama apelación por circunstancias especiales.','Puedes aceptar solo una parte de un préstamo, y pedir más después en el año si lo necesitas.','Llena la FAFSA o la Solicitud del California Dream Act cada año. La fecha prioritaria es el 2 de marzo.'],ko:['가족 상황이 바뀌었다면(실직, 이혼, 의료비 등) Financial Aid에 학자금 재검토를 요청할 수 있어요. 이를 특별 사정 이의 신청(special circumstances appeal)이라고 해요.','대출은 전액이 아니라 일부만 받을 수 있고, 필요하면 학년 중에 추가로 요청할 수도 있어요.','FAFSA 또는 California Dream Act 신청서는 매년 내야 해요. 우선 마감일은 3월 2일이에요.'],zh:['如果家庭情况发生变化（失业、离婚、医疗费用等），你可以请 Financial Aid 重新审核你的助学金，这叫作特殊情况申诉（special circumstances appeal）。','贷款可以只接受一部分，学年中如有需要还可以再申请更多。','每年都要提交 FAFSA 或 California Dream Act 申请。优先截止日期是 3 月 2 日。']},
  site:['aid','loancost']},
 {id:'landlord',ic:'house',t:{en:'I have a problem with my landlord, lease or deposit',es:'Tengo un problema con mi casero, mi contrato o mi depósito',ko:'집주인, 계약서, 보증금 문제가 있어요',zh:'我和房东、租约或押金有纠纷'},
  first:['tenant','cro'],also:[],
  bring:{en:['Your lease','Texts and emails with your landlord','Dated photos of the problem or of the place at move-in','Rent receipts'],es:['Tu contrato','Mensajes y correos con tu casero','Fotos con fecha del problema o de cómo estaba el lugar al mudarte','Recibos de renta'],ko:['임대 계약서','집주인과 주고받은 문자와 이메일','문제나 입주 당시 상태를 찍은 날짜 있는 사진','월세 영수증'],zh:['你的租约','和房东往来的短信和邮件','带日期的照片：问题现状或入住时的房屋状况','房租收据']},
  say:{en:'I rent in Santa Cruz and my landlord [is keeping my deposit / raised my rent / won\'t fix something]. I\'d like to understand my rights before I respond.',es:'Rento en Santa Cruz y mi casero [se quiere quedar con mi depósito / me subió la renta / no quiere arreglar algo]. Quiero entender mis derechos antes de responder.',ko:'산타크루즈에서 월세를 살고 있는데 집주인이 [보증금을 안 돌려줘요 / 월세를 올렸어요 / 수리를 안 해 줘요]. 답하기 전에 제 권리를 알고 싶어요.',zh:'我在圣克鲁兹租房，房东[不退我的押金 / 给我涨了房租 / 不肯修东西]。在回复之前，我想先了解自己的权利。'},
  know:{en:['In California, a landlord has 21 days after you move out to return your deposit or send an itemized list of deductions.','During a fixed-term lease, rent usually can\'t go up unless your lease says it can.','Put requests in writing and keep copies. It protects you if there\'s a dispute later.'],es:['En California, el casero tiene 21 días después de que te mudas para devolverte el depósito o enviarte una lista detallada de los descuentos.','Durante un contrato de plazo fijo, normalmente la renta no puede subir a menos que el contrato lo permita.','Haz tus peticiones por escrito y guarda copias. Te protege si hay un problema después.'],ko:['캘리포니아에서는 퇴거 후 21일 안에 집주인이 보증금을 돌려주거나 공제 내역서를 보내야 해요.','정해진 기간의 임대 계약 중에는 계약서에 명시되지 않는 한 보통 월세를 올릴 수 없어요.','요청은 서면으로 하고 사본을 보관하세요. 나중에 분쟁이 생기면 나를 보호해 줘요.'],zh:['在加州，房东必须在你搬走后 21 天内退还押金，或寄给你一份扣款明细。','固定期限的租约期间，除非租约允许，房租通常不能上涨。','所有请求都用书面形式并保留副本，日后有纠纷时能保护你。']},
  site:['lease','rent']},
 {id:'bill',ic:'cash',t:{en:'I got hit with a surprise bill or emergency cost',es:'Me llegó una factura inesperada o un gasto de emergencia',ko:'갑자기 청구서나 긴급 비용이 생겼어요',zh:'突然收到一笔账单或紧急开支'},
  first:['dos','slugcents'],also:['finaid'],
  bring:{en:['The bill or estimate','What you have in your account right now'],es:['La factura o el presupuesto','Cuánto tienes ahora en tu cuenta'],ko:['청구서 또는 견적서','지금 통장에 있는 금액'],zh:['账单或报价单','你账户里现在有多少钱']},
  say:{en:'I had an unexpected [repair / medical bill / travel] cost of about [amount] and I can\'t cover it without falling behind on rent or food. Is there emergency help I can apply for?',es:'Tuve un gasto inesperado de [reparación / factura médica / viaje] de aproximadamente [cantidad] y no puedo pagarlo sin atrasarme con la renta o la comida. ¿Hay ayuda de emergencia que pueda solicitar?',ko:'예상치 못한 [수리비 / 병원비 / 교통비]로 약 [금액]이 나왔는데, 이걸 내면 월세나 식비가 밀려요. 신청할 수 있는 긴급 지원이 있을까요?',zh:'我遇到一笔意外的[维修费 / 医疗费 / 路费]，大约[金额]，付了它就会拖欠房租或饭钱。有我可以申请的紧急援助吗？'},
  know:{en:['Before putting it on a credit card, ask the company for a payment plan. Many say yes, often with no interest.','Slug Support\'s emergency fund is need-based and for emergencies only. The intake form isn\'t for same-day crises; call the crisis line for those.'],es:['Antes de pagarlo con tarjeta de crédito, pídele a la compañía un plan de pagos. Muchas aceptan, a menudo sin intereses.','El fondo de emergencia de Slug Support es según necesidad y solo para emergencias. El formulario no es para crisis del mismo día; para eso llama a la línea de crisis.'],ko:['신용카드로 결제하기 전에 업체에 분할 납부를 요청해 보세요. 이자 없이 해 주는 곳이 많아요.','Slug Support 긴급 기금은 필요 기반이며 긴급 상황에만 지원돼요. 접수 양식은 당일 위기용이 아니니, 급할 때는 위기 전화로 연락하세요.'],zh:['在刷信用卡之前，先请对方给你分期付款计划，很多机构会同意，而且通常不收利息。','Slug Support 紧急基金按需发放，仅用于紧急情况。申请表不适用于当天的危机，遇到这种情况请拨打危机热线。']},
  site:['cardpayoff']},
 {id:'taxes',ic:'cal',t:{en:'I need help with taxes or tax forms',es:'Necesito ayuda con los impuestos o formularios',ko:'세금이나 세금 서류 도움이 필요해요',zh:'我需要报税或税表方面的帮助'},
  first:['slugcents'],also:[],
  extra:{en:'SlugCents has offered free, in-person tax preparation by IRS-certified student volunteers each spring, for students with incomes up to about $67,000. Check their site in January for this season\'s days. IRS Free File is the online option.',es:'SlugCents ha ofrecido cada primavera preparación de impuestos gratuita y en persona con voluntarios estudiantiles certificados por el IRS, para estudiantes con ingresos de hasta unos $67,000. Revisa su sitio en enero para ver los días de esta temporada. IRS Free File es la opción en línea.',ko:'SlugCents는 매년 봄 IRS 공인 학생 자원봉사자가 소득 약 $67,000 이하 학생의 세금 신고를 대면으로 무료로 도와 왔어요. 이번 시즌 일정은 1월에 사이트에서 확인하세요. 온라인으로는 IRS Free File을 이용할 수 있어요.',zh:'SlugCents 每年春季都由 IRS 认证的学生志愿者，为收入约 $67,000 以下的学生提供免费的现场报税服务。本季的具体日期请在 1 月查看他们的网站。线上可以使用 IRS Free File。'},

function contactHTML(k,primary){const c=HC[k];
 const rows=[];
 if(c.where)rows.push(`<div><dt>${t('hp_where')}</dt><dd>${tx(c.where)}</dd></div>`);
 if(c.when)rows.push(`<div><dt>${t('hp_when')}</dt><dd>${tx(c.when)}</dd></div>`);
 const acts=[];
 if(c.ph)acts.push(`<a class="btn ${primary?'slug':'line'} sm" href="tel:+1${c.ph[0]}">${t('hp_call')} ${c.ph[1]}</a>`);
 if(c.em)acts.push(`<a class="btn line sm" href="mailto:${c.em}">${c.em}</a>`);
 if(c.em2)acts.push(`<a class="btn line sm" href="mailto:${c.em2}">${c.em2}</a>`);
 acts.push(`<a class="btn line sm" href="${c.u}" target="_blank" rel="noopener">${t('hp_web')}</a>`);
 return `<article class="hc"><h4 lang="en">${c.n}</h4><p>${tx(c.d)}</p>${rows.length?`<dl>${rows.join('')}</dl>`:''}<div class="hcact">${acts.join('')}</div></article>`;}

function sitDetail(s){const bring=tx(s.bring),know=tx(s.know);
 return `<div class="hdet" id="hdet" tabindex="-1">
  <button class="hback" data-hback>${icon('left')} ${t('hp_back')}</button>
  <h2>${tx(s.t)}</h2>
  <h3 class="hsub">${t('hp_first')}</h3><div class="hcs">${s.first.map(k=>contactHTML(k,true)).join('')}</div>
  ${s.extra?`<p class="hextra">${tx(s.extra)}</p>`:''}
  ${s.also.length?`<h3 class="hsub">${t('hp_also')}</h3><div class="hcs">${s.also.map(k=>contactHTML(k,false)).join('')}</div>`:''}
  <div class="hgrid">
   ${bring.length?`<section><h3 class="hsub">${t('hp_bring')}</h3><ul class="hlist">${bring.map(b=>`<li>${b}</li>`).join('')}</ul></section>`:''}
   <section><h3 class="hsub">${t('hp_say')}</h3><blockquote class="hsay" id="hsay">${esc(tx(s.say))}</blockquote><button class="btn line sm" data-hcopy>${t('hp_copy')}</button></section>
  </div>
  ${know.length?`<h3 class="hsub">${t('hp_know')}</h3><ul class="hlist">${know.map(b=>`<li>${b}</li>`).join('')}</ul>`:''}
  ${s.site.length?`<h3 class="hsub">${t('hp_site')}</h3><div class="btnrow">${s.site.map(id=>`<a class="btn line sm" href="#${id}">${siteLabel(id)}</a>`).join('')}</div>`:''}
 </div>`;}

  <div class="hpane" aria-live="polite">${sel?sitDetail(sel):`<div class="hempty"><p>${t('hp_choose')}</p></div>`}</div>
 </div>
 ${dates.length?`<section class="hdates"><h2>${t('hp_dates')}</h2>${dates.map((x,i)=>`<div class="hdate"><time datetime="${x.d}">${fmtDate(x.d)}</time><span>${tx(x.t)}</span><button class="btn line sm" data-ics="${i}">${t('hp_addcal')}</button></div>`).join('')}</section>`:''}
 <section class="htools"><h2>${t('hp_tools')}</h2><ul>${HTOOLS.map(([n,d,u])=>`<li><a href="${u}" target="_blank" rel="noopener" lang="en">${n}</a><span>${tx(d)}</span></li>`).join('')}</ul></section>
 <p class="hchecked">${t('hp_checked',fmtDate(CHECKED))} ${LANG!=='en'?t('hp_officeen')+' ':''}${t('hp_wrong')} <a href="https://www.linkedin.com/in/sungjun-lee-572283340" target="_blank" rel="noopener">${t('hp_tell')}</a>.</p>
 </div>`;};

function bindHelp(){
 $$('[data-sit]').forEach(b=>b.onclick=()=>{helpSel=b.dataset.sit===helpSel&&innerWidth>900?null:b.dataset.sit;render();const d=$('#hdet');if(d){d.focus({preventScroll:true});if(innerWidth<=900)d.scrollIntoView({block:'start'});}});
 $$('[data-hback]').forEach(b=>b.onclick=()=>{const id=helpSel;helpSel=null;render();const x=$(`[data-sit="${id}"]`);if(x){x.focus();if(innerWidth<=900)x.scrollIntoView({block:'center'});}});
 $$('[data-hcopy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText($('#hsay').textContent);b.textContent=t('hp_copied');}catch(e){const r=document.createRange();r.selectNodeContents($('#hsay'));const s=getSelection();s.removeAllRanges();s.addRange(r);}});
 const today=new Date().toISOString().slice(0,10),dates=HDATES.filter(x=>x.d>=today);
 $$('[data-ics]').forEach(b=>b.onclick=()=>{const x=dates[+b.dataset.ics],d=x.d.replace(/-/g,''),n=new Date(new Date(x.d+'T12:00:00').getTime()+864e5).toISOString().slice(0,10).replace(/-/g,'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Slugonomics//Campus help//EN','BEGIN:VEVENT',`UID:${d}-${Date.now()}@slugonomics`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').slice(0,15)}Z`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${n}`,`SUMMARY:${tx(x.t).replace(/,/g,'\\,')}`,`URL:${x.u}`,'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:Reminder','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));a.download=`slugonomics-${x.d}.ics`;document.body.appendChild(a);a.click();a.remove();});
}

/* ----- plan ----- */
V.plan=()=>{
 const done=PATHS.filter(p=>S.paths[p.id]?.done),items=S.plan,finished=items.filter(x=>x.done).length;
 const gains=done.filter(p=>S.paths[p.id].c0&&S.paths[p.id].c1);
 const avg=k=>gains.reduce((s,p)=>s+S.paths[p.id][k],0)/gains.length;
 const tried=PATHS.filter(p=>S.paths[p.id]?.gut!=null);
 if(!items.length&&!done.length)return `<div class="wrap page"><div class="pagehead"><h1>${t('nav_plan')}</h1><p>${t('plan_empty_p')}</p></div>
  <div class="empty"><h3>${t('plan_none')}</h3><p class="muted">${t('plan_none_p')}</p><div class="btnrow"><a class="btn slug" href="#checkup">${t('plan_first')}</a><a class="btn line" href="#paths">${t('plan_browse')}</a></div></div></div>`;
 return `<div class="wrap page"><div class="pagehead"><h1>${t('nav_plan')}</h1><p>${t('plan_p')}</p></div>
 <div class="summary"><div><b>${t('of',done.length,PATHS.length)}</b><span>${t('s_dec')}</span></div><div><b>${t('of',finished,items.length)}</b><span>${t('s_steps')}</span></div>
 <div><b>${gains.length?t('to',avg('c0').toFixed(1),avg('c1').toFixed(1)):t('none_yet')}</b><span>${t('s_conf')}</span></div><div><b>${tried.length?t('of',tried.filter(p=>S.paths[p.id].gut===p.gut.a).length,tried.length):t('none_yet')}</b><span>${t('s_guess')}</span></div></div>
 <div class="meter" aria-label="${t('of',finished,items.length)} ${t('s_steps')}"><div style="width:${items.length?finished/items.length*100:0}%"></div></div>
 <div style="margin-top:12px">${PATHS.filter(p=>items.some(x=>x.path===p.id)).map(p=>`<div class="plangroup"><h3>${icon(PICON[p.id])}${pathTitle(p.id)}</h3>${items.map((x,i)=>x.path!==p.id?'':`<label class="planitem ${x.done?'done':''}" lang="en"><input type="checkbox" id="pi-${i}" data-done="${i}" ${x.done?'checked':''}><span><b>${esc(x.t)}</b>${x.w?`<small>${x.href?`<a href="${x.href}" target="_blank" rel="noopener">${esc(x.w)}</a>`:esc(x.w)}</small>`:''}</span></label>`).join('')}</div>`).join('')}</div>
 <div class="btnrow" style="margin-top:28px"><button class="btn" id="copyplan">${t('plan_copy')}</button><a class="btn line" href="#paths">${t('plan_another')}</a><button class="btn line" id="resetall">${t('plan_clear')}</button></div>
 <div id="resetconfirm"></div>
 <p class="note" style="margin-top:14px">${t('plan_note')}</p></div>`;
};
function bindPlan(){
 $$('[data-done]').forEach(c=>c.onchange=()=>{S.plan[+c.dataset.done].done=c.checked;save();render();});
 const cp=$('#copyplan');if(cp)cp.onclick=async()=>{
  const txt=t('plan_title')+'\n\n'+PATHS.filter(p=>S.plan.some(x=>x.path===p.id)).map(p=>pathTitle(p.id)+'\n'+S.plan.filter(x=>x.path===p.id).map(x=>`[${x.done?'x':' '}] ${x.t}${x.w?' ('+x.w+')':''}${x.href?' '+x.href:''}`).join('\n')).join('\n\n');
  try{await navigator.clipboard.writeText(txt);toast(t('plan_copied'));}catch(e){$('#resetconfirm').innerHTML=`<textarea class="copybox" id="copybox" readonly>${esc(txt)}</textarea><p class="note">${t('plan_nocopy')}</p>`;}};
 const r=$('#resetall');if(r)r.onclick=()=>{$('#resetconfirm').innerHTML=`<div class="fb bad" style="margin-top:16px"><h4>${t('plan_sure')}</h4><p style="margin-bottom:12px">${t('plan_undo')}</p><button class="btn" id="resetyes">${t('plan_clear')}</button></div>`;$('#resetyes').onclick=()=>{S={paths:{},plan:[],checkup:null};save();ck={i:0,a:[]};render();toast(t('plan_cleared'));};};
}

/* ----- about / comparison ----- */
V.why=()=>`<div class="wrap page"><div class="pagehead"><h1>${t('why_h')}</h1><p>${t('why_p')}</p></div>
 <div class="scroll"><table class="cmp"><thead><tr><th></th><th>${t('cmp_typ')}</th><th>Slugonomics</th></tr></thead><tbody>
 ${STR.cmp.map(r=>`<tr><td>${row4(r[0])}</td><td>${row4(r[1])}</td><td>${row4(r[2])}</td></tr>`).join('')}
 </tbody></table></div>
 <section style="margin-top:72px"><h2>${t('next_h')}</h2>
 <div class="gaps">${STR.nx.map(r=>`<div><h3>${row4(r[0])}</h3><p>${row4(r[1])}</p></div>`).join('')}</div></section>
 <section style="margin-top:64px;padding-top:32px;border-top:1px solid var(--line)"><h2>${t('us_h')}</h2><p class="muted" style="margin-top:10px">${t('us_p')}</p></section></div>`;

/* ==================== router ==================== */
function render(){
 applyChrome();
 const h=(location.hash||'#home').slice(1)||'home';
 const app=$('#app');let html,after=null,nav=h;
 if(PATH[h]){html=pathView(PATH[h]);after=()=>bindPath(PATH[h]);nav='paths';}
 else if(TOOLS[h]){html=toolsView(h);after=()=>mountTool($('#toolmount'),h);nav='tools';}
 else if(h==='tools'){html=toolsView();after=()=>mountTool($('#toolmount'),'budget');}
 else if(h==='checkup'){html=V.checkup();after=bindCheckup;nav='paths';}
 else if(V[h]&&h!=='home'){html=V[h]();}
 else{html=V.home();nav='home';after=bindHome;}
 app.innerHTML=html;
 $$('.links a').forEach(a=>{const on=a.dataset.nav===nav;a.classList.toggle('on',on);on?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current');});
 $('#navlinks').classList.remove('open');$('#menubtn').setAttribute('aria-expanded','false');
 if(h==='resources')bindHelp();
 if(h==='plan')bindPlan();
 if(after)after();
 updCount();
}
let lastHash=null;
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);
 if(PATH[h]&&S.paths[h])S.paths[h].view=S.paths[h].done?4:S.paths[h].step||0;
 if(h==='checkup'&&lastHash!=='checkup'&&ck.i>=CHECK.length)ck={i:0,a:[]};
 lastHash=h;render();window.scrollTo({top:0});});
$('#menubtn').onclick=()=>{const n=$('#navlinks');n.classList.toggle('open');$('#menubtn').setAttribute('aria-expanded',n.classList.contains('open'));};
render();
</script>
</body>
</html>
