<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Slug Life</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone-first life journal. Header card (who you are now), stat gauges, a year-by-year diary;
   a fixed dock at the bottom with five sections and the big Age button. UCSC blue and gold, redwood green for good news. */
:root{
  --bg:#EDF2F7; --surface:#FFFFFF; --surface-2:#E1E8F0; --ink:#0B1F33; --muted:#4F6377; --line:#CAD6E2;
  --kelp:#003C6C; --kelp-ink:#FFFFFF; --gold:#FDC700; --gold-ink:#2A2100; --sea:#2A6F9E; --coral:#C9472E; --good:#22804F; --warn:#9A6400;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --dock-h:74px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071624; --surface:#0F2236; --surface-2:#16304A; --ink:#E6EEF7; --muted:#9DB2C7; --line:#24405E;
  --kelp:#8EC1F0; --kelp-ink:#04121F; --gold:#F4C94A; --gold-ink:#221A00; --sea:#72B4E2; --coral:#FF8A70; --good:#6BD69A; --warn:#F2B84B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071624; --surface:#0F2236; --surface-2:#16304A; --ink:#E6EEF7; --muted:#9DB2C7; --line:#24405E;
  --kelp:#8EC1F0; --kelp-ink:#04121F; --gold:#F4C94A; --gold-ink:#221A00; --sea:#72B4E2; --coral:#FF8A70; --good:#6BD69A; --warn:#F2B84B; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--dock-h) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.good{color:var(--good)}.bad{color:var(--coral)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}

.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--kelp);color:var(--kelp-ink);font-weight:800;padding:12px 20px;border-radius:14px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.row:focus-visible,.chip:focus-visible,.dock button:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header card */
.who{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ava{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:var(--gold-ink);background:var(--gold);position:relative}
.ava small{position:absolute;bottom:-6px;right:-6px;background:var(--kelp);color:var(--kelp-ink);font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:8px}
.who h1{font-size:22px;line-height:1.1}
.who .sub{font-size:14px;color:var(--muted)}
.cash{text-align:right}
.cash b{display:block;font-family:var(--mono);font-size:18px;font-weight:500}
.cash span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.g .top{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.g .top b{font-family:var(--mono);font-weight:500}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}

/* diary */
.diary{display:flex;flex-direction:column;gap:10px}
.yr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:52px 1fr;gap:10px}
.yr.now{border-color:var(--kelp);box-shadow:0 0 0 2px color-mix(in srgb,var(--kelp) 25%,transparent)}
.yr .age{font-family:var(--display);font-size:30px;line-height:1;color:var(--kelp)}
.yr .age small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:15px;min-width:0}
.yr li.k-good{color:var(--good)}.yr li.k-bad{color:var(--coral)}.yr li.k-big{font-weight:800}
.more{all:unset;cursor:pointer;color:var(--kelp);font-weight:800;font-size:14px;align-self:center;padding:6px 10px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px}
.panel h3{font-size:16px}
.rows{display:flex;flex-direction:column}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-size:19px}
.row .t{font-weight:700;display:block}
.row .s{font-size:13px;color:var(--muted);display:block}
.row .r{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.row[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:3px 0}
.kv span:last-child{font-family:var(--mono)}
.kv.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600;background:var(--surface)}
.chip.on{background:var(--kelp);border-color:var(--kelp);color:var(--kelp-ink)}
.chip[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.energy{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.energy i{width:14px;height:14px;border-radius:5px;background:var(--surface-2);border:1.5px solid var(--line)}
.energy i.on{background:var(--gold);border-color:var(--gold)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;border:1.5px solid var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--surface))}
.badge.no{border-color:var(--line);background:transparent;opacity:.5;font-weight:500}
.note{font-size:13px;color:var(--muted)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.dock .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 76px repeat(3,minmax(0,1fr));gap:2px;align-items:end}
.dock button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:12px;min-width:0}
.dock button .e{font-size:20px;line-height:1}
.dock button.on{color:var(--kelp);background:var(--surface-2)}
.dock .age{background:var(--gold);color:var(--gold-ink);border-radius:22px;height:70px;margin-top:-26px;justify-content:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);font-size:12px}
.dock .age b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.dock .age[aria-disabled="true"]{opacity:.6}

/* modal sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,14,10,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:22px;width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@keyframes up{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.sheet .where{font-family:var(--mono);font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);display:flex;justify-content:space-between;gap:10px;align-items:center}
.opt:hover{border-color:var(--kelp)}
.opt .t{font-weight:700}.opt .s{display:block;font-size:13px;color:var(--muted);font-weight:400}
.opt .tag{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

/* create */
.hero{border-radius:24px;overflow:hidden;position:relative;background:#0E2B22;color:#F3F7F4;min-height:250px;display:flex;align-items:flex-end}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:22px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,62px);line-height:.95;color:#F7F3E3}
.hero h1 span{color:#F2C230}
.hero p{color:#CFE2D7;max-width:46ch}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.cities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.cities{grid-template-columns:1fr}}
.city{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);min-width:0}
.city.on{border-color:var(--kelp);box-shadow:0 0 0 2px color-mix(in srgb,var(--kelp) 30%,transparent)}
.city b{display:block}.city span{font-size:12.5px;color:var(--muted)}
.city:focus-visible{outline:3px solid var(--gold)}
.credit{font-size:12px;color:var(--muted);text-align:center;margin:14px auto 4px;letter-spacing:.02em}
.credit b{color:var(--ink);font-weight:700}
.credit-about{font-weight:600;color:var(--kelp)}
footer{font-size:12px;color:var(--muted);text-align:center;max-width:60ch;margin:4px auto 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 30px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;max-width:90vw;text-align:center}

/* ===== v2: learning + tabs ===== */
.avbtn{all:unset;cursor:pointer;border-radius:18px}.avbtn:focus-visible{outline:3px solid var(--gold)}
.cash{all:unset;cursor:pointer;text-align:right}
.meter{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.g .top b em{font-style:normal;font-size:11px;margin-left:4px;padding:0 5px;border-radius:6px;animation:pop .5s ease}
.g .top b em.up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}.g .top b em.dn{color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.lifebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.pips i{width:16px;height:16px;border-radius:6px;background:var(--surface-2);border:1.5px solid var(--line)}
.pips i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.nb{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.nb b{font-family:var(--mono);font-weight:500}.nb:focus-visible{outline:3px solid var(--gold)}
.nwline{font-size:14px;color:var(--muted)}
.goals{display:flex;flex-direction:column;gap:6px}
.goal{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--line);font-size:14px;font-weight:600}
.goal.ok{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.goal.no{opacity:.6}
.thead{display:flex;gap:12px;align-items:flex-start}
.thead h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.thead p{font-size:14px;color:var(--muted)}
.back{all:unset;cursor:pointer;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-weight:800;flex-shrink:0}
.back:focus-visible{outline:3px solid var(--gold)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph h3{font-size:17px}
.big{font-size:17px;font-weight:700}.big2{font-size:22px}
.hint{font-size:13px;color:var(--muted)}
.warn{color:var(--warn)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.spark{display:block}
.ladder{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin:4px 0 0 8px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0 6px 14px;position:relative;font-size:14px;color:var(--muted)}
.rung .dot{position:absolute;left:-9px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.rung.past{color:var(--ink)}.rung.past .dot{background:var(--kelp);border-color:var(--kelp)}
.rung.cur{color:var(--ink);font-weight:800}.rung.cur .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.rung .rn{grid-column:1/2}
.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.jobs{grid-template-columns:1fr}}
.job{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.jt{display:flex;flex-direction:column}.jm{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.req{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;border:1.5px solid currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--coral)}
.fxc{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--surface-2);white-space:nowrap}
.fxc b{font-family:var(--mono);font-weight:500}
.fxc.up{color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.fxc.dn{color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--surface))}
.fxc.cost{color:var(--gold-ink);background:var(--gold)}
.fxc.ok{color:var(--good);background:transparent;border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.fxc.warn{color:var(--warn);background:transparent;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.fxc.lockc{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.sub2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.lock{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.lock:last-child{border-bottom:0}
.nwp .nw{font-family:var(--display);font-size:40px;line-height:1;color:var(--kelp)}
.nwp .nw.bad{color:var(--coral)}
.split{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.blist{display:flex;flex-direction:column}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border-bottom:0}
.share{display:flex;flex-direction:column;gap:4px}
.track{position:relative;height:10px;border-radius:6px;background:var(--surface-2)}
.track i{display:block;height:100%;border-radius:6px}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.alert{font-size:14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--coral) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--coral) 40%,var(--line))}
.seg .chip small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;opacity:.85}
.chip.on small{opacity:1}
input[type=range]{width:100%;accent-color:var(--kelp)}
.proj{font-size:15px}.proj b{font-family:var(--mono);color:var(--kelp)}
.debt{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.facts{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1.5px solid var(--gold);font-size:14px;font-weight:600}
.pgrid{display:flex;flex-direction:column;gap:10px}
.pc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
@media (max-width:440px){.pc{grid-template-columns:auto minmax(0,1fr)}.pb{grid-column:1/-1}}
.pav{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#14211B}
.pi{display:flex;flex-direction:column;min-width:0}
.pb{display:flex;gap:6px}
.cats{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
.cats .chip{flex-shrink:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover:not([aria-disabled="true"]){transform:translateY(-3px);border-color:var(--kelp);box-shadow:0 10px 22px -16px rgba(0,0,0,.5)}
.tile:active:not([aria-disabled="true"]){transform:scale(.97)}
.tile:focus-visible{outline:3px solid var(--gold)}
.tile[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.tile.locked{background:var(--bg)}
.ti{font-size:30px;line-height:1}
.tn{font-weight:800;font-size:15px;line-height:1.2}

.lbr{border-left:1.5px solid var(--line)}

/* ===== v5: cuter, friendlier skin ===== */
:root{--bg:#EAF3FC;--surface-2:#E3EDF8;--line:#CFDDEC;--pink:#F49AA0;--mint:#BFEBD3;--sky:#CFE6FF;--shadow-soft:0 10px 26px -16px rgba(0,60,108,.38)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pink:#C76D78;--mint:#1F5A43;--sky:#173A5E;--shadow-soft:0 10px 26px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--pink:#C76D78;--mint:#1F5A43;--sky:#173A5E;--shadow-soft:0 10px 26px -14px rgba(0,0,0,.7)}
body{background:radial-gradient(600px 400px at 0% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%),radial-gradient(700px 500px at 100% 30%,color-mix(in srgb,var(--sky) 70%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.panel{border-radius:24px;border:1.5px solid var(--line);box-shadow:var(--shadow-soft);padding:18px;gap:12px}
.panel h2{font-size:24px;color:var(--kelp)}
.panel h3,.rgrp h3{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.01em}
.btn{border-radius:999px;padding:13px 22px;box-shadow:0 4px 0 color-mix(in srgb,var(--kelp) 55%,#000);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--kelp) 55%,#000)}
.btn.gold{box-shadow:0 4px 0 #C99A00}.btn.gold:active{box-shadow:0 1px 0 #C99A00}
.btn.ghost{box-shadow:none;background:var(--surface)}.btn.ghost:active{transform:scale(.97)}
.btn.sm{border-radius:999px}
.btn.big{width:100%;font-size:18px;padding:16px 22px;font-family:var(--display);font-weight:400;letter-spacing:.02em}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.mode:focus-visible,.city:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chip{padding:9px 15px;font-weight:700;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{box-shadow:0 3px 0 color-mix(in srgb,var(--kelp) 55%,#000)}
.opt{border-radius:18px;background:var(--surface);transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--kelp);transform:translateY(-1px)}
.city{border-radius:18px;background:var(--surface)}
.city.on{background:color-mix(in srgb,var(--sky) 60%,var(--surface))}
.sheet{border-radius:28px;padding:22px;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.dock{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1.5px solid var(--line);border-radius:26px;box-shadow:0 14px 34px -14px rgba(0,30,60,.45);padding:8px 8px 6px}
.dock button{border-radius:16px;transition:transform .12s}
.dock button.on{background:color-mix(in srgb,var(--gold) 26%,var(--surface));color:var(--ink)}
.dock button.on .e{transform:scale(1.15)}
.dock .age{border-radius:50%;width:72px;height:72px;margin:-30px auto 0;border:4px solid var(--surface);box-shadow:0 5px 0 #C99A00,0 12px 24px -10px rgba(0,0,0,.45)}
.dock .age:active{transform:translateY(3px)}
.hero{border-radius:28px}
.hero .slug{position:absolute;right:14px;top:-62px;width:96px;height:64px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.hero .in{position:relative}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.how>div{border-radius:20px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:20px;border:2px solid var(--line);background:var(--surface);min-width:0;transition:transform .12s}
.mode:active{transform:scale(.98)}

  housing:"parents",life:"moderate",
  people:[],log:[{age:18,year:YEAR0,lines:[]}],flags:{},peakNW:0,stress:0,
  last:last,pending:null,queue:[],death:null,lastMoney:null};

 const W=WEALTH[wealth];
 const m=person("mother",ri(41,56),{gender:"woman",job:pick(PARENT_JOBS[wealth])});
 const f=person("father",ri(42,59),{gender:"man",job:pick(PARENT_JOBS[wealth])});
 G.people.push(m,f);
 const sibs=pick([0,0,1,1,1,2]);for(let i=0;i<sibs;i++)G.people.push(person("sibling",ri(12,26)));
 const C=CITIES[G.city];
 G.edu.lvl=1;G.edu.hsGpa=Math.round(clamp(2.4+G.st.smarts/55+gauss()*0.3,1.8,4)*100)/100;
 G.st.smarts=clamp(G.st.smarts+8);

 say(`Your mother, ${m.name}, is a ${m.job}. Your father, ${f.name}, is a ${f.job}.`);
 if(sibs)say(`You have ${sibs===1?"a sibling":"two siblings"}: ${people("sibling").map(p=>p.name).join(" and ")}.`);

 else{G.cash=W.gift;say(`Your family is ${W.n.toLowerCase()} financially. You have ${$(G.cash)} saved from graduation gifts.`);G.queue=["afterHS"];}

const isStudent=()=>!!(G.edu.in&&["ucsc","cabrillo","grad"].includes(G.edu.in.type));
const inSchool=()=>!!G.edu.in;
const netWorth=()=>G.cash+G.invest+(G.house?G.house.value:0)-G.debt.student-G.debt.card-G.debt.mortgage;

function jobTitle(){if(!G.job)return"";const J=jobDef(G.job.id);return J.steps[Math.min(G.job.step,J.steps.length-1)];}
function statusLine(){
 if(!G.alive)return`${G.death.age} years, ${G.year-G.age}–${G.year}`;

  if(s.type==="cabrillo")return`Cabrillo College · ${s.track}`;if(s.type==="grad")return`${s.n} · year ${s.yr}`;
  return s.name+(G.job?` · ${jobTitle()}`:"");}
 if(G.retired)return"Retired";
 if(G.job){const J=jobDef(G.job.id);return`${jobTitle()} · ${J.co}`;}
 return G.age<5?"Toddler":G.age>=18?"Unemployed":"Kid";
}
function credit(){
 if(G.age<18)return null;
 if(!G.card&&!G.debt.student&&!G.debt.mortgage&&!G.flags.everDebt)return null;
 let s=690+Math.min(60,(G.flags.creditYears||0)*4);
 if(G.debt.card>0){const u=G.debt.card/Math.max(1,G.flags.limit||2000);s-=u>1?120:u>0.5?60:u>0.3?25:0;}
 s-=(G.flags.missed||0)*35;
 return clamp(Math.round(s),300,850);
}

/* ======================= SCHOOL ======================= */
function gpaFrom(smarts,effort,diff=1){return Math.round(clamp(1.2+smarts/38+effort*0.25-(G.stress>60?0.3:0)+gauss()*0.22-(diff-1)*0.8,0,4)*100)/100;}
function schoolYear(){
 const a=G.age,C=CITIES[G.city];
 if(a===5){G.edu.in={type:"elem",name:C.elem,yr:1};say(`You started kindergarten at ${C.elem}.`);}
 else if(a===11&&G.edu.in&&G.edu.in.type==="elem"){G.edu.in={type:"middle",name:"middle school",yr:1};say("You started middle school.");}
 else if(a===14&&G.edu.in&&G.edu.in.type==="middle"){G.edu.in={type:"high",name:C.hs,yr:1,gpas:[]};say(`You started freshman year at ${C.hs}.`,"k-big");}
 const s=G.edu.in;if(!s)return;
 const eff=G.flags.effort||0;G.flags.effort=0;
 if(["elem","middle"].includes(s.type)){G.st.smarts=clamp(G.st.smarts+ri(1,3)+eff);s.yr++;return;}
 if(s.type==="high"){
  if(s.yr>1||a>14){}
  G.st.smarts=clamp(G.st.smarts+ri(0,2)+eff);
  if(a>14){const g=gpaFrom(G.st.smarts,eff);s.gpas.push(g);say(`You finished the school year with a ${g.toFixed(2)} GPA.`,g>=3.5?"k-good":g<2?"k-bad":"");}
  s.yr++;
  if(a===18){
   const gpa=s.gpas.length?s.gpas.reduce((x,y)=>x+y,0)/s.gpas.length:2.5;G.edu.hsGpa=Math.round(gpa*100)/100;
   if(gpa<1.6&&pr(0.6)){say(`You didn't earn enough credits to graduate from ${s.name}. You can still get a GED later.`,"k-bad");G.edu.in=null;G.flags.noHS=true;}
   else{say(`You graduated from ${s.name} with a ${G.edu.hsGpa.toFixed(2)} GPA.`,"k-big");G.edu.lvl=1;G.edu.in=null;}
   G.queue.unshift("afterHS");
  }
  return;
 }
 if(s.type==="ucsc"||s.type==="grad"||s.type==="cabrillo"){
  const diff=s.type==="ucsc"?MAJORS[G.edu.major].diff:s.type==="grad"?1.2:1;
  const work=s.fund==="work"?1:0;
  const g=gpaFrom(G.st.smarts,eff-work*0.6,diff);s.gpas.push(g);G.st.smarts=clamp(G.st.smarts+ri(1,3)+eff);
  const avg=s.gpas.reduce((x,y)=>x+y,0)/s.gpas.length;
  say(`${s.type==="ucsc"?"UCSC":s.type==="grad"?s.n:"Cabrillo"} year ${s.yr}: ${g.toFixed(2)} GPA (cumulative ${avg.toFixed(2)}).`,g>=3.5?"k-good":g<2?"k-bad":"");
  if(avg<1.8&&s.gpas.length>=2&&pr(0.5)){say(`Your grades dropped too low. You were academically dismissed.`,"k-bad");G.edu.in=null;G.housing=G.housing==="dorm"?"parents":G.housing;return;}
  s.yr++;
  if(s.yr>s.len){graduateFrom(s,avg);}
 }
}
function graduateFrom(s,avg){
 if(s.type==="ucsc"){
  G.edu.degrees.push(`B.A./B.S. ${MAJORS[G.edu.major].n}, UC Santa Cruz`);G.edu.lvl=Math.max(G.edu.lvl,3);G.edu.field=MAJORS[G.edu.major].field;G.edu.ucscGpa=Math.round(avg*100)/100;
  say(`You walked at ${G.edu.college} College commencement and graduated from UC Santa Cruz with a degree in ${MAJORS[G.edu.major].n}. Fiat slug!`,"k-big");G.flags.ucscGrad=true;
  if(G.housing==="dorm")G.housing="parents";
  if(G.real&&G.real.campus&&G.housing==="real"){G.housing="shared";G.real.rentHome=null;G.real.campus=false;applyRealDefs();say("You moved out of campus housing into a shared room on the Westside.");}
  G.edu.in=null;G.queue.unshift("afterCollege");

function eligible(J){
 if(G.age<J.minAge||(J.maxAge&&G.age>J.maxAge))return false;
 if(J.custom)return false;
 if(J.ucsc&&!(G.edu.in&&G.edu.in.type==="ucsc"))return false;
 if(G.edu.lvl<J.edu)return false;
 if(J.field&&!J.any&&G.edu.field!==J.field)return false;
 if(isStudent()&&!J.part&&!J.gig)return false;
 if(G.edu.in&&["elem","middle","high"].includes(G.edu.in.type)&&!J.part)return false;
 return true;
}
function refreshBoard(){
 if(G.boardYear===G.age)return;G.boardYear=G.age;
 const pool=JOBS.filter(eligible).filter(J=>!G.job||J.id!==G.job.id);
 const sorted=pool.sort(()=>R()-.5);
 G.board=sorted.slice(0,6).map(J=>J.id);
}
function salaryOf(J,step,yrs){return Math.round(J.pay*Math.pow(J.raise||1.18,step)*(1+Math.min(0.2,yrs*0.01))/100)*100;}
function oddsOf(J){
 let p=0.42+(G.st.smarts-50)/220+(G.edu.lvl-J.edu)*0.08+(G.st.social-50)/300+(G.flags.resume||0)*0.03;
 if(J.fit&&G.st.health<J.fit)p-=0.35;if(J.part)p+=0.2;if(G.edu.ucscGpa&&G.edu.ucscGpa>=3.5)p+=0.08;
 if(G.job&&G.job.perf>=65)p+=0.06;
 return clamp(p,0.05,0.95);
}
function applyJob(id){
 const J=jobDef(id);const p=oddsOf(J);
 if(pr(p)){
  if(G.job)leaveJob(`You left your job as ${jobTitle().toLowerCase()}.`);
  G.job={id,step:0,yrs:0,stepYrs:0,perf:ri(45,60),salary:salaryOf(J,0,0)};
  G.board=G.board.filter(x=>x!==id);
  say(`You were hired as a ${J.n.toLowerCase()} at ${J.co}${J.part?" (part-time)":""}.`,"k-good");
  if(!J.part&&!G.flags.qPay){G.flags.qPay=1;G.queue.push("q_paystub");nextPending();}
  return true;
 }
 say(`You applied to be a ${J.n.toLowerCase()} at ${J.co} but didn't get the job.`,"k-bad");return false;
}
function leaveJob(msg){if(!G.job)return;G.jobHist.push({t:jobTitle(),co:jobDef(G.job.id).co,yrs:G.job.yrs,sal:G.job.salary});if(msg)say(msg);G.job=null;}

 j.yrs++;j.stepYrs++;
 j.perf=clamp(j.perf+ri(-7,4)+(G.flags.hard?12:0)+(G.st.happy<30?-6:0)+(G.st.smarts-55)/12);G.flags.hard=0;
 if(J.volatile){j.salary=Math.round(salaryOf(J,j.step,j.yrs)*(0.6+R()*0.9)/100)*100;}
 else j.salary=Math.max(j.salary,salaryOf(J,j.step,j.yrs));
 if(j.perf>=68&&j.stepYrs>=2&&j.step<J.steps.length-1&&pr(0.45)){j.step++;j.stepYrs=0;j.salary=salaryOf(J,j.step,j.yrs);say(`Promotion! You're now ${J.steps[j.step].toLowerCase()} at ${J.co}, earning ${$(j.salary)} a year.`,"k-good k-big");teach("promotion");if(j.step===J.steps.length-1)G.flags.topStep=true;G.st.happy=clamp(G.st.happy+6);}

 else if(!J.part&&pr(0.025)){leaveJob();say(`${J.co.replace(/^a /,"A ")} had layoffs, and your position was cut.`,"k-bad");G.st.happy=clamp(G.st.happy-8);return;}
 if(J.part&&G.age>(J.maxAge||99)){leaveJob(`You aged out of your job at ${J.co}.`);}

function moneyYear(){
 const M={inc:[],out:[]};const infl=1; /* all money is in 2026 dollars */const add=(arr,l,v)=>{if(v>0.5)arr.push([l,Math.round(v)]);};
 const sp=partner(),married=sp&&sp.rel==="spouse";
 // income
 if(G.job){const J=jobDef(G.job.id);const gross=G.job.salary;const net=gross*(1-taxRate(gross));add(M.inc,`${jobTitle()} (after tax)`,net);G.cash+=net;G.flags.earned=(G.flags.earned||0)+gross;}
 if(G.retired){const ss=Math.max(16000*infl,(G.flags.lastSalary||40000)*0.38);add(M.inc,"Social Security (est.)",ss);G.cash+=ss;}
 if(G.age>=10&&G.age<18){const a=WEALTH[G.wealth].allowance*12;if(a){add(M.inc,"Allowance",a);G.cash+=a;}}
 if(G.age>=18){
  // school
  const RS=G.real&&G.edu.in&&G.edu.in.fund==="real";
  if(RS){const R=G.real;add(M.out,`${G.edu.in.type==="ucsc"?"UCSC":"Cabrillo"} tuition & fees`,R.fees);if(R.grants)add(M.inc,"Grants & scholarships",R.grants);if(R.loans){add(M.inc,"Student loans",R.loans);G.debt.student+=R.loans;if(!G.flags.qLoan){G.flags.qLoan=1;G.queue.push("q_loans");}}G.cash+=R.grants+R.loans-R.fees;}
  if(G.real&&G.real.family&&(RS||G.age<22)){const f=G.real.family*12;add(M.inc,"Help from family",f);G.cash+=f;}
  if(!RS&&G.edu.in&&G.edu.in.type==="ucsc"){const c=ucscYearCost();let gap=c.gap*infl;
   if(G.edu.in.fund==="work"){const w=12000;add(M.inc,"Campus job (part-time)",w);G.cash+=w;}
   add(M.out,"UCSC tuition, fees & housing (after grants and family help)",gap);
   const loan=Math.min(gap,G.edu.in.fund==="family"?0:G.edu.in.fund==="work"?Math.max(0,gap-12000):gap);
   if(loan>0){G.debt.student+=loan;add(M.inc,"Student loans",loan);if(!G.flags.qLoan){G.flags.qLoan=1;G.queue.push("q_loans");}}
   G.cash+=loan-gap;}
  if(!RS&&G.edu.in&&G.edu.in.type==="cabrillo"){add(M.out,"Cabrillo fees & books",(CABRILLO_FEES+900)*infl);G.cash-=(CABRILLO_FEES+900)*infl;}
  if(G.edu.in&&G.edu.in.type==="grad"){const c=G.edu.in.cost;G.debt.student+=c;add(M.inc,"Graduate school loans",c);add(M.out,"Graduate tuition",c);}
  // housing
  const H=HOUSING[G.housing];
  if(H.rent){if(!G.flags.qRent&&!H.student){G.flags.qRent=1;G.queue.push("q_rent");}const r=H.rent*infl*(G.flags.rentMult||1)*12*(married?0.55:1);add(M.out,`Rent: ${H.n.toLowerCase()}`,r);G.cash-=r;}
  if(G.house){const tax=G.house.value*0.011,ins=2400;add(M.out,"Property tax & insurance",(tax+ins)*(married?0.55:1));G.cash-=(tax+ins)*(married?0.55:1);}
  // living
  let life=LIFESTYLE[G.life].c*infl;if(G.life!=="real"){if(G.housing==="parents")life*=0.55;if(isStudent())life*=0.6;}if(married)life*=0.6;
  add(M.out,`Living costs (${LIFESTYLE[G.life].n.toLowerCase()})`,life);G.cash-=life;
  if(G.job&&jobDef(G.job.id).commute){add(M.out,"Highway 17 commute",3200*infl);G.cash-=3200*infl;}
  const kids=people("child").filter(k=>k.age<18).length;if(kids){const k=kids*15000*infl*(married?0.55:1);add(M.out,`Raising ${kids} kid${kids>1?"s":""}`,k);G.cash-=k;}
 }
 // debts
 if(G.debt.student>0){
  if(isStudent()){const i=G.debt.student*LOAN_RATE*0.5;G.debt.student+=i;}
  else{if(!G.stuPay){teach("repayment");}if(!G.stuPay)G.stuPay=pmt(G.debt.student,LOAN_RATE/12,120)*12;const i=G.debt.student*LOAN_RATE;const p=Math.min(G.stuPay,G.debt.student+i);G.debt.student+=i-p;G.cash-=p;add(M.out,"Student loan payments",p);if(G.debt.student<1){G.debt.student=0;G.stuPay=0;say("You paid off your student loans!","k-good");G.flags.loanFree=true;}}
 }
 if(G.debt.mortgage>0){const i=G.debt.mortgage*MORT_RATE,p=Math.min(G.mortPay,G.debt.mortgage+i);G.debt.mortgage+=i-p;G.cash-=p;add(M.out,"Mortgage payments",p);if(G.debt.mortgage<1){G.debt.mortgage=0;say("You paid off your mortgage. The house is all yours.","k-good k-big");}}
 if(G.house)G.house.value*=1+0.04+gauss()*0.04;
 if(G.debt.card>0){const i=G.debt.card*CARD_APR;G.debt.card+=i;if(i>50)teach("apr");add(M.out,"Credit card interest",i);}
 if(G.invest>0){const r=0.05+gauss()*0.15;const g=G.invest*r;G.invest+=g;if(r<-0.05)teach("volatility");if(Math.abs(g)>1)(g>0?M.inc:M.out).push([`Investments ${g>0?"gained":"lost"} (${(r*100).toFixed(1)}%)`,Math.round(Math.abs(g))]);}
 if(G.debt.card>0&&G.cash>1000){const p=Math.min(G.debt.card,G.cash-1000);G.debt.card-=p;G.cash-=p;add(M.out,"Debt payments",p);}
 if(G.cash<0){const short=-G.cash;G.cash=0;G.debt.card+=short;G.flags.everDebt=true;
  if(G.age>=18){say(`You came up ${$(short)} short this year. It went onto ${G.card?"your credit card":"high-interest debt"}.`,"k-bad");G.st.happy=clamp(G.st.happy-6);if(!G.card)G.flags.missed=(G.flags.missed||0)+1;}}
 const inc=G.job?G.job.salary:15000;
 if(G.age>=18&&G.debt.card>Math.max(40000,inc*1.5)){say(`Your debts grew out of control (${$(G.debt.card)}). You filed for bankruptcy. The debt is gone, but your credit is badly damaged.`,"k-bad k-big");G.debt.card=0;G.flags.bankrupt=(G.flags.bankrupt||0)+1;teach("bankruptcy");G.flags.missed=(G.flags.missed||0)+4;G.st.happy=clamp(G.st.happy-15);G.invest=0;}
 if(G.card||G.debt.student||G.debt.mortgage)G.flags.creditYears=(G.flags.creditYears||0)+1;
 G.lastMoney=M;
 const nw=netWorth();if(nw>G.peakNW)G.peakNW=nw;
}

function ageUp(){

 const before={...G.st,nw:netWorth()};
 G.age++;G.year++;G.energy=3;G.log.push({age:G.age,year:G.year,lines:[]});
 // people
 for(const p of G.people){if(!p.alive)continue;p.age++;p.bond=clamp(p.bond-(p.rel==="friend"?4:2));
  if(p.age>=55){const q=0.00005*Math.exp(0.088*p.age);if(pr(q)){p.alive=false;say(`Your ${p.rel==="spouse"?"spouse":p.rel}, ${p.name}, died at ${p.age}.`,"k-bad k-big");G.st.happy=clamp(G.st.happy-(p.bond>50?18:8));
    if(p.rel==="spouse"){G.flags.widowed=true;}
    if(["mother","father"].includes(p.rel)&&G.age>=18){const inh=Math.round(WEALTH[G.wealth].gift*(R()*20+5));G.cash+=inh;say(`You inherited ${$(inh)}.`,"k-good");}}}
  if(p.rel==="child"&&p.age===18)say(`Your ${p.gender==="woman"?"daughter":p.gender==="man"?"son":"kid"} ${p.name} turned 18.`);
  if(p.rel==="sibling"&&p.age===18&&G.age<18)say(`Your sibling ${p.name} moved out.`);
 }
 const sp=partner();if(sp&&sp.bond<12&&pr(0.6)){endRelationship(sp,true);}
 schoolYear();
 jobYear();
 if(G.age===16){say("You're 16. You can now get a part-time job and a driver's license.");G.queue.push("license");}
 if(G.age===18&&!G.flags.adultSaid){G.flags.adultSaid=1;say("You're legally an adult.");}
 if(G.age===21)say("You turned 21.");
 if(G.age>=18&&G.housing==="parents"&&G.age>=27&&pr(0.25)){say("Your parents are hinting it might be time to move out.");G.st.happy=clamp(G.st.happy-3);}
 moneyYear();if(G.age<18&&G.cash<0)G.cash=0;
 // stats drift
 const a=G.age;
 const dh=a<40?ri(-1,2):a<60?ri(-2,1):a<75?ri(-2,1):ri(-3,0);
 G.st.health=clamp(G.st.health+dh-(G.life==="lavish"?1:0)-(G.stress>70?2:0));
 let target=52+(LIFESTYLE[G.life].h*2)+(sp&&sp.bond>60?8:0)+(G.debt.card>10000?-10:0)+(G.cash<1000&&a>=18?-4:0)-(G.stress>60?6:0)+(people(["mother","father","sibling","friend","child"]).filter(p=>p.bond>=70).length>=2?3:0)+(G.job&&a>=18?3:a>=22&&!G.edu.in&&!G.retired?-6:0);
 G.st.happy=clamp(Math.round(G.st.happy*0.7+target*0.3+ri(-4,4)));
 G.st.social=clamp(G.st.social+ri(-3,1)+(people("friend").length>=2?1:0));
 if(a>65)G.st.smarts=clamp(G.st.smarts-ri(0,1));
 // events
 G.queue=G.queue.concat(rollEvents());
 if(G.age>=30&&!G.flags.healthAct)G.st.health=clamp(G.st.health-1);
 if(G.age===40&&!G.lessons.includes("health"))teach("health");
 G.flags.healthAct=0;
 G.happySum+=G.st.happy;
 checkGoals();
 G.delta={health:G.st.health-before.health,happy:G.st.happy-before.happy,smarts:G.st.smarts-before.smarts,social:G.st.social-before.social,nw:netWorth()-before.nw};
 nextPending();
 deathCheck();
 save();
}
function deathCheck(){
 if(!G.alive)return;
 const h=G.st.health;let q=0.00002*Math.exp(0.09*G.age)*(h<15?5:h<30?2.5:h<50?1.4:h>75?0.7:1);
 if(G.age<5)q+=0.0008;
 if(h<=0||pr(q)){
  const cause=h<=0?pick(["complications from long-term illness","heart failure"]):G.age>=75?pick(["old age","heart disease","a stroke","cancer","pneumonia","old age"]):G.age>=45?pick(["a heart attack","cancer","a stroke"]):pick(["a car accident","a sudden illness","a heart condition"]);
  die(cause);
 }
}
function die(cause){
 G.alive=false;G.pending=null;G.queue=[];G.death={age:G.age,cause,year:G.year};
 say(`${G.name} ${G.last} died of ${cause} at age ${G.age}.`,"k-bad k-big");
 G.score=lifeScore();const best=lsGet(bestKey(),0);G.newBest=G.score>best;if(G.newBest)lsSet(bestKey(),G.score);

 const goals=G.goals.filter(id=>G.goalsDone.includes(id)||goalState(id)).length;

   Shared board: each signed-in player account writes scores/<their id> = {entries:[best life per student]}.
   Everyone reads the whole "scores" collection. Falls back to this device's own history. */
let LB={db:null,uid:null,rows:null,state:"local",canWrite:false,timer:null,last:null};
const LB_KEEP=30;

function lbLocal(){const a=lsGet("slugBoardLocal",[]);return Array.isArray(a)?a:[];}
function bestPer(list){const m={};for(const e of list){if(!e||typeof e.score!=="number")continue;const k=e.pid||e.name;if(!m[k]||e.score>m[k].score)m[k]=e;}return Object.values(m).sort((a,b)=>b.score-a.score||a.t-b.t);}
function lbEntry(){
 const best=G.jobHist.concat(G.job?[{t:jobTitle(),sal:G.job.salary}]:[]).sort((a,b)=>(b.sal||0)-(a.sal||0))[0];
 return{pid:PROF?PROF.id:"guest",name:shortName(PROF?PROF.name:`${G.name} ${G.last}`),college:PROF?PROF.college:"",emoji:PROF?PROF.emoji:"🐌",color:PROF?PROF.color:"",
  score:G.score,stars:stars(G.score),age:G.death.age,peak:Math.round(Math.max(0,G.peakNW)),career:best?best.t:"",ucsc:!!G.flags.ucscGrad,t:Date.now()};
}
let lbChain=Promise.resolve();
function lbRecord(){
 const e=lbEntry();LB.last=e;G.lbT=e.t;
 lsSet("slugBoardLocal",bestPer(lbLocal().concat([e])).slice(0,50));
 if(!LB.db||!LB.uid||!LB.canWrite)return;
 lbChain=lbChain.then(async()=>{
  const ref=LB.db.doc("scores/"+LB.uid);const snap=await ref.get();
  const old=snap.exists&&Array.isArray(snap.data().entries)?snap.data().entries:[];
  await ref.set({entries:bestPer(old.concat([e])).slice(0,LB_KEEP)});
 }).catch(err=>{if(err&&err.code==="invalid_argument"){LB.canWrite=false;}LB.err=true;lbPaint();});
}
function lbForget(ids){
 lsSet("slugBoardLocal",lbLocal().filter(e=>!ids.includes(e.pid)));
 if(!LB.db||!LB.uid||!LB.canWrite)return;
 lbChain=lbChain.then(async()=>{const ref=LB.db.doc("scores/"+LB.uid);const s=await ref.get();if(!s.exists)return;const old=Array.isArray(s.data().entries)?s.data().entries:[];const keep=old.filter(e=>!ids.includes(e.pid));if(keep.length!==old.length)await ref.set({entries:keep});}).catch(()=>{});
}
function lbRows(){return LB.rows||bestPer(lbLocal());}
function lbRank(sc,pid){const r=lbRows();return{rank:1+r.filter(x=>x.score>sc&&x.pid!==pid).length,of:Math.max(r.length,1)};}
function lbHtml(){
 const rows=lbRows().slice(0,10),me=PROF?PROF.id:"guest";
 const status=LB.state==="live"?(LB.canWrite?(LB.err?"Couldn't post your last score. It's saved on this device.":"Live board · everyone who plays this link"):"Live board · view-only for you, so your lives save on this device only")
  :LB.state==="loading"?"Loading the shared board…":LB.state==="slow"?"Can't reach the shared board yet. Showing this device.":"Showing lives played on this device";
 const body=rows.length?`<ol class="lb">${rows.map((r,i)=>`<li class="${r.pid===me?"me":""}"><span class="rk">${i<3?["🥇","🥈","🥉"][i]:i+1}</span><span class="av" style="${r.color?`--av:${esc(r.color)}`:""}">${esc(r.emoji||"🐌")}</span><span class="lbn"><b>${esc(r.name)}${r.pid===me?" <em>you</em>":""}</b><small>${esc(r.college?r.college+" College":"")}${r.career?` · ${esc(r.career)}`:""} · lived to ${r.age|0}</small></span><span class="pts"><b>${r.score|0}</b><small>${"★".repeat(r.stars|0)}${"☆".repeat(3-(r.stars|0))}</small></span></li>`).join("")}</ol>`
  :`<p class="hint">No lives finished yet. Be the first Slug on the board.</p>`;

function lbPaint(){document.querySelectorAll("[data-lb]").forEach(el=>{el.innerHTML=lbHtml();});const r=document.querySelector("[data-lbrank]");const m=document.querySelector("[data-myrank]");if(m){const b=lsGet(bestKey(),0);if(b){const k=lbRank(b,PROF?PROF.id:"guest");m.innerHTML=`#${k.rank}<span> of ${k.of}</span>`;}}
 if(r&&G&&G.score!=null){const k=lbRank(G.score,PROF?PROF.id:"guest");r.textContent=`#${k.rank} of ${k.of}`;}}
async function lbInit(){
 try{
  const use=window.claude&&window.claude.use;if(!use)return;
  const db=await window.claude.use("db");if(!db)return;
  const user=await window.claude.use("user");

  const cw=user&&user.can?await user.can("data.write"):null;
  LB.canWrite=!!LB.uid&&cw!==false;
  LB.state="loading";lbPaint();
  LB.timer=setTimeout(()=>{if(LB.state==="loading"){LB.state="slow";lbPaint();}},10000);
  db.collection("scores").onSnapshot(snap=>{
   const all=[];snap.docs.forEach(d=>{const x=d.data();if(x&&Array.isArray(x.entries))x.entries.forEach(e=>all.push(e));});
   LB.rows=bestPer(all);if(!snap.metadata.fromCache){LB.state="live";clearTimeout(LB.timer);}else if(LB.state!=="live")LB.state="live";
   lbPaint();
  },()=>{LB.state="local";LB.rows=null;clearTimeout(LB.timer);lbPaint();});
 }catch(e){LB.state="local";}
}

 {g:"in",k:"loans",l:"Student loans",per:"year",ph:"e.g. 5500",hint:"Money you'll repay with interest after school."},
 {g:"in",k:"family",l:"Help from family",per:"month",ph:"e.g. 200"},
 {g:"in",k:"wage",l:"Job pay per hour",per:"hour",ph:`e.g. ${MINWAGE.toFixed(2)}`},
 {g:"in",k:"hours",l:"Job hours per week",per:"week",ph:"e.g. 10"},
 {g:"out",k:"fees",l:"Tuition & fees",per:"year",ph:String(UCSC_FEES),def:UCSC_FEES,hint:`UCSC is about ${$(UCSC_FEES)} for CA residents in 2026–27.`},
 {g:"out",k:"rent",l:"Rent or housing",per:"month",ph:"e.g. 1350",hint:"Shared rooms in Santa Cruz run about $1,350 a month. For campus housing, divide the yearly cost by 9."},
 {g:"out",k:"utils",l:"Utilities, phone & internet",per:"month",ph:"e.g. 90"},
 {g:"out",k:"food",l:"Groceries",per:"month",ph:"e.g. 350"},
 {g:"out",k:"transit",l:"Transportation",per:"month",ph:"e.g. 40",hint:"Metro buses are included in student fees. Cars add gas, insurance and parking."},
 {g:"out",k:"fun",l:"Eating out & fun",per:"month",ph:"e.g. 150"},
 {g:"out",k:"books",l:"Books & supplies",per:"quarter",ph:"e.g. 250"},
 {g:"out",k:"other",l:"Everything else",per:"month",ph:"e.g. 60",hint:"Subscriptions, clothes, gifts, health costs."}
];
const rbKey=()=>"slugReal_"+(PROF?PROF.id:"guest");
function rbGet(){const v=lsGet(rbKey(),null);if(v&&typeof v==="object")return v;const d={};RB_FIELDS.forEach(f=>{if(f.def)d[f.k]=f.def;});return d;}
const rbNum=(v,k)=>{const x=parseFloat(v[k]);return isFinite(x)&&x>0?x:0;};
function rbCalc(v){
 const n=k=>rbNum(v,k);
 const job=n("wage")*n("hours")*RB_WEEKS;
 const inc={grants:n("grants")/3,loans:n("loans")/3,family:n("family")*3,job};
 const out={fees:n("fees")/3,rent:n("rent")*3,utils:n("utils")*3,food:n("food")*3,transit:n("transit")*3,fun:n("fun")*3,books:n("books"),other:n("other")*3};
 const I=Object.values(inc).reduce((a,b)=>a+b,0),O=Object.values(out).reduce((a,b)=>a+b,0);
 return{inc,out,I,O,left:I-O,job};
}
function rbOut(){
 const v=rbGet(),c=rbCalc(v);
 if(!c.I&&!c.O)return `<p class="hint">Fill in what you know. Results update as you type.</p>`;
 const left=c.left,bar=(lab,val,max,cls)=>`<div class="rbbar"><span>${lab}</span><div class="track"><i class="${cls}" style="width:${max?Math.min(100,Math.round(val/max*100)):0}%"></i></div><b class="mono">${$(val)}</b></div>`;
 const mx=Math.max(c.I,c.O,1);
 const nonLoan=c.I-c.inc.loans,rentShare=nonLoan>0?c.out.rent/nonLoan:0,loanShare=c.I?c.inc.loans/c.I:0;
 const tips=[];
 if(left<0){const gap=-left,w=rbNum(v,"wage")||MINWAGE;const hrs=Math.ceil(gap/(w*RB_WEEKS));
  tips.push(`You're short <b>${$(gap)}</b> a quarter. At ${$(w)} an hour that's about <b>${hrs} more hours a week</b> of work.`);
  if(c.out.fun>0)tips.push(`Halving eating out and fun would save ${$(c.out.fun/2)} a quarter.`);
  if(rbNum(v,"rent")>1400)tips.push("Sharing a room instead of renting solo is the biggest saving most students can make here.");
  tips.push(`Before reaching for a credit card, talk to <a href="${HELP.aid.u}" target="_blank" rel="noopener">UCSC Financial Aid</a> about emergency aid or an aid appeal, and check <a href="${HELP.basic.u}" target="_blank" rel="noopener">Basic Needs</a> for food and housing help.`);
 }else{
  const q=left>0?Math.ceil(3000/left):0;
  tips.push(`You have <b>${$(left)}</b> left each quarter.${q?` Saving it builds a $3,000 emergency fund in about ${q} quarter${q>1?"s":""}.`:""}`);
 }
 if(rentShare>0.3)tips.push(`Rent is <b>${Math.round(rentShare*100)}%</b> of your grants, family help and job pay. The 30% rule says housing should stay under about 30% of income, so roommates or campus housing may help.`);
 if(c.inc.loans>0){const total=rbNum(v,"loans")*4,pay=pmt(total,LOAN_RATE/12,120);
  tips.push(`<b>${Math.round(loanShare*100)}%</b> of your money is borrowed. Borrowing this for 4 years is ${$(total)}, about <b>${$(pay)} a month for 10 years</b> after you graduate at ${(LOAN_RATE*100).toFixed(2)}%.`);}
 if(c.job>0)tips.push(`Your job pay is before taxes. If you earn less than the standard deduction, filing a return usually gets back the taxes taken out. <a href="${HELP.tax.u}" target="_blank" rel="noopener">SlugCents</a> offers free tax help.`);
 return `<div class="rbtot"><div><small>Coming in</small><b class="mono">${$(c.I)}</b></div><div><small>Going out</small><b class="mono">${$(c.O)}</b></div><div><small>${left>=0?"Left over":"Short"}</small><b class="mono ${left>=0?"good":"bad"}">${left>=0?"":"−"}${$(Math.abs(left))}</b></div></div>
 <p class="muted small" style="margin:4px 0 10px">Per quarter. For the school year (3 quarters): ${$(c.I*3)} in, ${$(c.O*3)} out, ${left>=0?"":"−"}${$(Math.abs(left*3))} ${left>=0?"left":"short"}.</p>
 ${bar("In",c.I,mx,"in")}${bar("Out",c.O,mx,"out")}
 <h3>Where it goes</h3>${Object.entries(c.out).filter(([,x])=>x>0).sort((a,b)=>b[1]-a[1]).map(([k,x])=>bar(({fees:"Tuition",rent:"Housing",utils:"Utilities",food:"Groceries",transit:"Transport",fun:"Fun",books:"Books",other:"Other"})[k],x,c.O,"part")).join("")}
 <h3>What this means</h3><ul class="rbtips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul>`;
}
function realScreen(){
 const v=rbGet();
 const field=f=>`<label class="rbf"><span><b>${f.l}</b> <span class="muted small">per ${f.per}</span>${f.hint?`<small>${f.hint}</small>`:""}</span><span class="rbin"><span aria-hidden="true">${f.k==="hours"?"":"$"}</span><input inputmode="decimal" type="number" min="0" step="any" data-rb="${f.k}" value="${v[f.k]!=null&&v[f.k]!==""?esc(String(v[f.k])):""}" placeholder="${f.ph}"></span></label>`;
 return `<div class="thead"><button class="back" id="rb-back" aria-label="Back">←</button><div><h2>My Real Budget</h2><p>Your actual numbers for one UCSC quarter. Saved on this device only, never posted.</p></div></div>
 <section class="panel"><h3>💵 Money coming in</h3>${RB_FIELDS.filter(f=>f.g==="in").map(field).join("")}</section>
 <section class="panel"><h3>🧾 Money going out</h3>${RB_FIELDS.filter(f=>f.g==="out").map(field).join("")}</section>
 <section class="panel rbres" aria-live="polite"><h3>📊 Your quarter</h3><div id="rb-out">${rbOut()}</div></section>
 <div class="btns"><button class="btn ghost" id="rb-clear">Clear my numbers</button></div>`;
}
function bindReal(){
 const back=document.getElementById("rb-back");if(!back)return;
 back.onclick=()=>{UI.screen=UI.prevScreen||(G?"game":"create");render();window.scrollTo(0,0);};
 let t=null;
 document.querySelectorAll("[data-rb]").forEach(inp=>inp.oninput=()=>{const v=rbGet();v[inp.dataset.rb]=inp.value;lsSet(rbKey(),v);clearTimeout(t);t=setTimeout(()=>{const o=document.getElementById("rb-out");if(o)o.innerHTML=rbOut();},120);});
 const cl=document.getElementById("rb-clear");if(cl)cl.onclick=()=>{UI.sheet={kind:"confirm",text:"Clear all the numbers you entered in My Real Budget?",yes:()=>{try{localStorage.removeItem(rbKey());}catch(e){}}};render();};

 {ic:"🏦",t:"Money right now",f:[["savings","Savings in the bank",""],["card","Credit card balance","Leave blank if you don't have a card."],["stu","Student loans so far",""]]},
 {ic:"🎓",t:"Each school year",school:true,f:[["fees","Tuition & fees","per year"],["grants","Grants & scholarships","per year"],["loans","New student loans","per year"],["family","Help from family","per month"]]},

 {ic:"🛒",t:"Monthly spending",f:[["food","Groceries","per month"],["utils","Utilities, phone & internet","per month"],["transit","Transportation","per month"],["fun","Eating out & fun","per month"],["other","Everything else","per month"],["books","Books & supplies","per quarter"]]}

const RPH={savings:"e.g. 800",card:"e.g. 0",stu:"e.g. 0",fees:String(UCSC_FEES),grants:"e.g. 14000",loans:"e.g. 5500",family:"e.g. 200",wage:`e.g. ${MINWAGE.toFixed(2)}`,hours:"e.g. 10",food:"e.g. 350",utils:"e.g. 90",transit:"e.g. 40",fun:"e.g. 150",other:"e.g. 60",books:"e.g. 250"};
const rv=(v,k)=>{const x=parseFloat(v[k]);return isFinite(x)&&x>0?x:0;};
function realDefaults(v){
 if(!v.school)v.school="ucsc";if(!v.uyear)v.uyear=1;if(!v.home)v.home=v.school==="ucsc"?"campus":"family";
 if(!v.major&&PROF&&PROF.major&&MAJORS[PROF.major])v.major=PROF.major;if(!v.major)v.major="cs";
 if(v.fees==null||v.fees==="")v.fees=v.school==="ucsc"?UCSC_FEES:v.school==="cabrillo"?CABRILLO_FEES:0;
 return v;
}
function realYear(v){ // one game year (12 months, summer included)
 const st=v.school!=="none",n=k=>rv(v,k);
 const gross=n("wage")*n("hours")*50,job=gross*(1-taxRate(gross));
 const inc=(st?n("grants")+n("loans"):0)+n("family")*12+job;
 const spend=(n("food")+n("utils")+n("transit")+n("fun")+n("other"))*12+(st?n("books")*3:0);
 const out=(st?n("fees"):0)+n("rent")*12+spend;
 return{inc,out,job,gross,spend,left:inc-out,end:n("savings")+inc-out};
}
function realSummary(v){
 const y=realYear(v),m=x=>$(Math.round(x/12));
 if(!y.inc&&!y.out)return `<p class="hint">Fill in what you know. Blanks count as $0.</p>`;
 const short=y.end<0;
 return `<div class="rbtot"><div><small>In / month</small><b class="mono">${m(y.inc)}</b></div><div><small>Out / month</small><b class="mono">${m(y.out)}</b></div><div><small>${y.left>=0?"Left / month":"Short / month"}</small><b class="mono ${y.left>=0?"good":"bad"}">${y.left<0?"−":""}${m(Math.abs(y.left))}</b></div></div>
 ${shortText(y.left,rv(v,"savings"))}<p class="muted small" style="margin-top:6px">A full year, summer included. Job pay is after estimated taxes.</p>`;
}
function shortText(left,sav){
 if(left>=0)return `<p class="fc good">🙂 At this pace you'd have about <b>${$(left)}</b> left over this year${sav?`, on top of your ${$(sav)} savings`:""}.</p>`;
 const gap=-left,cover=Math.min(sav,gap),card=gap-cover;
 return `<p class="fc bad">😬 At this pace you'd come up <b>${$(gap)}</b> short this year.${cover?` Your savings cover ${$(cover)}.`:""}${card>0?` About <b>${$(card)}</b> would go on a credit card at 25% APR.`:""}</p>`;
}

function applyRealDefs(){
 delete HOUSING.real;delete LIFESTYLE.real;
 const i=JOBS.findIndex(j=>j.id==="realjob");if(i>=0)JOBS.splice(i,1);
 if(!G||!G.real)return;
 if(G.real.rentHome!=null)HOUSING.real={n:G.real.homeN,rent:G.real.rentHome,minAge:18};
 if(G.real.spend)LIFESTYLE.real={n:"Your real spending",c:G.real.spend,h:1};

function startReal(v){
 v=realDefaults({...v});const n=k=>rv(v,k),y=realYear(v);
 const st=v.school!=="none";
 G.real={school:v.school,fees:st?n("fees"):0,grants:st?n("grants"):0,loans:st?n("loans"):0,family:n("family"),spend:Math.round(y.spend),campus:v.home==="campus",homeN:"Your current place ("+REAL_HOMES[v.home].s+")",rentHome:null,job:null};
 G.cash=n("savings");G.debt.card=n("card");if(G.debt.card>0)G.card=true;G.debt.student=n("stu");
 // home
 if(v.home==="family"&&!n("rent"))G.housing="parents";
 else{G.real.rentHome=n("rent");G.housing="real";}
 // spending
 G.life=G.real.spend>0?"real":"moderate";
 // school
 G.edu.in=null;
 if(v.school==="ucsc"){G.edu.college=PROF&&PROF.college?PROF.college:pick(UCSC_COLLEGES);G.edu.major=MAJORS[v.major]?v.major:"cs";G.edu.in={type:"ucsc",yr:+v.uyear||1,len:4,gpas:[],fund:"real"};}
 else if(v.school==="cabrillo")G.edu.in={type:"cabrillo",yr:1,len:2,gpas:[],track:"Transfer prep",fund:"real"};
 // job
 if(y.gross>0){G.real.job={id:"realjob",n:"Your current job",co:"your real job",edu:0,pay:Math.round(y.gross),part:true,custom:true,minAge:16,steps:["Your current job"],stress:2};}
 applyRealDefs();
 if(G.real.job)G.job={id:"realjob",step:0,yrs:0,stepYrs:0,perf:55,salary:G.real.job.pay};
 // story
 const Hn=REAL_HOMES[v.home].s;
 say(`You're 18, and this life starts with your real numbers.`,"k-big");
 if(v.school==="ucsc")say(`You're a ${["first","second","third","fourth"][(+v.uyear||1)-1]}-year ${MAJORS[G.edu.major].n} student at UC Santa Cruz, in ${G.edu.college} College.`);
 else if(v.school==="cabrillo")say("You're a student at Cabrillo College on the transfer track.");
 else say("You're not in school right now.");
 say(`You live in ${Hn}${n("rent")?`, paying ${$(n("rent"))} a month`:""}.${G.job?` You work about ${n("hours")} hours a week at ${$(n("wage"))} an hour.`:""}`);
 const owe=[G.debt.card?`${$(G.debt.card)} on a credit card`:"",G.debt.student?`${$(G.debt.student)} in student loans`:""].filter(Boolean);
 say(`You have ${$(G.cash)} in savings${owe.length?` and owe ${owe.join(" and ")}`:""}.`);
 say(`Each year about ${$(y.inc)} comes in and ${$(y.out)} goes out.`,y.left<0?"k-bad":"k-good");
 if(!G.edu.in&&!G.job)G.queue=["afterHS"];
}

function costOf(a){return typeof a.cost==="function"?a.cost():(a.cost||0);}
function doAct(a){
 const cost=costOf(a);
 if(G.energy<1){toast("No actions left. Age up to get 3 more.");return;}
 if(a.ok&&!a.ok())return;
 if(cost&&G.age>=18&&G.cash<cost){toast(`You need ${$(cost)} in the bank.`);return;}
 const b=snap();if(G.age>=18)G.cash-=cost;G.energy--;
 const r=a.go();const t=r&&(r.t||r);if(t)say(t,r.k||"");
 UI.outcome={title:a.n(),text:t||"Done.",chips:deltaChips(b),why:a.why};UI.sheet={kind:"outcome"};save();render();
}
function spend(label,fn){ // generic action used by Career/People buttons
 if(G.energy<1){toast("No actions left. Age up to get 3 more.");return;}
 const b=snap(),n0=cur().lines.length;G.energy--;const r=fn();const t=r&&(r.t||r);if(t)say(t,r.k||"");
 if(G.pending){UI.sheet={kind:"event"};save();render();return;}
 const said=cur().lines.slice(n0).map(x=>x.t).join(" ");
 UI.outcome={title:label,text:t||said||"Done.",chips:deltaChips(b),why:r&&r.why};UI.sheet={kind:"outcome"};save();render();
}

function personActs(p){
 const A=[],t=(l,s,fn,ok=true)=>A.push({l,s,fn,ok}),rel=p.rel;
 t("Spend time together","Bond +6 to +12",()=>{p.bond=clamp(p.bond+ri(6,12));fx({happy:2});return{t:`You spent quality time with ${p.name}.`,why:"Relationships fade every year you ignore them. Close ones raise your happiness."};});
 if(["mother","father"].includes(rel)&&G.age>=14)t("Ask for money","Better odds when you're close",()=>{const W=WEALTH[G.wealth];if(pr(p.bond/140)&&W.gift>300){const a=Math.round(W.gift*(0.1+R()*0.4)/10)*10;G.cash+=a;p.bond=clamp(p.bond-4);return{t:`${p.name} gave you ${$(a)}.`,why:"Family help depends on what they can afford and how close you are."};}p.bond=clamp(p.bond-6);return{t:`${p.name} said no.`,k:"k-bad"};});
 if(rel==="partner"&&G.age>=18)t("Propose",p.bond>=60?"Beach wedding ~$12,000, or the courthouse":"Get closer first (bond 60+)",()=>{if(pr(p.bond/110)){p.rel="spouse";const w=G.cash>=12000?12000:300;G.cash-=w;fx({happy:14});G.flags.married=true;return{t:`${p.name} said yes! You got married${w>1000?" in a ceremony at the beach":" at the county courthouse"}.`,k:"k-good k-big",why:"Married couples split housing and living costs in this game, which is a big financial boost."};}p.bond=clamp(p.bond-15);fx({happy:-10});return{t:`${p.name} said no to your proposal.`,k:"k-bad"};},p.bond>=60);
 if((rel==="partner"||rel==="spouse")&&G.age>=18){
  t("Date night","About $100",()=>{if(G.cash<100)return"You can't afford a night out right now.";G.cash-=100;p.bond=clamp(p.bond+ri(6,10));fx({happy:4});return`You and ${p.name} had a date night ${pick(["on West Cliff","in Capitola Village","downtown","at the Wharf"])}.`;});
  t("Try for a baby","Kids cost about $15,000 a year",()=>{if(G.age>46||p.age>46)return"It isn't happening at this point in life.";teach("kids");if(pr(0.5)){const g=pick(["woman","man"]);const k=person("child",0,{gender:g,bond:85,last:G.last});G.people.push(k);fx({happy:10});return{t:`You had a baby ${g==="woman"?"girl":"boy"} named ${k.name}!`,k:"k-good k-big"};}return"No baby this year.";});
  t(rel==="spouse"?"Divorce":"Break up",rel==="spouse"?"Splits about 40% of what you own":"",()=>{endRelationship(p,false);return{t:"",why:rel==="spouse"?"Divorce usually splits shared assets, one of the biggest financial setbacks people face.":""};});
 }
 if(rel==="child"&&p.age<18)t("Help with homework","Bond up",()=>{p.bond=clamp(p.bond+8);return`You helped ${p.name} with homework.`;});
 if(["friend","sibling","ex"].includes(rel))t("Argue","Bond −15",()=>{p.bond=clamp(p.bond-15);fx({happy:-3});return`You got into an argument with ${p.name}.`;});
 if(rel==="friend")t("End the friendship","",()=>{p.alive=false;p.gone=true;return`You stopped being friends with ${p.name}.`;});
 return A;
}

function spark(arr){if(!arr||arr.length<2)return"";const W=120,H=30,mx=4,pts=arr.map((v,i)=>`${(i/(arr.length-1)*W).toFixed(1)},${(H-v/mx*H).toFixed(1)}`).join(" ");return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="GPA by year"><polyline points="${pts}" fill="none" stroke="var(--sea)" stroke-width="2.4" stroke-linejoin="round"/><circle cx="${W}" cy="${(H-arr[arr.length-1]/mx*H).toFixed(1)}" r="3.5" fill="var(--gold)"/></svg>`;}

/* ======================= PROJECTION =======================
   Mirrors the yearly money engine without side effects, for previews. */
function project(over={}){
 const life=over.life||G.life,housing=over.housing||G.housing;
 const sp=partner(),married=sp&&sp.rel==="spouse";
 const L=[],add=(l,v,k)=>{if(Math.abs(v)>0.5)L.push({l,v:Math.round(v),k});};
 let net=0;
 if(G.job){net=G.job.salary*(1-taxRate(G.job.salary));add("Take-home pay",net,"in");}
 if(G.retired){const ss=Math.max(16000,(G.flags.lastSalary||40000)*0.38);net+=ss;add("Social Security",ss,"in");}
 if(G.edu.in&&G.edu.in.type==="ucsc"&&G.edu.in.fund==="work"){net+=12000;add("Campus job",12000,"in");}
 const RS=G.real&&G.edu.in&&G.edu.in.fund==="real";
 if(RS){if(G.real.grants){net+=G.real.grants;add("Grants & scholarships",G.real.grants,"in");}if(G.real.loans)add("Student loans (borrowed)",G.real.loans,"in");add("Tuition & fees",-G.real.fees,"school");}
 if(G.real&&G.real.family&&(RS||G.age<22)){net+=G.real.family*12;add("Help from family",G.real.family*12,"in");}
 const H=HOUSING[housing];
 const rent=H.rent?H.rent*(housing===G.housing?(G.flags.rentMult||1):1)*12*(married?0.55:1):0;
 add("Rent",-rent,"house");
 if(G.house&&housing==="owned"){add("Mortgage",-(G.mortPay||0),"house");add("Property tax & insurance",-(G.house.value*0.011+2400)*(married?0.55:1),"house");}
 let lc=LIFESTYLE[life].c;if(life!=="real"){if(housing==="parents")lc*=0.55;if(isStudent())lc*=0.6;}if(married)lc*=0.6;add(`Living (${LIFESTYLE[life].n.toLowerCase()})`,-lc,"life");
 if(!RS&&G.edu.in&&G.edu.in.type==="ucsc"){const c=ucscYearCost();const gap=housing==="dorm"?c.gap:Math.max(0,c.gap-c.house);const loan=G.edu.in.fund==="work"?Math.max(0,gap-12000):gap;add("School costs not covered by loans",-(gap-loan),"school");}
 if(!RS&&G.edu.in&&G.edu.in.type==="cabrillo")add("Cabrillo fees & books",-(CABRILLO_FEES+900),"school");
 if(G.debt.student&&!isStudent())add("Student loan payment",-(G.stuPay||pmt(G.debt.student,LOAN_RATE/12,120)*12),"debt");
 if(G.debt.card)add("Card interest if unpaid",-(G.debt.card*CARD_APR),"debt");
 if(G.job&&jobDef(G.job.id).commute)add("Highway 17 commute",-3200,"life");
 const kids=people("child").filter(k=>k.age<18).length;if(kids)add(`Raising ${kids} kid${kids>1?"s":""}`,-kids*15000*(married?0.55:1),"life");
 const left=L.reduce((s,x)=>s+x.v,0);
 const houseCost=-L.filter(x=>x.k==="house").reduce((s,x)=>s+x.v,0);
 return{L,left,net,houseShare:net>0?houseCost/net:null};
}

function goalsStrip(){
 return `<section class="goals">${G.goals.map(id=>{const g=GOALS[id],ok=G.goalsDone.includes(id);return `<div class="goal ${ok?"ok":""}"><span aria-hidden="true">${ok?"✅":g.ic}</span><span>${g.t}</span></div>`;}).join("")}</section>`;
}
function diary(){
 const L=G.log,show=UI.showAll?L:L.slice(-8);
 return `<section class="diary" aria-label="Your life so far">${show.slice().reverse().map((y,i)=>`<article class="yr ${i===0&&G.alive?"now":""}"><div class="age">${y.age}<small>${y.year}</small></div><ul>${y.lines.length?y.lines.map(l=>`<li class="${l.k}">${esc(l.t)}</li>`).join(""):`<li class="muted">A quiet year.</li>`}</ul></article>`).join("")}
 ${!UI.showAll&&L.length>8?`<button class="more" id="showall">Show all ${L.length} years</button>`:""}</section>`;
}
function lifeTab(){
 const nw=G.delta&&G.age>=18?Math.round(G.delta.nw):0;
 return header()+`<div class="lifebar">${pips()}<button class="nb" data-open="notebook">📒 Lessons <b>${G.lessons.length}/${Object.keys(LESSONS).length}</b></button></div>`+
 (nw?`<p class="nwline">Net worth ${nw>0?"grew":"fell"} by <b class="${nw>0?"good":"bad"}">${$(Math.abs(nw))}</b> this year.</p>`:"")+goalsStrip()+diary();
}

  ${s.type==="ucsc"&&G.edu.major?`<p class="muted small">${esc(MAJORS[G.edu.major].n)} · year ${s.yr} of ${s.len}</p>`:""}

 else{
  h+=`<p class="big">${G.edu.degrees.length?G.edu.degrees.map(esc).join("<br>"):G.edu.lvl>=1?"High school diploma":G.age<5?"Too young for school":"No diploma yet"}</p>`;
  if(G.age>=18){h+=`<div class="opts">`;
   const o=(t,s2,fn)=>h+=`<button class="opt" data-h="${reg(fn)}"><span><span class="t">${t}</span><span class="s">${s2}</span></span><span class="tag">→</span></button>`;
   if(G.flags.noHS&&G.edu.lvl<1)o("Take the GED","About $150 · unlocks most jobs and college",()=>spend("GED exam",()=>{if(G.cash<150)return"You need $150 for the exam.";G.cash-=150;if(pr(0.4+G.st.smarts/150)){G.edu.lvl=1;G.flags.noHS=false;return{t:"You passed the GED.",k:"k-good"};}return{t:"You didn't pass the GED this time.",k:"k-bad"};}));
   if(G.edu.lvl>=1&&G.edu.lvl<3&&G.age<60)o("Apply to UC Santa Cruz","Bachelor's degrees open the highest-paying careers",()=>spend("UCSC application",()=>{if(pr(clamp(((G.edu.hsGpa||2.8)-2.6)*0.4+G.st.smarts/300,0.05,0.85))){if(G.job&&!jobDef(G.job.id).part)leaveJob("You left your job to go back to school.");enrollUCSC();nextPending();return{t:"You were admitted to UC Santa Cruz!",k:"k-good"};}return{t:"UC Santa Cruz didn't admit you this time.",k:"k-bad",why:"Admission odds depend on your high school GPA and smarts. Cabrillo's transfer path is the other way in."};}));
   if(G.edu.lvl>=1&&G.age<60)o("Enroll at Cabrillo College","Low cost: transfer prep, nursing or dental hygiene",()=>{if(G.job&&!jobDef(G.job.id).part)leaveJob("You left your job to go back to school.");G.queue.unshift("cabrillo");nextPending();save();render();});
   if(G.edu.lvl===3&&G.age<55)o("Apply to graduate school","Law, medicine, counseling or a Ph.D.",()=>{G.queue.unshift("afterCollege");nextPending();save();render();});
   h+=`</div>`;}
 }
 h+=`</section>`;
 // job
 if(G.retired)h+=`<section class="panel"><h3>🌅 Retired</h3><p class="hint">Social Security and your savings cover your costs now.</p></section>`;

  h+=`<section class="panel"><div class="ph"><h3>💼 ${esc(jobTitle())}</h3><span class="mono">${$(j.salary)}/yr</span></div><p class="muted small">${esc(J.co)}${J.part?" · part-time":""} · ${j.yrs} year${j.yrs===1?"":"s"} here</p>

   <div class="btns"><button class="btn sm" data-h="${reg(()=>spend("Work harder",()=>{G.flags.hard=1;G.job.perf=clamp(G.job.perf+6);fx({happy:-2});G.stress=clamp(G.stress+8);return{t:"You put in extra hours at work.",why:"Effort raises performance next year, at a cost to happiness and stress."};}))}">Work harder · 1 action</button>

  h+=B.length?`<div class="jobs">${B.map(J2=>{const p=oddsOf(J2);return `<div class="job"><div class="jt"><b>${esc(J2.n)}</b><span class="muted small">${esc(J2.co)}${J2.part?" · part-time":""}</span></div><div class="jm"><span class="mono">${$k(salaryOf(J2,0,0))}/yr</span>${oddsPill(p)}</div>
   <div class="req">${chip("✓ "+EDU_N[J2.edu],"","ok")}${J2.commute?chip("Hwy 17 commute","","warn"):""}${J2.stress>=7?chip("High stress","","warn"):""}</div>
   <button class="btn sm" data-h="${reg(()=>spend(`Apply: ${J2.n}`,()=>{const okk=applyJob(J2.id);return{t:"",why:okk?"":`Your odds were ${Math.round(p*100)}%. Smarts, social skills, education beyond the minimum and a strong GPA all raise them.`};}))}">Apply · ${Math.round(p*100)}% chance</button></div>`;}).join("")}</div>`:`<p class="hint">${isStudent()?"Only part-time jobs fit around college. Check back next year.":"Nothing matches you right now."}</p>`;
  const reach=JOBS.filter(J2=>!J2.part&&!eligible(J2)&&missing(J2).length&&(!J2.maxAge||G.age<=J2.maxAge)).sort((a,b)=>b.pay-a.pay).slice(0,4);
  if(reach.length)h+=`<h4 class="sub2">Out of reach for now</h4><div class="rows">${reach.map(J2=>`<div class="lock"><span><b>${esc(J2.n)}</b> · <span class="mono">${$k(J2.pay)}</span></span><span class="small muted">Needs: ${missing(J2).map(esc).join(" · ")}</span></div>`).join("")}</div>`;
  h+=`</section>`;}
 if(G.age<15)h+=`<p class="hint">You can get a part-time job at 15.</p>`;
 return h;

 HANDLERS={};

 if(dh)h+=`<section class="panel"><h3>🧾 Debts</h3><p class="hint">Pay the highest rate first. Every dollar of 25% card debt you clear is like earning 25% risk-free.</p>${dh}</section>`;

}

 const q=(s,f)=>document.querySelectorAll(s).forEach(f),on=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
 q("[data-real]",b=>b.onclick=openReal);
 q("[data-tab]",b=>b.onclick=()=>{const t=b.dataset.tab;UI.tab=UI.tab===t&&t!=="life"?"life":t;UI.sheet=null;render();window.scrollTo(0,0);});
 q("[data-h]",b=>b.onclick=()=>{if(b.getAttribute("aria-disabled")==="true"){if(G&&G.energy<1)toast("No actions left. Age up to get 3 more.");return;}const f=HANDLERS[b.dataset.h];if(f)f();});
 on("ageup",()=>{if(G.pending){UI.sheet={kind:"event"};render();return;}ageUp();UI.tab="life";if(!G.alive){render();return;}advance();window.scrollTo(0,0);});
 q("[data-ev]",b=>b.onclick=()=>{if(b.getAttribute("aria-disabled")==="true")return;resolveEvent(+b.dataset.ev);render();});
 on("cont",advance);
 q("[data-pa]",b=>b.onclick=()=>{if(b.getAttribute("aria-disabled")==="true")return;const p=G.people.find(x=>x.id===UI.sheet.id);const a=personActs(p)[+b.dataset.pa];spend(a.l,a.fn);});
 on("closesheet",()=>{UI.sheet=null;render();});
 on("realgo",()=>{UI.sheet=!lsGet("slugHowto",0)?{kind:"howto"}:null;render();window.scrollTo(0,0);});
 on("howok",()=>{const c=document.getElementById("how-show");if(c)lsSet("slugWelcomeOff",!c.checked);lsSet("slugHowto",1);UI.sheet=null;render();window.scrollTo(0,0);});
 on("bigtext",()=>{const r=document.documentElement;r.dataset.size=r.dataset.size==="lg"?"":"lg";lsSet("slugBig",r.dataset.size==="lg");render();});
 on("yes",()=>{const f=UI.sheet&&UI.sheet.yes;UI.sheet=null;if(f)f();save();render();});
 const ov=document.getElementById("ov");if(ov)ov.addEventListener("click",e=>{if(e.target===ov){UI.sheet=null;render();}});
 on("menu",()=>{UI.sheet={kind:"menu"};render();});
 q("[data-open]",b=>b.onclick=()=>{UI.sheet={kind:b.dataset.open};render();});
 q("[data-restart]",b=>b.onclick=()=>{UI.sheet={kind:"restart"};render();});
 on("r-cancel",()=>{UI.sheet=G.pending?{kind:"event"}:null;render();});
 on("r-go",blankStart);
 on("r-quick",()=>{const o={...UI.create,name:""};PENDEV=null;newLife(o);nextPending();UIQ.lessons=[];UIQ.goal=null;UI.outcome=null;UI.screen="game";UI.tab="life";UI.cat="all";render();window.scrollTo(0,0);toast(`New life: ${G.name} ${G.last}. Check your goals.`);});
 on("newlife",blankStart);
 on("showall",()=>{UI.showAll=true;render();});
 q("[data-cat]",b=>b.onclick=()=>{UI.cat=b.dataset.cat;render();});
 q("[data-life]",b=>b.onclick=()=>{const k=b.dataset.life;if(k!==G.life){if(LIFESTYLE[k].c>LIFESTYLE[G.life].c&&G.age>=22)teach("lifestyle");G.life=k;say(`You switched to a ${LIFESTYLE[k].n.toLowerCase()} lifestyle.`);}save();if(UIQ.lessons.length){UI.sheet={kind:"lesson",id:UIQ.lessons.shift()};}render();});
 q("[data-house]",b=>b.onclick=()=>{const k=b.dataset.house;if(k!==G.housing){G.housing=k;G.flags.rentMult=1;say(`You moved: ${HOUSING[k].n.toLowerCase()}.`);}save();render();});
 const inv=document.getElementById("inv");if(inv)inv.oninput=invPreview;
 on("invgo",()=>{const a=+document.getElementById("inv").value;if(!a||a>G.cash)return;G.cash-=a;G.invest+=a;say(`You invested ${$(a)} in an index fund.`);if(!G.flags.qInv){G.flags.qInv=1;G.queue.push("q_compound");}if(G.cash<3000&&!G.flags.qEm){G.flags.qEm=1;G.queue.push("q_emergency");}save();toast(`Invested ${$(a)}`);nextPending();if(G.pending)UI.sheet={kind:"event"};render();});
 on("wd",()=>{const a=Math.min(5000,G.invest);G.invest-=a;G.cash+=a;say(`You withdrew ${$(a)} from your investments.`);save();render();});
 q("input[data-debt]",r=>r.oninput=()=>{const k=r.dataset.debt,rate=+r.dataset.rate;document.getElementById("payv-"+k).textContent=$(+r.value);document.getElementById("pays-"+k).textContent=`Saves about ${$(+r.value*rate)} a year in interest.`;});
 q("[data-paydebt]",b=>b.onclick=()=>{const k=b.dataset.paydebt,r=document.getElementById("pay-"+k);const a=Math.min(+r.value,G.cash,G.debt[k]);if(a<=0)return;G.cash-=a;G.debt[k]-=a;if(G.debt[k]<1)G.debt[k]=0;
  if(k==="student"){if(!G.debt.student){G.stuPay=0;G.flags.loanFree=true;}else if(!isStudent())G.stuPay=Math.min(G.stuPay||Infinity,pmt(G.debt.student,LOAN_RATE/12,120)*12);}
  say(`You paid ${$(a)} toward your ${k==="card"?"high-interest debt":"student loans"}.`,"k-good");if(k==="card")teach("apr");save();toast(`Paid ${$(a)}`);if(UIQ.lessons.length)UI.sheet={kind:"lesson",id:UIQ.lessons.shift()};render();});
 // create
 const ni=document.getElementById("c-name");if(ni)ni.oninput=()=>{UI.create.name=ni.value;};
 on("c-rand",()=>{UI.create.name=pick(NAMES[UI.create.gender]);render();});
 q("[data-mode]",b=>b.onclick=()=>{UI.create.mode=b.dataset.mode;render();});
 bindRealForm();
 q("[data-cg]",b=>b.onclick=()=>{UI.create.gender=b.dataset.cg;render();});
 q("[data-cc]",b=>b.onclick=()=>{UI.create.city=b.dataset.cc;render();});
 q("[data-cw]",b=>b.onclick=()=>{UI.create.wealth=b.dataset.cw;render();});
 on("c-go",()=>{const real=(UI.create.mode||"real")==="real";const ni=document.getElementById("c-name");const nm=(ni?ni.value:UI.create.name).trim();newLife({...UI.create,name:nm||(PROF?firstName(PROF.name):""),real:real?rbGet():null});UI.create.name="";UI.screen="game";UI.tab="life";UIQ.lessons=[];PENDEV=null;nextPending();if(!G.pending&&real)UI.sheet={kind:"realsum"};else if(!G.pending&&!lsGet("slugHowto",0))UI.sheet={kind:"howto"};render();window.scrollTo(0,0);toast("Your goals for this life are on your diary page.");});
 on("resume",()=>{UI.screen="game";UI.tab="life";render();});
}

/* ======================= SCENERY ======================= */
function drawHero(cv){
 const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
 const c=cv.getContext&&cv.getContext("2d");if(!c)return;c.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height;let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
 const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,"#163B5A");g.addColorStop(.55,"#E9946A");g.addColorStop(.62,"#F2C230");c.fillStyle=g;c.fillRect(0,0,w,h);
 c.fillStyle="#1F5878";c.fillRect(0,h*.6,w,h*.4);
 c.fillStyle="rgba(255,255,255,.25)";for(let i=0;i<14;i++){c.fillRect(rnd()*w,h*.62+rnd()*h*.12,20+rnd()*40,1.5);}
 const tree=(x,base,ht,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(x,base-ht);c.lineTo(x+ht*.13,base);c.lineTo(x-ht*.13,base);c.closePath();c.fill();};
 for(let i=0;i<22;i++)tree(w*.55+rnd()*w*.5,h*.62,h*(.18+rnd()*.25),"#0E2B22");
 for(let i=0;i<10;i++)tree(rnd()*w*.35,h*.62,h*(.1+rnd()*.15),"#12352A");
 c.fillStyle="#0B241C";c.fillRect(0,h*.86,w,h*.14);
 c.save();c.translate(w*.2,h*.86);c.scale(1.3,1.3);c.fillStyle="#F2C230";c.beginPath();c.moveTo(-30,0);c.quadraticCurveTo(-28,-14,0,-14);c.quadraticCurveTo(16,-14,22,-22);c.lineTo(27,-20);c.quadraticCurveTo(24,-2,0,0);c.closePath();c.fill();
 c.strokeStyle="#F2C230";c.lineWidth=2.2;c.lineCap="round";c.beginPath();c.moveTo(22,-21);c.lineTo(24,-32);c.moveTo(25,-20);c.lineTo(31,-30);c.stroke();c.restore();
}

/* ======================= BOOT ======================= */
function boot(data){
 if(lsGet("slugBig",false))document.documentElement.dataset.size="lg";
 if(data&&data.UI)UI=data.UI;
 UI.pf=UI.pf||newPF();
 if(!PROF){G=null;UI.screen=PROFILES.length?"picker":"profile";}
 else{G=(data&&data.G)||lsGet(gameKey(),null);
  if(G&&!G.lessons){G.lessons=[];G.goals=pickGoals();G.goalsDone=[];G.happySum=0;}
  if(!["profile","picker"].includes(UI.screen))UI.screen=G?(UI.screen==="create"?"create":"game"):"create";}
 if(G&&G.pending)UI.sheet={kind:"event"};
 else if(!(data&&data.UI)&&!lsGet("slugWelcomeOff",false))UI.sheet={kind:"howto"};
 render();
 lbInit();stInit();
}
window.claude?.hot?.snapshot?.(()=>({G,UI}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
