    ["Grants & scholarships",`−${$(m.g*3)}`],...(C.famQ?[["Family payment to your account",`−${$(C.famQ*3)}`]]:[]),
    [`Direct Subsidized loan (6.52%)`,`up to ${$(m.lim[1])}`],[`Direct Unsubsidized loan (6.52%)`,`up to ${$(m.lim[0]-m.lim[1])}`],["Loan origination fee","1.057%"]])}
   <div class="panel">
    <div><div class="rangehead" data-sync="ah1"><span>Subsidized loan this year</span><b>${$(sub)}</b></div><input type="range" id="f-sub" min="0" max="${m.lim[1]}" step="50" value="${sub}" aria-label="Subsidized loan"><div class="hint">No interest while you're enrolled at least half-time.</div></div>
    <div><div class="rangehead" data-sync="ah2"><span>Unsubsidized loan this year</span><b>${$(uns)}</b></div><input type="range" id="f-uns" min="0" max="${m.lim[0]-m.lim[1]}" step="50" value="${uns}" aria-label="Unsubsidized loan"><div class="hint" data-sync="ah3">Interest starts now: about ${$(uns*LOAN_RATE)} a year.</div></div>

     <div class="kv sep"><span>Billed each quarter</span><span>${$(billQ)}</span></div>

    </div></div></div>

function monthlyPreview(){
 const T=turn(),P=F.policy,C=CH(),H=HOUSE[F.housing];const inn=[],outs=[];
 if(T.ac){if(P.hours>0){const c=P.job==="campus",g=P.hours*(c?18:20.5)*4.33;inn.push(["Job (take-home)",withhold(g,!c).net]);}}
 else{const S=SUMMER[F.summer.plan];if(S.hrs)inn.push([S.n,withhold(S.wage*S.hrs*4.33,true).net]);}
 if(F.gigOn)inn.push(["Delivery gig",F.gigOn.gross*0.75]);
 if(C.allowM)inn.push(["From family",C.allowM]);
 const rent=T.ac?(H.rent?H.rent+H.util:0):summerHousing();if(rent)outs.push(["Rent & utilities",rent]);
 outs.push(["Food",T.ac?FOOD[P.food].m:(SUMMER[F.summer.plan].home?120:400)]);outs.push(["Fun",FUN[P.fun].m*(T.ac?1:0.8)]);
 outs.push(["Phone, personal, subs",140+F.subs]);
 if(F.car)outs.push(["Car costs",160+(F.housing==="home"&&T.ac?220:110)+(F.carLoan?F.carLoan.pay:0)]);
 if(P.save)outs.push(["To savings",P.save]);if(F.roth&&P.invest)outs.push(["To investments",P.invest]);
 if(P.payInt&&F.loans.unsub)outs.push(["Loan interest",F.loans.unsub*LOAN_RATE/12]);
 return{inn,outs,i:sum(inn,x=>x[1]),o:sum(outs,x=>x[1])};

/* ---- tax ---- */
function taxData(){
 const ty=turn().cy-1,C=CH(),W=Object.values(F.wages[ty]||{});
 const wages=sum(W,e=>e.wages),fedW=sum(W,e=>e.fed),stW=sum(W,e=>e.st),gig=F.gig[ty]||0,intr=F.intInc[ty]||0;
 const se=gig>=400?gig*0.9235*0.153:0,agi=wages+gig+intr-se/2;
 const std=C.dependent?Math.min(FED_STD,Math.max(1350,wages+gig+450)):FED_STD;
 const ft=fedTaxOn(agi,std);
 let aotc=0;if(!C.dependent){const q=F.qual[ty]||0;aotc=Math.min(2000,q)+0.25*Math.max(0,Math.min(2000,q-2000));}
 const aR=aotc*0.4,aN=Math.min(ft,aotc*0.6);
 const fedOwed=ft-aN+se,fedRef=fedW+aR-fedOwed;
 const ct=caTaxOn(agi),caRef=stW-ct;
 return{ty,W,wages,fedW,stW,gig,intr,se,agi,std,ft,aotc,aR,aN,fedOwed,fedRef,ct,caRef,total:fedRef+caRef,parentsAotc:C.id==="jordan"?Math.min(2500,TUITION_Q*3>4000?2500:0):0};
}

 if(m.step===1){

   ${D.gig?`<div class="paper"><h4>Form 1099-NEC · ${D.ty}</h4><p>Delivery app (sample)</p><div class="boxes"><div class="box"><small>1 Nonemployee compensation</small><b>${$c(D.gig/0.75)}</b></div><div class="box"><small>4 Federal tax withheld</small><b>0.00</b></div></div><p class="hint" style="margin-top:6px">Your gas and wear (about 25%) are deductible business expenses, so your profit is ${$c(D.gig)}.</p></div>`:""}</div>

 if(m.step===2){

   ${D.aotc?`<div class="kv"><span>American Opportunity Tax Credit</span><span class="good">−${$c(D.aN+D.aR)}</span></div>`:""}
   <div class="kv"><span>Withheld from your pay</span><span>${$c(D.fedW)}</span></div>

   <button class="ch" data-ftx="paid"><span class="l"><span class="t">"QuickRefund Pro" app (fictional)</span><span class="s">$59 federal + $39 state${owe?"":" + $39 refund advance fee"}</span></span><span class="tags"><span class="tag cost">${owe?"$98":"$137"}</span></span></button>
   <button class="ch" data-ftx="skip"><span class="l"><span class="t">Don't file</span><span class="s">${owe?"Hope the IRS doesn't notice":"It's a small amount"}</span></span><span class="tags"><span class="tag">$0</span></span></button></div></div></section>`;}

function fTaxFile(how){
 const D=taxData(),T=turn();let res,tip;const owe=D.total<0,amt=Math.abs(D.total);
 if(how==="skip"){if(owe){F.irsOwe=Math.round(amt*1.3);F.flags.irsDue=F.t+4;res=`You don't file. You owed ${$(amt)}, and penalties will keep growing until the IRS catches up.`;tip="If you owe and don't file, the failure-to-file penalty is 5% a month, up to 25%. File on time even if you can't pay.";}
  else{F.tot.unclaimed+=amt;res=`You don't file, and ${$(amt)} of your own money stays with the government.`;tip="You generally have three years to claim a refund. Most people who put it off never do.";}
  F.flags.skippedTax=true;}
 else{const cost=how==="paid"?(owe?98:137):0;if(cost){F.tot.prepFees+=cost;F.tot.fees+=cost;F.tot.feeList["Paid tax prep fees"]=(F.tot.feeList["Paid tax prep fees"]||0)+cost;}
  if(owe){const pay=amt+cost;const r=F.taxReserve||0;const fromRes=Math.min(r,F.savings,pay);F.savings-=fromRes;F.taxReserve=Math.max(0,r-fromRes);payVia(pay-fromRes,"other");
   res=`Filed. You paid ${$(amt)}${fromRes?` (${$(fromRes)} from the money you set aside)`:""}${cost?` plus ${$(cost)} in app fees`:""}.`;tip="Gig workers should set aside about 25% of profit and pay quarterly estimates once they'll owe $1,000 or more.";}
  else{F.pendingRefund=Math.max(0,amt-(how==="paid"?cost:0));
   res=`Filed. Your ${$(F.pendingRefund)} refund will arrive by direct deposit before the quarter ends.${how==="paid"?` The app kept ${$(cost)}.`:""}`;tip=how==="paid"?"Simple returns qualify for free filing. App fees come out of money that was already yours.":"Most students qualify for free filing. Refunds usually arrive in about three weeks with direct deposit.";}
  F.flags.filedCount=(F.flags.filedCount||0)+1;if(how==="free")F.flags.freeCount=(F.flags.freeCount||0)+1;}

 learn(["W-2","1098-T","Standard deduction","Tax refund","Withholding"]);
 F.log.push({q:qLabel(T),t:`Taxes ${D.ty}: ${how==="free"?"filed free":how==="paid"?"paid app":"didn't file"}`});
 F.pending={result:res,tip};F.mg.step=3;render();
}

 L.lessons.push({id:"l4",t:"Deadlines that cost real money",body:`<p>Financial aid runs on deadlines. File the <b>FAFSA</b> (or CA Dream Act Application) every year. California's deadline for Cal Grant and the Middle Class Scholarship is <b>March 2</b>, and many campuses use it as a priority date too.</p><p>Keep your aid by meeting <b>Satisfactory Academic Progress</b>. Most schools require about a 2.0 GPA and completing roughly two-thirds of the units you attempt. Two bad quarters can suspend your aid.</p><p>Finally, finish on time. Cal Grant generally covers four years of full-time study, and every extra quarter costs tuition, rent and a quarter of lost salary.</p>`,
  viz:()=>stackViz([{l:"Grants if you file by March 2",v:29700,c:"#4E9A6C"},{l:"Lost by filing late",v:17800,c:"var(--bad)"}],0,"Example: a low-income student's yearly grants, on time vs. late."),
  key:["Put March 2 in your calendar every year","Under a 2.0 GPA? Talk to an advisor before it's two quarters","15 units a quarter = 4 years; 12 units = 5 years"],
  q:{q:"Which is most likely to cost a student thousands in free money?",o:["Filing the FAFSA in January","Missing the March 2 state grant deadline","Taking 15 units","Paying interest early"],a:1,ex:"State grants have strict deadlines. Late filers can lose them for the whole year."},lab:"grad",terms:[]});
 const Pm=MODULES.find(m=>m.id==="pay");
 Pm.lessons.push({id:"p4",t:"Gig work and 1099s",body:`<p>Delivery apps, rideshare and freelance work make you an <b>independent contractor</b>. No tax is withheld, and you get a <b>1099</b> instead of a W-2.</p><p>Your taxable profit is what you earned minus business costs, like mileage. On top of income tax, you owe <b>self-employment tax of 15.3%</b> on profit once you net $400 or more, because you pay both halves of Social Security and Medicare.</p><p>Set aside about 25% of every payout. Once you expect to owe $1,000 or more, the IRS expects quarterly estimated payments.</p>`,
  viz:()=>stackViz([{l:"Keep",v:2250,c:"#4E9A6C",f:"$2,250"},{l:"Gas & wear (deductible)",v:750,c:"#5B9BD5",f:"$750"},{l:"Set aside for taxes",v:560,c:"var(--bad)",f:"~$560"}],0,"$3,000 of delivery payouts over a quarter."),
  key:["Track mileage from day one","Set aside 25% of profit","No withholding ≠ no tax"],
  q:{q:"You earned $3,000 profit from gig work. No tax was withheld. You most likely owe…",o:["Nothing","Self-employment tax of about 15.3% on profit, plus any income tax","Only state tax","A flat $100"],a:1,ex:"Self-employment tax kicks in at $400 of net earnings."},terms:["Withholding"]});
 MODULES.push({id:"invest",n:"Investing",icon:"sprout",d:"Index funds, retirement accounts and avoiding hype.",lessons:[
  {id:"i1",t:"Stocks, funds and diversification",body:`<p>A <b>stock</b> is a small piece of one company. A <b>fund</b> holds many investments at once. An <b>index fund</b> simply buys every company in an index, like the S&P 500, for a very low fee.</p><p>Owning hundreds of companies is called <b>diversification</b>: one company failing barely matters. Over long periods, broad stock index funds have historically grown faster than savings accounts, but they drop sharply some years.</p><p>Fees matter. A 1% yearly fee can eat a quarter of your growth over 40 years.</p>`,
   viz:()=>donutViz([{l:"Technology",v:32,c:"var(--accent)"},{l:"Financials",v:13,c:"#5B9BD5"},{l:"Health care",v:10,c:"#4E9A6C"},{l:"Consumer",v:16,c:"var(--gold-line)"},{l:"Everything else",v:29,c:"var(--muted)"}],["500","companies"],"Roughly how a large-company index fund spreads your money (illustrative)."),
   key:["Index funds: broad, cheap, boring (good)","Check the expense ratio; under 0.2% is common","Money you need within 3 years doesn't belong in stocks"],
   q:{q:"What's the main benefit of an index fund?",o:["Guaranteed returns","Diversification at a low cost","No risk","Picking the best stocks"],a:1,ex:"You own the whole market, so no single company can sink you."},lab:"early",terms:[]},
  {id:"i2",t:"Roth IRA and the 401(k) match",body:`<p>A <b>Roth IRA</b> is a retirement account you open yourself. You contribute money you've already paid tax on, it grows tax-free, and withdrawals in retirement are tax-free. You need earned income to contribute, and you can take out your contributions (not the earnings) anytime.</p><p>A <b>401(k)</b> is offered through your employer. Many employers <b>match</b> part of what you put in, such as 50% of contributions up to 6% of pay. That match is part of your pay. Not taking it is like turning down a raise.</p>`,
   viz:()=>stackViz([{l:"You put in (6%)",v:3600,c:"var(--accent)"},{l:"Employer match",v:1800,c:"var(--gold-line)"}],0,"On a $60,000 salary with a 50% match up to 6%: $5,400 a year invested."),
   key:["Always contribute enough to get the full match","Students with job income can open a Roth IRA","Start small; raise it 1% each year"],
   q:{q:"Your employer matches 50% up to 6%. You earn $60,000 and contribute 3%. What do you miss?",o:["$0","$900 a year","$1,800 a year","$3,600 a year"],a:1,ex:"Full match is $1,800. At 3% you get $900, so you miss $900."},lab:"early",terms:[]},
  {id:"i3",t:"Risk, volatility and hype",body:`<p>Markets go down sometimes, occasionally by 20–30% in a year. That's normal. People who keep investing through drops usually come out ahead of those who sell in a panic.</p><p><b>Hype is different from risk.</b> New tokens or meme stocks pushed in group chats are often pump-and-dumps: early buyers sell to later ones. If someone promises guaranteed or fast returns, it's a red flag.</p><p>A simple rule: emergency fund first, then the 401(k) match, then a Roth IRA, and only then money you can afford to lose.</p>`,
   viz:()=>{const A=[];let v=1000;const rr=mulberry(7);for(let m=0;m<=60;m++){A.push([m/12,v]);v*=1+0.07/12+(rr()-0.5)*0.12;}return lineSVG([{n:"$1,000 in an index fund (illustrative)",c:"var(--accent)",pts:A,fill:1}],{xf:x=>"Yr "+Math.round(x),label:"Volatile but rising",h:200})},
   key:["Drops are normal; selling locks them in","Guaranteed high returns = scam","Order: emergency fund → match → Roth → extras"],
   q:{q:"A friend says a new coin will 10x by Friday. Best response?",o:["Put in your emergency fund","Treat it as a likely pump-and-dump","Borrow to buy more","Buy only on a credit card"],a:1,ex:"Hype-driven tokens often collapse after insiders sell."},terms:[]}]});
 MODULES.push({id:"after",n:"Life after graduation",icon:"receipt",d:"Job offers, benefits and repaying loans under the 2026 rules.",lessons:[
  {id:"g1",t:"Reading and negotiating an offer",body:`<p>An offer is more than a salary. Look at <b>base pay</b>, <b>bonus</b>, <b>401(k) match</b>, <b>health insurance</b> costs, <b>paid time off</b> and the start date.</p><p>It's normal to ask, politely, for more, especially if you have an internship, a competing offer or market data. Companies rarely withdraw an offer because you asked respectfully.</p><p>Raises are percentages, so a higher starting salary compounds for decades.</p>`,
   viz:()=>{const A=[],B=[];for(let y=0;y<=40;y+=1){A.push([y,65000*Math.pow(1.03,y)]);B.push([y,68900*Math.pow(1.03,y)]);}return lineSVG([{n:"Start at $65,000",c:"var(--muted)",pts:A},{n:"Negotiate to $68,900",c:"var(--accent)",pts:B,fill:1}],{xf:x=>"Yr "+x,label:"Salary over a career",h:200})},
   key:["Compare total compensation, not just salary","Ask once, politely, with a reason","Get the final offer in writing"],
   q:{q:"Why does negotiating your first salary matter so much?",o:["It doesn't","Future raises are percentages of it","It lowers your taxes","It sets your credit score"],a:1,ex:"A higher base lifts every future raise."},lab:"negotiate",terms:[]},
  {id:"g2",t:"Health plans and HSAs",body:`<p>A <b>PPO</b> usually has higher monthly premiums and lower deductibles. A <b>high-deductible health plan (HDHP)</b> has lower premiums and a higher deductible, and it can be paired with a <b>Health Savings Account (HSA)</b>.</p><p>HSA money goes in before tax, grows tax-free and comes out tax-free for medical costs. It stays yours if you change jobs. If you're healthy and keep the deductible in savings, an HDHP + HSA often costs less.</p><p>You can usually stay on a parent's health plan until 26.</p>`,
   viz:()=>stackViz([{l:"PPO premiums / yr",v:1680,c:"var(--bad)"},{l:"HDHP premiums / yr",v:540,c:"#4E9A6C"},{l:"Employer HSA deposit",v:500,c:"var(--gold-line)"}],0,"Same year, two plans (example numbers)."),
   key:["Compare premiums + likely costs","An HSA is a long-term savings tool","Keep your deductible in your emergency fund"],
   q:{q:"Who usually benefits most from an HDHP + HSA?",o:["Someone with frequent expensive care","A healthy person with savings for the deductible","Nobody","Only retirees"],a:1,ex:"Lower premiums plus tax-free HSA growth favor healthy savers."},terms:[]},
  {id:"g3",t:"Repaying loans under the 2026 rules",body:`<p>For federal loans first disbursed on or after July 1, 2026, you choose between two plans.</p><p><b>Tiered Standard:</b> fixed payments. The term depends on your balance: 10 years for $25,000 or less, 15 years up to $50,000, 20 years up to $100,000, and 25 years above that.</p><p><b>RAP:</b> payments of 1% to 10% of your adjusted gross income (minimum $10 a month), minus $50 per dependent. If your payment doesn't cover the interest, the rest is waived, and principal drops by at least $50 a month. Any balance is forgiven after 30 years.</p><p>Paying more on either plan saves interest. Check studentaid.gov for the official details.</p>`,
   viz:()=>stackViz([{l:"≤ $25k: 10 yrs",v:1,c:"#4E9A6C"},{l:"$25–50k: 15 yrs",v:1,c:"#5B9BD5"},{l:"$50–100k: 20 yrs",v:1,c:"var(--gold-line)"},{l:"> $100k: 25 yrs",v:1,c:"var(--bad)"}],0,"Tiered Standard plan terms by balance."),
   key:["Know your servicer before your first bill","RAP helps when income is low relative to debt","Extra payments cut total interest on either plan"],
   q:{q:"Under RAP, what happens if your payment doesn't cover the month's interest?",o:["The unpaid interest is added to your balance","The unpaid interest is waived","You're charged a penalty","Your loan defaults"],a:1,ex:"RAP waives unpaid interest, and principal still drops by at least $50 a month."},lab:"repay",terms:[]}]});

Object.assign(TOOLS,{
 grad:{n:"Graduate on time",icon:"cap",blurb:"Tuition is flat, so units per quarter decide how many quarters you pay for.",def:{u:15,su:0,have:0,live:1700,sal:60000},
  presets:[["12 units",{u:12}],["15 units",{u:15}],["18 units",{u:18}],["Transfer (90)",{have:90}],["+1 summer session",{su:10}]],
  ctrls:[["u","Units per quarter",8,20,1,v=>v],["su","Summer units per year",0,16,2,v=>v],["have","Units you have now",0,170,5,v=>v],["live","Rent, food & living per month",800,3000,50,v=>$(v)],["sal","Salary you'd start at",30000,120000,1000,v=>$(v)]],
  calc(p){const go=u=>{let q=0,un=p.have;const pts=[[0,un]];while(un<180&&q<40){q++;un+=u;if(q%3===0&&un<180)un+=p.su;pts.push([q,Math.min(180,un)]);}return{q,pts}};
   const a=go(p.u),b=go(15),extra=Math.max(0,a.q-b.q),per=TUITION_Q+p.live*3+p.sal/4,cost=extra*per;
   return{head:extra?`At ${p.u} units a quarter you graduate in <b>${a.q} quarters</b>, ${extra} more than at 15 units. That costs about <b>${$(cost)}</b> in tuition, living costs and a later first paycheck.`:`At ${p.u} units a quarter you finish in <b>${a.q} quarters</b>${a.q<b.q?`, <b>${b.q-a.q} fewer</b> than at 15 units, saving about <b>${$((b.q-a.q)*per)}</b>`:""}.`,
    tiles:[["Quarters to graduate",a.q],["At 15 units",b.q],["Cost per extra quarter",$(per)],[extra?"Extra cost":"Saved",$(extra?cost:Math.max(0,(b.q-a.q)*per)),"gold"]],
    chart:lineSVG([{n:`${p.u} units/quarter`,c:"var(--accent)",pts:a.pts,fill:1},{n:"15 units/quarter",c:"var(--gold-line)",pts:b.pts,dash:1}],{xf:x=>"Q"+x,label:"Units over time"}),
    note:"UC tuition is a flat rate for full-time students, so lighter quarters cost the same as heavy ones. Each extra quarter also delays your first full-time salary. Tuition here is an estimate of about $5,900 a quarter."}}},
 negotiate:{n:"Negotiate your first salary",icon:"receipt",blurb:"See what one polite email asking for more is worth over a career.",def:{sal:65000,ask:6,raise:3,yrs:40},
  presets:[["Ask 3%",{ask:3}],["Ask 6%",{ask:6}],["Ask 10%",{ask:10}],["Tech offer",{sal:98000}]],
  ctrls:[["sal","Offer",35000,150000,1000,v=>$(v)],["ask","Extra you ask for",0,15,1,v=>v+"%"],["raise","Average yearly raise",0,6,0.5,v=>v+"%"],["yrs","Career length",5,45,1,v=>v+" yrs"]],
  calc(p){const A=[],B=[];let ta=0,tb=0;for(let y=0;y<=p.yrs;y++){const s=p.sal*Math.pow(1+p.raise/100,y);ta+=s;tb+=s*(1+p.ask/100);A.push([y,ta]);B.push([y,tb]);}
   return{head:`Asking for <b>${p.ask}% more</b> (${$(p.sal*p.ask/100)} a year) adds up to about <b>${$(tb-ta)}</b> over ${p.yrs} years, before counting a bigger 401(k) match.`,
    tiles:[["First-year difference",$(p.sal*p.ask/100)],["Year 10 difference",$(p.sal*Math.pow(1+p.raise/100,10)*p.ask/100)],["Career earnings, offer",fmtK(ta)],["Career gain",fmtK(tb-ta),"gold"]],
    chart:lineSVG([{n:"Negotiated",c:"var(--accent)",pts:B,fill:1},{n:"As offered",c:"var(--muted)",pts:A,dash:1}],{xf:x=>"Yr "+x,label:"Cumulative earnings"}),
    note:"This assumes your future raises are percentages of your salary, which is how most companies work. Research typical pay, give a reason, and ask once, politely."}}},
 car:{n:"True cost of a car",icon:"home",blurb:"Price, loan interest, insurance, gas and upkeep, compared with going car-free.",def:{price:9000,down:0,apr:11.5,term:60,ins:150,gas:110,keep:5,alt:60},
  presets:[["Used sedan",{price:9000}],["Newer car",{price:22000,apr:8}],["Cash beater",{price:4000,down:4000}],["Low insurance",{ins:90}]],
  ctrls:[["price","Car price",2000,40000,500,v=>$(v)],["down","Down payment",0,20000,250,v=>$(v)],["apr","Loan APR",0,20,0.25,v=>v+"%"],["term","Loan term",24,84,12,v=>v+" mo"],["ins","Insurance per month",50,350,10,v=>$(v)],["gas","Gas per month",20,300,10,v=>$(v)],["keep","Years you keep it",1,10,1,v=>v+" yrs"],["alt","Car-free cost per month (rides, bus)",0,300,10,v=>$(v)]],
  calc(p){const L=Math.max(0,p.price-p.down),pm=pmt(L,p.apr/100,p.term)||0,A=[],B=[];let ca=p.down,cb=0;A.push([0,ca]);B.push([0,0]);
   for(let m=1;m<=p.keep*12;m++){ca+=(m<=p.term?pm:0)+p.ins+p.gas+50;cb+=p.alt;if(m%3===0){A.push([m/12,ca]);B.push([m/12,cb]);}}
   const int=pm*Math.min(p.term,p.term)-L;
   return{head:`Over ${p.keep} years this car costs about <b>${$(ca)}</b>, including <b>${$(Math.max(0,int))}</b> of loan interest. Going car-free would cost about <b>${$(cb)}</b>.`,
    tiles:[["Loan payment",$(pm)+"/mo"],["All-in per month",$(pm+p.ins+p.gas+50)],["Loan interest",$(Math.max(0,int))],["Car-free saves",$(ca-cb),"gold"]],
    chart:lineSVG([{n:"Owning the car",c:"var(--bad)",pts:A},{n:"Car-free",c:"var(--accent)",pts:B,fill:1}],{xf:x=>"Yr "+Math.round(x),label:"Cumulative cost"}),
    note:"Includes about $50 a month for maintenance and repairs. Insurance for drivers under 25 is usually much higher. Ignores the resale value you'd recover when you sell."}}},
 bnpl:{n:"Buy now, pay later",icon:"cart",blurb:"Each plan looks small. See what happens when they stack up.",def:{price:240,per:2,months:6,late:1},
  presets:[["Festival tickets",{price:480,per:1}],["Small buys",{price:80,per:5}],["Laptop",{price:900,per:1}]],
  ctrls:[["price","Average purchase",20,1200,10,v=>$(v)],["per","New BNPL purchases per month",1,8,1,v=>v],["months","Months of this habit",1,12,1,v=>v],["late","Missed payments per month",0,4,1,v=>v]],
  calc(p){const A=[];let owed=0,paid=0,fees=0;const plans=[];
   for(let w=0;w<=p.months*4+6;w++){if(w%4===0&&w<p.months*4)for(let i=0;i<p.per;i++)plans.push({left:4,amt:p.price/4});
    if(w%2===0){plans.forEach(x=>{if(x.left>0){x.left--;paid+=x.amt;}});}
    owed=sum(plans,x=>x.left*x.amt);if(w%4===3)fees+=p.late*10;A.push([w/4.33,owed]);}
   const peak=Math.max(...A.map(x=>x[1])),monthly=p.price*p.per;
   return{head:`${p.per} purchase${p.per>1?"s":""} a month at ${$(p.price)} means about <b>${$(monthly)}</b> a month in installments, with up to <b>${$(peak)}</b> owed at once.${p.late?` Missed payments add about <b>${$(fees)}</b> in fees.`:""}`,
    tiles:[["Owed at the peak",$(peak)],["Monthly payments",$(monthly)],["Late fees",$(fees)],["Total spent",$(p.price*p.per*p.months+fees),"gold"]],
    chart:lineSVG([{n:"Amount owed across all plans",c:"var(--bad)",pts:A,fill:1}],{xf:x=>"Mo "+Math.round(x),label:"BNPL balance"}),
    note:"BNPL is usually interest-free if you pay on time, but it's still debt. Several plans at once are easy to lose track of, and some lenders now report BNPL loans to credit bureaus."}}},
 repay:{n:"Repayment plans: Tiered vs. RAP",icon:"cap",blurb:"Compare the two plans for new federal loans, using your balance and salary.",def:{bal:27000,rate:6.52,sal:60000,raise:3.5,extra:0},
  presets:[["$15k, $50k salary",{bal:15000,sal:50000}],["$27k, $60k salary",{bal:27000,sal:60000}],["$45k, $45k salary",{bal:45000,sal:45000}],["+$200/mo extra",{extra:200}]],
  ctrls:[["bal","Balance when repayment starts",3000,120000,500,v=>$(v)],["rate","Interest rate",3,10,0.05,v=>v.toFixed(2)+"%"],["sal","Starting salary",20000,150000,1000,v=>$(v)],["raise","Yearly raise",0,8,0.5,v=>v+"%"],["extra","Extra each month (Tiered)",0,800,25,v=>$(v)]],
  calc(p){const r=p.rate/100,yrs=tieredYears(p.bal),tp=pmt(p.bal,r,yrs*12);const A=[[0,p.bal]],B=[[0,p.bal]];let a=p.bal,b=p.bal,pa=0,pb=0,ma=null,mb=null,forg=0;
   for(let m=1;m<=360;m++){const sal=p.sal*Math.pow(1+p.raise/100,Math.floor((m-1)/12));
    if(a>0.5){const i=a*r/12,pay=Math.min(tp+p.extra,a+i);a+=i-pay;pa+=pay;if(a<=0.5){a=0;ma=m;}}
    if(b>0.5){const pay=rapPay(sal),i=b*r/12,prin=Math.max(0,pay-i),match=prin<50?50-prin:0;const pr=Math.min(b,prin+match);b-=pr;pb+=Math.min(pay,pr+i);if(b<=0.5){b=0;mb=m;}}
    if(m===360&&b>0){forg=b;}
    if(m%12===0){A.push([m/12,a]);B.push([m/12,b]);}}
   const yrsTxt=m=>m?ym(m):"30 yrs (forgiven)";
   return{head:`Tiered Standard: <b>${$(tp+p.extra)}/month</b>, paid off in <b>${yrsTxt(ma)}</b>, about <b>${$(pa)}</b> total. RAP starts at <b>${$(rapPay(p.sal))}/month</b>, paid off in <b>${yrsTxt(mb)}</b>, about <b>${$(pb)}</b> total${forg?`, with ${$(forg)} forgiven`:""}.`,
    tiles:[["Tiered payment",$(tp+p.extra)+"/mo"],["RAP first payment",$(rapPay(p.sal))+"/mo"],["Tiered total paid",$(pa)],["RAP total paid",$(pb),"gold"]],
    chart:lineSVG([{n:`Tiered Standard (${yrs} yrs)${p.extra?" + extra":""}`,c:"var(--accent)",pts:A,fill:1},{n:"RAP",c:"var(--gold-line)",pts:B}],{xf:x=>"Yr "+x,label:"Loan balance by plan"}),
    note:"RAP payment: 1% of AGI for $10,001–$20,000, rising one point per $10,000 to 10% above $100,000, minimum $10, minus $50 per dependent (none here). Unpaid interest is waived and principal drops at least $50 a month. Simplified: uses salary as AGI and ignores taxes on forgiveness. Applies to loans first disbursed on or after July 1, 2026."}}}

function budCalc(B){
 const loanGross=B.sub+B.unsub,loanNet=loanGross*(1-LOAN_FEE),charges=B.tuition+B.campusHousing,credits=B.grants+loanNet+B.famAcct,acct=credits-charges;
 const gM=B.wage*B.hours*52/12,wh=gM>0?withhold(gM,B.jobType==="off"):{net:0},netWk=wh.net*12/52,check=netWk*2,netRate=gM>0?wh.net/gM:1;
 const W=Array.from({length:BWEEKS+1},()=>[]);const add=(w,l,a)=>{if(Math.abs(a)>0.004)W[w].push([l,a])};
 if(acct>=0)add(1,"Aid refund",acct);
 else if(B.payplan)MONTH_WKS.forEach(w=>add(w,"Payment plan installment",acct/3));
 else add(1,"Balance due on student account",acct);
 PAY_WKS.forEach(w=>add(w,"Paycheck (take-home)",check));
 MONTH_WKS.forEach(w=>{add(w,"From family",B.allowance);add(w,"Other income",B.otherIn);add(w,"Rent & utilities",-(B.rent+B.util));add(w,"To savings",-B.save);});
 BILL_WKS.forEach(w=>add(w,"Phone, subscriptions & bills",-(B.phone+B.subs+B.carIns+B.otherM)));
 for(let w=1;w<=BWEEKS;w++)add(w,"Groceries, food, transport & fun",-(B.groceries+B.eatOut+B.transport+B.fun));
 add(1,"Textbooks & supplies",-B.books);add(2,"One-time costs",-B.oneTime);
 let bal=B.start,low=B.start,lowW=0,firstNeg=0;const pts=[[0,bal]],rows=[];
 for(let w=1;w<=BWEEKS;w++){const inW=sum(W[w].filter(x=>x[1]>0),x=>x[1]),outW=-sum(W[w].filter(x=>x[1]<0),x=>x[1]);bal+=inW-outW;pts.push([w,bal]);rows.push({w,ev:W[w],inW,outW,bal});
  if(bal<low){low=bal;lowW=w}if(bal<0&&!firstNeg)firstNeg=w;}
 const m3=x=>x*3,w11=x=>x*BWEEKS;
 const inn=[["Aid refund",Math.max(0,acct)],["Paychecks",check*PAY_WKS.length],["From family",m3(B.allowance)],["Other income",m3(B.otherIn)]].filter(x=>x[1]>0.5);
 const outs=[["Rent & utilities",m3(B.rent+B.util)],["Groceries",w11(B.groceries)],["Eating out",w11(B.eatOut)],["Transport",w11(B.transport)],["Fun",w11(B.fun)],
  ["Bills & subscriptions",m3(B.phone+B.subs+B.carIns+B.otherM)],["Books & one-time",B.books+B.oneTime],["Due on account",Math.max(0,-acct)],["To savings",m3(B.save)]].filter(x=>x[1]>0.5);
 const needs=m3(B.rent+B.util+B.phone+B.carIns+B.otherM)+w11(B.groceries+B.transport)+B.books+B.oneTime,wants=w11(B.eatOut+B.fun)+m3(B.subs),saved=m3(B.save);
 return{loanGross,loanNet,charges,credits,acct,check,netWk,netRate,gM,pts,rows,low,lowW,firstNeg,end:bal,inn,outs,i:sum(inn,x=>x[1]),o:sum(outs,x=>x[1]),
  needs,wants,saved,spend:needs+wants};
}

function budTips(B,R){
 const T=[];const gap=-R.low;
 if(R.firstNeg){
  const eat=B.eatOut*BWEEKS/2,hrs=B.wage?B.wage*4*10*R.netRate:0;
  T.push({k:"bad",h:`Close a ${$(gap)} gap before week ${R.firstNeg}`,b:`Options, and how much each one covers this quarter:<ul class="fixes">
   ${B.eatOut?`<li><span>Cut eating out in half</span><b class="${eat>=gap?"good":""}">+${$(eat)}</b></li>`:""}
   ${B.wage?`<li><span>Work 4 more hours a week</span><b class="${hrs>=gap?"good":""}">+${$(hrs)}</b></li>`:""}
   ${B.save?`<li><span>Pause your savings transfer this quarter</span><b class="${R.saved>=gap?"good":""}">+${$(R.saved)}</b></li>`:""}
   ${B.fun?`<li><span>Set fun to ${$(Math.round(B.fun/2))} a week</span><b class="${B.fun/2*BWEEKS>=gap?"good":""}">+${$(B.fun/2*BWEEKS)}</b></li>`:""}
   </ul>If none of these is enough, ask the Financial Aid office about your options. A loan amount you turned down can often be accepted later in the year. Campus food pantries and CalFresh can take groceries off your list.`});
 }
 if(R.acct<0&&!B.payplan)T.push({k:"warn",h:`${$(-R.acct)} is due on your student account`,b:"Your aid doesn't cover your charges, so the difference comes out of checking before classes start. Turn on <b>Split into 3 payments</b> above to see how a monthly payment plan changes your quarter, then check the payment plan options in your student account portal."});
 if(!R.firstNeg&&B.unsub>0){const r=Math.min(B.unsub,Math.max(0,R.end-300));if(r>=100)T.push({k:"good",h:`You may not need ${$(r)} of your unsubsidized loan`,
  b:`You end the quarter with ${$(R.end)}. Keeping a ${$(300)} cushion, you could reduce your unsubsidized loan by about ${$(r)}. Unsubsidized interest starts right away: at 6.52%, that amount builds about ${$(r*LOAN_RATE)} of interest every year you're in school.`,lab:"unsub",labp:{yearly:Math.min(7500,Math.max(500,Math.round(r*3/100)*100))}});}
 if(R.loanGross>0){const tot=R.loanGross*12;T.push({k:"",h:"What this quarter's loans add up to",
  b:`If you borrow ${$(R.loanGross)} every quarter for four years (12 quarters), you'd graduate owing about <b>${$(tot)}</b> plus any unpaid interest. On a 10-year plan at 6.52%, that's roughly <b>${$(pmt(tot))}/month</b>.`,lab:"loan",labp:{bal:Math.min(80000,Math.round(tot/500)*500),extra:0,lump:0}});}
 if(B.eatOut>=15)T.push({k:"",h:`Eating out costs ${$(B.eatOut*52)} a year at this pace`,b:`That's ${$(B.eatOut*BWEEKS)} this quarter. Cooking a few more dinners a week is usually the fastest way to free up cash.`,lab:"habit",labp:{price:Math.min(40,Math.round(B.eatOut/3*4)/4)||5,per:3,years:10}});
 if(R.spend>0){const np=R.needs/(R.spend+R.saved)*100;if(np>65)T.push({k:"",h:`Needs take ${Math.round(np)}% of your spending`,b:"Above the 50% starting point in the 50/30/20 rule, which is common with Santa Cruz rent. Keep wants modest and hold on to a small savings habit so one surprise doesn't land on a credit card."});}
 if(!B.save)T.push({k:"",h:"Start a small emergency fund",b:`Even ${$(25)} a month adds up to ${$(75)} this quarter, a first step toward ${$(500)}, which covers most surprises.`,lab:"save",labp:{dep:25,start:0}});
 else{const m=Math.ceil(500/B.save);T.push({k:"good",h:`${$(R.saved)} saved by the end of the quarter`,b:`At ${$(B.save)} a month you'll reach a ${$(500)} emergency fund in about ${m} month${m>1?"s":""}. Keep it in a separate, insured high-yield account.`,lab:"save",labp:{dep:Math.min(1000,Math.max(10,B.save))}});}
 if(B.hours>=20)T.push({k:"warn",h:`${B.hours} work hours a week is a heavy load`,b:"Many students find more than about 20 hours a week hard to balance with a full course load. Students who work 20+ hours a week may also qualify for CalFresh, so check before you add more shifts."});
 return T;
}

function budField([k,l,h]){
 const unit=k==="wage"?"$":k==="hours"?"":"$",suf=k==="hours"?"hrs":k==="wage"?"/hr":"";
 return `<label class="bf" for="bud-${k}"><span>${l}${h&&!["$","$/hr","hrs"].includes(h)?`<small>${h}</small>`:""}</span><span class="bfin">${unit?`<i>${unit}</i>`:""}<input id="bud-${k}" type="number" inputmode="decimal" min="0" step="any" data-bud="${k}" value="${BUD[k]||""}" placeholder="0">${suf?`<i>${suf}</i>`:""}</span></label>`;
}

function budgetView(){
 const B=BUD,R=budCalc(B),tips=budTips(B,R);
 const pv=BUD.preset&&BPRESET[BUD.preset]?BPRESET[BUD.preset].n.toLowerCase():"example student";
 const bseg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-bseg="${k}" data-v="${v}" class="${String(B[k])===String(v)?"on":""}" aria-pressed="${String(B[k])===String(v)}">${l}</button>`).join("")}</div>`;
 const acctBox=`<div class="acct ${R.acct>=0?"ok":"due"}"><div><span class="kicker">Student account this quarter</span>
   <div class="acctrow"><span>Tuition & fees${B.campusHousing?" + campus housing":""}</span><span>−${$(R.charges)}</span></div>
   <div class="acctrow"><span>Grants${B.famAcct?" + family":""}${R.loanGross?` + loans (${$(R.loanGross)} borrowed, ${$(R.loanGross-R.loanNet)} fee)`:""}</span><span>+${$(R.credits)}</span></div></div>
   <div class="acctnet"><small>${R.acct>=0?"Refund to checking, week 1":B.payplan?"You owe · 3 payments":"You owe before week 1"}</small><b>${$(Math.abs(R.acct))}</b></div></div>`;
 const pct=x=>R.spend+R.saved>0?Math.round(x/(R.spend+R.saved)*100):0;
 return `<section class="sechead"><span class="kicker">${ic("wallet",16)} My Real Budget</span><h1>Map your actual quarter</h1>
  <p class="lead">Enter your real aid, rent and paycheck. You'll see your quarter week by week: when your refund lands, when rent hits, and whether you make it to finals with money left.</p>
  <p class="privacy">${ic("shield",15)} Your numbers stay in this browser on this device. Nothing is sent or shared.</p></section>
 <section class="rail brail" aria-label="Your quarter at a glance" data-sync="brail">
  <div class="st"><div class="k">Checking today</div><div class="v">${$(B.start)}</div></div>
  <div class="st"><div class="k">${R.acct>=0?"Aid refund":"Due on account"}</div><div class="v ${R.acct<0?"neg":""}">${$(Math.abs(R.acct))}</div></div>
  <div class="st"><div class="k">Lowest${R.lowW?" · wk "+R.lowW:""}</div><div class="v ${R.low<0?"neg":""}">${sgn(R.low)}</div></div>
  <div class="st"><div class="k">End of quarter</div><div class="v ${R.end<0?"neg":""}">${sgn(R.end)}</div></div></section>
 <div data-sync="bnote">${B.example?`<div class="tip bnote">${SLUG(30)}<div><b>Example numbers</b>These are sample figures for a ${pv}. Replace them with yours; every change saves automatically on this device.</div></div>`:""}</div>
 <section class="budin" aria-labelledby="bstep1">
  <div class="bhead"><h2 id="bstep1"><span class="stepn">1</span>Your numbers</h2>
   <div class="bacts"><span class="hint">Start from:</span>${Object.entries(BPRESET).map(([k,p])=>`<button class="btn ghost sm" data-bpreset="${k}">${p.n}</button>`).join("")}<button class="btn ghost sm" id="bclear">Clear all</button></div></div>
  <div class="bgroups">${BGROUPS.map(g=>`<div class="bg"><div class="bgh"><h3>${g.t}</h3>${g.per?`<span class="per">${g.per}</span>`:""}</div>${g.hint?`<p class="hint">${g.hint}</p>`:""}
   ${g.f.map(budField).join("")}
   ${g.job?`<div class="bf"><span>Job type<small>Campus jobs usually skip Social Security and Medicare tax while you're enrolled.</small></span></div>${bseg("jobType",[["campus","On campus"],["off","Off campus"]])}`:""}
   ${g.t.startsWith("Aid")?`<div class="bf"><span>Balance due<small>If you owe, pay it all at once or split it.</small></span></div>${bseg("payplan",[[0,"Pay in full"],[1,"Split into 3 payments"]])}`:""}
  </div>`).join("")}</div>
  <div class="bjumprow"><button class="btn" id="bjump">See my quarter</button></div>
 </section>
 <section class="budout" id="bresults" aria-labelledby="bstep2" data-sync="budout">
  <h2 id="bstep2"><span class="stepn">2</span>Your quarter, week by week</h2>
  <p class="verdict">${R.i+R.o+B.start<1?`Enter your numbers above and your quarter will appear here, week by week.`:R.firstNeg?`You run out of money in <b>week ${R.firstNeg}</b>. At the lowest point, in week ${R.lowW}, you're <b>${$(-R.low)} short</b>.`
   :`You make it through all ${BWEEKS} weeks and finish with <b>${$(R.end)}</b> in checking${R.saved?` plus <b>${$(R.saved)}</b> saved`:""}. ${R.lowW?`Your tightest week is <b>week ${R.lowW}</b>, at ${$(R.low)}.`:`Your balance never drops below today's ${$(B.start)}.`}`}</p>
  <div class="chart">${lineSVG([{n:"Checking balance",c:R.firstNeg?C3:C1,pts:R.pts,fill:1}],{xf:x=>x?"Wk "+x:"Now",tf:x=>x?"End of week "+x:"Today",xn:11,label:"Checking balance by week"})}</div>
  <p class="hint">Refunds and rent land in weeks 1, 5 and 9; bills in weeks 2, 6 and 10. Paychecks arrive every two weeks starting week 3, since a first paycheck usually comes about two weeks after you start.</p>
  <div class="kpis">
   <div class="kpi"><small>${R.acct>=0?"Aid refund":"Due on account"}</small><b class="${R.acct<0?"bad":""}">${$(Math.abs(R.acct))}</b></div>
   <div class="kpi"><small>Each paycheck</small><b>${$(R.check)}</b><span>${B.hours?`${B.hours} hrs × ${$c(B.wage)}, after tax`:"no job entered"}</span></div>
   <div class="kpi"><small>Spending this quarter</small><b>${$(R.spend)}</b><span>${$(R.spend/BWEEKS)} a week</span></div>
   <div class="kpi hi"><small>End of quarter</small><b class="${R.end<0?"bad":""}">${sgn(R.end)}</b></div></div>
  ${acctBox}
  <div class="viz"><h4>Where the quarter's money comes from and goes</h4>${flowBars(R)}</div>
  ${R.spend+R.saved>0?donutViz([{l:"Needs",v:R.needs,c:NAVY,f:`${pct(R.needs)}% · ${$(R.needs)}`},{l:"Wants",v:R.wants,c:GOLDC,f:`${pct(R.wants)}% · ${$(R.wants)}`},{l:"Savings",v:R.saved||0.0001,c:SAGE,f:`${pct(R.saved)}% · ${$(R.saved)}`}],[`${pct(R.needs)}%`,"needs"],"Your spending against the 50/30/20 starting point. Tuition and campus housing paid by aid aren't included."):""}
  ${R.firstNeg?helpBlock("money"):""}
  <div class="btips"><h3>Smart moves for your quarter</h3>${tips.map(t=>`<div class="bt ${t.k}"><div><b>${t.h}</b><div>${t.b}</div></div>${t.lab?`<button class="btn ghost sm" data-golab="${t.lab}" data-labp="${esc(JSON.stringify(t.labp||{}))}">${ic("flask",16)} Try it in the Lab</button>`:""}</div>`).join("")}</div>
  <details class="wdet"><summary>Week-by-week detail</summary><div class="wtwrap"><table class="wt"><thead><tr><th>Week</th><th>What happens</th><th class="n">In</th><th class="n">Out</th><th class="n">Balance</th></tr></thead><tbody>
   <tr><td>Now</td><td>Starting balance</td><td></td><td></td><td class="n">${$(B.start)}</td></tr>
   ${R.rows.map(r=>`<tr class="${r.bal<0?"neg":""}"><td>${r.w}</td><td>${r.ev.map(e=>`<span class="${e[1]>0?"good":""}">${e[0]} ${e[1]>0?"+":"−"}${$(e[1])}</span>`).join("<br>")}</td><td class="n">${r.inW?"+"+$(r.inW):""}</td><td class="n">${r.outW?"−"+$(r.outW):""}</td><td class="n">${sgn(r.bal)}</td></tr>`).join("")}
  </tbody></table></div></details>
  <p class="hint">Estimates only. Withholding uses 2026 federal and California rates for a single filer; your actual paycheck and aid timing can differ. Loan figures use the 6.52% undergraduate rate and the current ~1.06% loan fee.</p>
 </section>`;
}
function bindBudget(){
 document.querySelectorAll("[data-bud]").forEach(i=>i.oninput=()=>{BUD[i.dataset.bud]=Math.max(0,parseFloat(i.value)||0);BUD.example=false;saveBud();syncRender();});
 document.querySelectorAll("[data-bseg]").forEach(b=>b.onclick=()=>{const k=b.dataset.bseg;BUD[k]=k==="payplan"?+b.dataset.v:b.dataset.v;BUD.example=false;saveBud();softRender();});
 document.querySelectorAll("[data-bpreset]").forEach(b=>b.onclick=()=>{BUD=mkBud(b.dataset.bpreset);saveBud();softRender();toast("Loaded "+BPRESET[b.dataset.bpreset].n.toLowerCase()+" example");});
 on("bclear","click",()=>{BUD={...BZERO,example:false};saveBud();softRender();const f=document.getElementById("bud-tuition");if(f)f.focus();});
 on("bjump","click",()=>{const r=document.getElementById("bresults");if(r)r.scrollIntoView({behavior:"smooth",block:"start"});});
}
