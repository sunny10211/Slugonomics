<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A Day in the Life of a Banana Slug</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a game console. Sticky status rail, week ribbon, an illustrated scene banner (canvas: redwoods, fog, Monterey Bay), then the decision or document below. UCSC blue + gold. */
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --surface-2:#E2EAF2; --ink:#0B1F33; --muted:#4F6377; --line:#C9D6E3;
  --navy:#003C6C; --gold:#FDC700; --gold-ink:#2B2200; --accent:#003C6C; --accent-ink:#FFFFFF;
  --good:#1E7A4C; --bad:#B4362A; --warn:#A86A00; --gold-line:#B88A00; --paper:#FFFDF6; --paper-ink:#1D2633;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --head:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06182A; --surface:#0C2338; --surface-2:#133050; --ink:#E6EEF7; --muted:#9DB2C7; --line:#21405F;
  --accent:#FDC700; --accent-ink:#1A1400; --gold-line:#7FB8F0; --good:#5FD39A; --bad:#FF8A78; --warn:#F2B84B;
  --paper:#F4EFE2; --paper-ink:#1D2633; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06182A; --surface:#0C2338; --surface-2:#133050; --ink:#E6EEF7; --muted:#9DB2C7; --line:#21405F;
  --accent:#FDC700; --accent-ink:#1A1400; --gold-line:#7FB8F0; --good:#5FD39A; --bad:#FF8A78; --warn:#F2B84B;
  --paper:#F4EFE2; --paper-ink:#1D2633; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,h4{text-wrap:balance;margin:0;font-family:var(--head)}
p{margin:0}
button{font:inherit}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:12px 22px;border-radius:999px;font-family:var(--head);letter-spacing:.01em;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:focus-visible,.opt:focus-visible,.ch:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex-shrink:0}
.logo b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.05;color:var(--accent)}
.logo small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top .acts{display:flex;gap:8px}

/* status rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 1.6fr;gap:10px;align-items:center;box-shadow:0 6px 18px -14px rgba(0,30,60,.5)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.st{min-width:0}
.st .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st .v{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.st .v.neg{color:var(--bad)} .st .v.flash{animation:flash .6s}
@keyframes flash{0%{color:var(--gold)}100%{}}
.mtrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}
.mt{font-size:11px;color:var(--muted);display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px}
.mt .bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mt .bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
.mt .bar i.hot{background:var(--bad)} .mt .bar i.mid{background:var(--warn)}
@media (max-width:640px){.rail{grid-template-columns:repeat(4,minmax(0,1fr))}.mtrs{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr))}.mt{grid-template-columns:1fr}.st .v{font-size:15px}}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dy{text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.dy em{display:block;font-style:normal;font-size:10px}
.dy .dots{display:flex;justify-content:center;gap:3px;margin-top:4px}
.dy .dots i{width:9px;height:9px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dy .dots i.done{background:var(--accent);border-color:var(--accent)}
.dy .dots i.now{background:var(--gold);border-color:var(--gold)}
.dy.today{color:var(--ink);font-weight:700}

/* stage */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.banner{position:relative;height:150px;background:#0b2a45}
.banner canvas{width:100%;height:100%;display:block}
.banner .loc{position:absolute;left:14px;bottom:10px;font-family:var(--mono);font-size:12px;color:#fff;background:rgba(0,30,55,.62);padding:3px 9px;border-radius:6px;letter-spacing:.03em}
.banner .day{position:absolute;right:14px;top:10px;font-family:var(--head);font-weight:800;font-size:13px;color:#002642;background:var(--gold);padding:3px 10px;border-radius:999px}
.body{padding:20px clamp(16px,4vw,30px) 24px;display:flex;flex-direction:column;gap:14px}
.body h2{font-size:clamp(22px,4vw,30px);line-height:1.1;font-weight:800;letter-spacing:-.01em}
.lead{max-width:64ch}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.pill{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--gold);color:var(--gold-ink);padding:2px 9px;border-radius:999px;align-self:flex-start}
.pill.navy{background:var(--navy);color:#fff}

.choices{display:flex;flex-direction:column;gap:10px}
.ch{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);transition:border-color .15s,transform .15s}
.ch:hover:not([aria-disabled="true"]){border-color:var(--accent);transform:translateY(-1px)}
.ch[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.ch .l{min-width:0}.ch .t{font-weight:700;display:block}.ch .s{font-size:14px;color:var(--muted);display:block}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;flex-shrink:0;max-width:46%}
.tag{font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.tag.cost{background:var(--gold);color:var(--gold-ink)} .tag.gain{color:var(--good)} .tag.debt{color:var(--bad)}
@media (max-width:540px){.ch{flex-direction:column}.tags{justify-content:flex-start;max-width:none}}

.result{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.fxrow{display:flex;flex-wrap:wrap;gap:6px}
.fx{font-family:var(--mono);font-size:13px;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.fx.up{color:var(--good)}.fx.down{color:var(--bad)}
.tip{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:15px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.tip b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.newterm{font-size:13px;color:var(--muted)} .newterm span{font-weight:700;color:var(--ink)}

/* paper document */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 20px;font-family:var(--mono);font-size:13px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 10px 24px -16px rgba(0,0,0,.6);position:relative;overflow:hidden}
.paper::after{content:"SAMPLE";position:absolute;right:-18px;top:18px;transform:rotate(18deg);font-family:var(--head);font-weight:800;font-size:22px;letter-spacing:.2em;color:rgba(180,54,42,.18)}
.paper h4{font-family:var(--head);font-size:15px;margin-bottom:8px}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper td,.paper th{padding:4px 6px;border-bottom:1px solid rgba(0,0,0,.1);text-align:left;vertical-align:top}
.paper th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5b6573}
.paper td.n,.paper th.n{text-align:right}
.paper .hl{background:rgba(253,199,0,.45);outline:2px solid #c99a00;border-radius:3px}
.paper .tot td{font-weight:700;border-top:2px solid #1d2633}
.paperwrap{overflow-x:auto}
.boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.box{border:1px solid rgba(0,0,0,.25);padding:6px 8px;border-radius:3px;min-width:0}
.box small{display:block;font-size:10px;color:#5b6573}
.box b{font-size:15px}

.q{display:flex;flex-direction:column;gap:8px}
.q .qq{font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:540px){.opts{grid-template-columns:1fr}}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.opt[disabled]{cursor:default}
.explain{font-size:14px;color:var(--muted)}
.qprog{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* minigame panels */
.panel{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.kv span:last-child{font-family:var(--mono);font-weight:600}
.kv.big span:last-child{font-size:20px}
.kv.sep{border-top:1px solid var(--line);padding-top:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangehead{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.rangehead b{font-family:var(--mono)}
.hint{font-size:13px;color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}

.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.items{grid-template-columns:1fr}}
.it{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.it .nm{font-weight:700;font-size:14px}.it .meta{font-size:12px;color:var(--muted);font-family:var(--mono)}
.step{display:flex;align-items:center;gap:6px}
.step button{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);text-align:center;line-height:28px;font-weight:700;background:var(--bg)}
.step button:focus-visible{outline:2px solid var(--gold)}
.step b{font-family:var(--mono);min-width:16px;text-align:center}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.meter{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);transition:width .3s}
.cat{display:flex;flex-direction:column;gap:6px}
.cat h4{font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{all:unset;cursor:pointer;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;background:var(--surface)}
.seg button.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--gold)}
.billrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.billrow:last-child{border-bottom:0}
.field{display:flex;flex-direction:column;gap:4px}
.field input[type=number]{font:inherit;font-family:var(--mono);padding:9px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}

/* title */
.hero{position:relative;border-radius:22px;overflow:hidden;background:#04243f;color:#fff;min-height:420px;display:flex;align-items:flex-end}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:28px clamp(18px,4vw,36px);display:flex;flex-direction:column;gap:14px;max-width:640px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,58px);line-height:.98;color:#fff}
.hero h1 span{color:var(--gold)}
.hero p{font-size:17px;color:#d9e6f2;max-width:52ch}
.hook{font-family:var(--mono);font-size:13px;color:var(--gold);display:flex;flex-direction:column;gap:2px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.facts div{background:var(--surface);padding:12px 14px}
.facts b{display:block;font-family:var(--head);font-weight:800;font-size:22px;color:var(--accent)}
.facts span{font-size:13px;color:var(--muted)}
@media (max-width:600px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.modules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.modules{grid-template-columns:1fr 1fr}}
.mod{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mod b{font-family:var(--head);display:block}.mod span{font-size:13px;color:var(--muted)}

.arch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.arch{grid-template-columns:1fr}}
.ac{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.ac.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 55%,transparent)}
.ac:focus-visible{outline:3px solid var(--gold)}
.ac b{font-family:var(--head);font-size:17px}
.ac .meta{font-size:13px;color:var(--muted)}
.ac ul{margin:0;padding-left:18px;font-size:13px}
.namefield input{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:320px}

/* report */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:72px;line-height:1;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);min-width:0}
.kpi small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--mono);font-size:20px;display:block}
.kpi span{font-size:12px;color:var(--muted)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;min-width:320px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:700}
.badge.got{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.badge.no{opacity:.45;font-weight:400}
.future{background:var(--navy);color:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.future h3{color:var(--gold)}
.future .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.future .row{grid-template-columns:1fr}}
.future .row div{background:rgba(255,255,255,.08);border-radius:10px;padding:10px 12px}
.future small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#bcd0e3}
.future b{font-family:var(--mono);font-size:20px}
.future p{color:#d9e6f2;font-size:14px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline div{padding:4px 0 8px 14px;position:relative;font-size:14px}
.timeline div::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:12px;margin-right:6px}
.terms{display:flex;flex-wrap:wrap;gap:6px}
.terms span{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface-2)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(2,16,30,.55);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--surface);width:min(520px,100%);height:100%;overflow-y:auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:14px}
.drawer dl{margin:0;display:flex;flex-direction:column;gap:10px}
.drawer dt{font-weight:700}.drawer dd{margin:0;color:var(--muted);font-size:15px}
.drawer dt.locked{color:var(--muted);font-weight:400}
.drawer h3{font-size:20px}
.drawer .sec{display:flex;flex-direction:column;gap:8px}
.drawer ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
footer{font-size:12px;color:var(--muted);text-align:center;max-width:70ch;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;box-shadow:0 8px 24px -10px rgba(0,0,0,.6)}

/* nav */
.top{gap:12px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;order:3;width:100%;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-family:var(--head);font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;flex:1;justify-content:center}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible{outline:3px solid var(--gold)}
@media (min-width:860px){.tabs{order:0;width:auto}.tabs button{flex:none}}
.onhero{color:#fff!important;border-color:rgba(255,255,255,.45)!important}
.sechead{display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.sechead h1{font-family:var(--head);font-weight:800;font-size:clamp(26px,4.6vw,40px);line-height:1.05;letter-spacing:-.02em}
.sechead .kicker{display:flex;align-items:center;gap:6px;color:var(--accent)}
.ico{flex-shrink:0}
/* home entry */

 "Subsidized loan":"A federal student loan where the government pays the interest while you're in school at least half-time.",
 "Unsubsidized loan":"A federal student loan that starts charging interest the day it's paid out, even while you're in school.",
 "Origination fee":"A fee taken out of a federal loan before you receive it. You still repay the full amount borrowed.",

 "YTD":"Year to date: the running total since January 1.",

 "Promotional rate":"A temporary discount that expires. Bills often jump when it does.",

/* ======================= ENGINE ======================= */
function netPos(){return S.money+S.savings-(S.card||0)}
function apply(fx,cat){
 for(const [k,v] of Object.entries(fx||{})){
  if(!v)continue;
  if(["stress","health","grades","social"].includes(k))S[k]=clamp(S[k]+v);
  else if(k==="card"){S.card=(S.card||0)+v;if(cat&&v>0)S.spend[cat]=(S.spend[cat]||0)+v;}
  else S[k]=(S[k]||0)+v;
  if(k==="money"&&v<0&&cat)S.spend[cat]=(S.spend[cat]||0)-v;
 }
}
function learn(list){(list||[]).forEach(t=>{if(TERMS[t]&&!S.terms.includes(t))S.terms.push(t);if(TERMS[t]&&!(PROG.terms||[]).includes(t)){PROG.terms=(PROG.terms||[]).concat(t);lsSet("slugLearn",PROG);}})}
function knownTerms(){return [...new Set([...(PROG.terms||[]),...S.terms])]}
function slotDef(){
 let d=PLAN[S.day][S.slot];
 if(Array.isArray(d))d=d.find(v=>!v.for||v.for.includes(S.arch));
 return d;
}
function pickSurprise(){
 const pool=SURPRISES.filter(x=>!S.used.includes(x.id)&&(!x.forArch||x.forArch.includes(S.arch)));
 const p=pool[Math.floor(Math.random()*pool.length)];S.used.push(p.id);return {...p,type:"choice",isSurprise:true};
}
function available(c){
 const fx=val(c.fx,S)||{};
 if(c.needCard&&S.card===null)return{ok:false,why:"You don't have a credit card"};
 if(fx.card>0&&!c.noLimit&&S.card!==null&&S.card+fx.card>S.limit)return{ok:false,why:"Over your credit limit"};
 if(fx.money<0&&S.money+fx.money<0)return{ok:false,why:"Not enough in checking"};
 return{ok:true};
}
function finish(o){
 // o: {result, fx(display), tip, terms, logLabel, extra}
 learn(o.terms);
 S.pending={result:o.result,fx:o.fx||{},tip:o.tip,terms:(o.terms||[]).filter(Boolean),extra:o.extra||"",lab:o.lab||null};
 S.log.push({d:S.day,s:S.slot,t:o.logLabel||val(S.cur&&S.cur.title,S)});
 S.hist.push({d:S.day,s:S.slot,v:netPos()});
 render();
 const st=document.getElementById("stage");if(st)st.scrollIntoView({behavior:"smooth",block:"start"});
}
function endOfDay(){
 const notes=[];
 if(S.mealsShort>0&&S.day<6){const m=Math.min(S.mealsShort,2),c=m*11;S.mealsShort-=m;apply({money:-Math.min(c,S.money)},"dining");notes.push(`Not enough food at home: ${m} meal${m>1?"s":""} bought out (${$(c)}).`);}
 if(S.arch==="commuter"&&S.day<5&&!S.flags.bus){apply({money:-Math.min(9,S.money)},"transport");notes.push("Gas for the round trip: $9.");if(S.flags.daily&&S.day>0){apply({money:-Math.min(12,S.money)},"transport");notes.push("Daily parking permit: $12.");}}
 if(S.stress>=75){apply({health:-4,grades:-3});notes.push("High stress cost you sleep, health and focus.");}
 if(S.health<=35){apply({stress:5});notes.push("Feeling run-down pushed your stress higher.");}
 return notes;
}
function advance(){
 if(S.cur&&S.cur.recap){S.cur=null;S.pending=null;render();return;}
 S.pending=null;S.cur=null;S.mg=null;S.slot++;
 if(S.slot>2){
  const notes=endOfDay();S.slot=0;S.day++;
  if(S.day>6){S.screen="post";S.qi=0;render();return;}
  if(notes.length){S.cur={recap:true,loc:"home",where:"Overnight",title:`${DAYS[S.day-1][0]} wrap-up`};
   S.pending={result:notes.join(" "),fx:{},tip:"Money, stress and health are connected. Trouble in one spills into the others."};render();return;}
 }
 render();
}

function doAid(){
 const A=ARCH[S.arch],m=S.mg,borrowed=m.sub+m.unsub,net=borrowed*(1-ORIG_FEE),after=net-A.gap;
 const due=Math.max(0,-after),nowDue=m.plan?Math.round(due/3)+25:due;
 if(S.money<nowDue)return;
 S.loanSub=m.sub;S.loanUnsub=m.unsub;
 const fx={};
 if(after>=0){fx.money=Math.round(after);}else{fx.money=-nowDue;S.flags.planOwed=m.plan?due-Math.round(due/3):0;}
 apply(fx,after<0?"school":null);
 if(borrowed)fx.loan=borrowed;
 const subFirst=m.unsub===0||m.sub===SUB_MAX;
 S.flags.subFirst=borrowed>0&&subFirst;
 let tip;
 if(!borrowed)tip="No new debt is a strong choice when you can cover your costs. Just make sure rent and food are still covered.";
 else if(!subFirst)tip="You took unsubsidized money before using all of the subsidized loan. Subsidized loans don't charge interest while you're in school, so use them first.";
 else if(after>600)tip="Borrowing for living costs is normal, but every dollar of refund is borrowed. Borrow what you need, not the maximum by default.";
 else tip="You borrowed close to what you need and used the subsidized loan first. That's how to keep future payments low.";
 finish({result:after>=0?`Accepted. ${after>0?`A ${$(Math.round(after))} refund will hit your checking account today.`:"Your bill is covered."}`:`Accepted. You paid ${$(nowDue)} today${m.plan?" and the rest is on the installment plan":""}.`,
  fx,tip,terms:["Subsidized loan","Unsubsidized loan","Origination fee","Refund (aid)"],lab:{tool:m.unsub?"unsub":"loan",p:m.unsub?{yearly:m.unsub*3,yrs:S.arch==="dorm"?3:2}:{bal:Math.round(S.prior+borrowed*(S.arch==="dorm"?9:6))}},logLabel:`Aid: borrowed ${$(borrowed)}`});
}

function doTax(how){

 else if(how==="paid"){r=refund-108;S.flags.filed=true;S.flags.paidPrep=true;tip="You paid $108 to file a return that qualifies for free filing. Refund advances and 'fast refund' fees eat into money that's already yours.";res=`Filed. Your refund shrinks to ${$(r)} after fees.`;}
 else{S.flags.noFile=true;tip="If you don't file, the IRS keeps your withholding. You generally have three years to claim a refund, but most people who wait never do.";res=`You skip filing. ${$(refund)} of your own money stays with the government.`;}

function creditProj(){
 if(S.card===null)return{v:null,label:"No score yet",note:"No credit accounts means no score. That's normal; a starter card paid in full is the usual first step."};
 let sc=700;if(S.flags.paidFull)sc+=25;if(S.flags.autopay)sc+=10;if(S.flags.minOnly)sc-=15;if(S.flags.missed)sc-=90;
 const util=S.limit?S.card/S.limit:0;if(util>0.3)sc-=25;
 return{v:sc,label:`≈ ${sc-15}–${sc+15}`,note:S.flags.missed?"A missed payment would weigh on your first score for years.":S.flags.minOnly?"Carrying a balance costs interest and keeps utilization high.":"On-time, paid-in-full payments are building a strong first score."};
}
function scores(){
 const net=netPos()+S.refundDue,borrowed=S.loanSub+S.loanUnsub;
 const owed=S.late.reduce((a,b)=>a+b.a,0)+(S.flags.planOwed||0);
 const realDelta=net-borrowed-owed-S.startNet;
 const wants=S.spend.dining+S.spend.fun;
 let fin=66+(S.savings>=50?10:S.savings>0?5:0)+(S.flags.filed&&!S.flags.paidPrep?8:S.flags.filed?3:-6)+(borrowed===0||S.flags.subFirst?5:-5)
  -(S.flags.lateCount||0)*10-(S.flags.scamHit?14:0)-(S.flags.missed?15:0)-(S.flags.minOnly?7:0)-(S.flags.impulse?4:0)
  -Math.max(0,S.spend.fees-20)/8-Math.max(0,wants-90)/8-(owed>0?6:0)+(S.money>=150?5:-5)+(S.subsSaved>=10?3:0);
 fin=clamp(Math.round(fin));
 const well=Math.round(((100-S.stress)+S.health+S.grades+S.social)/4);
 const postRight=S.post.filter((a,i)=>a===QUIZ[i].a).length,preRight=S.pre.filter((a,i)=>a===QUIZ[i].a).length;
 const lit=Math.round(postRight/5*60+(S.xpMax?S.xp/S.xpMax:0)*40);
 return{fin,well,lit,total:Math.round(fin*.4+well*.3+lit*.3),preRight,postRight,net,borrowed,realDelta,owed};
}
function lineChart(){
 const pts=[{v:S.startNet,lab:"Start"}].concat(S.hist.map(h=>({v:h.v,lab:DAYS[h.d][0]})));
 const W=640,H=210,pl=56,pr=14,pt=14,pb=28;
 const vs=pts.map(p=>p.v),mn=Math.min(0,...vs),mx=Math.max(...vs,100);
 const sx=i=>pl+i*(W-pl-pr)/Math.max(1,pts.length-1),sy=v=>pt+(mx-v)*(H-pt-pb)/(mx-mn||1);
 const ticks=4,tv=[...Array(ticks+1)].map((_,i)=>mn+(mx-mn)*i/ticks);
 const path=pts.map((p,i)=>`${i?"L":"M"}${sx(i).toFixed(1)},${sy(p.v).toFixed(1)}`).join("");
 const area=path+`L${sx(pts.length-1)},${sy(mn)}L${sx(0)},${sy(mn)}Z`;
 const dayIdx=[];pts.forEach((p,i)=>{if(i&&(!pts[i-1]||pts[i-1].lab!==p.lab))dayIdx.push(i)});
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Your cash position across the week">
  ${tv.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${$s(Math.round(v))}</text>`).join("")}
  ${mn<0?`<line x1="${pl}" x2="${W-pr}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--bad)" stroke-dasharray="4 4"/>`:""}
  <path d="${area}" fill="var(--accent)" opacity=".1"/>
  <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
  ${dayIdx.map(i=>`<text x="${sx(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${pts[i].lab}</text>`).join("")}
  <circle cx="${sx(pts.length-1)}" cy="${sy(pts[pts.length-1].v)}" r="5" fill="var(--gold)" stroke="var(--accent)" stroke-width="2"/>
 </svg>`;
}
function barChart(){

}

function sky(ctx,w,h,slot){
 const g=ctx.createLinearGradient(0,0,0,h);
 const P=[["#9fc7e6","#e8f0f2"],["#6fa8d6","#d9e9f2"],["#1c2f5a","#e08a5a"]][slot]||["#9fc7e6","#e8f0f2"];
 g.addColorStop(0,P[0]);g.addColorStop(1,P[1]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function redwood(ctx,x,base,ht,col){
 ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,base-ht);
 const wdt=ht*0.16;
 for(let i=1;i<=6;i++){const yy=base-ht+ht*i/6;ctx.lineTo(x+wdt*(i/6)*1.1,yy-ht*0.05);ctx.lineTo(x+wdt*(i/6)*0.7,yy);}
 ctx.lineTo(x-wdt*0.7,base);
 for(let i=6;i>=1;i--){const yy=base-ht+ht*i/6;ctx.lineTo(x-wdt*(i/6)*0.7,yy);ctx.lineTo(x-wdt*(i/6)*1.1,yy-ht*0.05);}
 ctx.closePath();ctx.fill();
}
function slugSprite(ctx,x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle="#FDC700";
 ctx.beginPath();ctx.moveTo(-30,8);ctx.quadraticCurveTo(-28,-6,0,-6);ctx.quadraticCurveTo(16,-6,22,-14);ctx.lineTo(27,-12);ctx.quadraticCurveTo(24,6,0,8);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#FDC700";ctx.lineWidth=2.2;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(22,-13);ctx.lineTo(24,-24);ctx.moveTo(25,-12);ctx.lineTo(31,-22);ctx.stroke();
 ctx.beginPath();ctx.arc(24,-25,2,0,7);ctx.arc(31.5,-23,2,0,7);ctx.fill();ctx.restore();
}
function drawScene(cv,loc,slot){

 const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);const w=r.width,h=r.height,R=rng(loc.length*31+slot*7+S.day*13);
 sky(ctx,w,h,slot);
 if(slot===2){ctx.fillStyle="rgba(255,255,255,.8)";for(let i=0;i<30;i++){ctx.fillRect(R()*w,R()*h*0.5,1.2,1.2)}}

 ctx.fillStyle=slot===2?"#f6e7b0":"#fff7d6";ctx.beginPath();ctx.arc(w*0.82,h*0.28,slot===2?14:18,0,7);ctx.fill();
 // far hills
 ctx.fillStyle=slot===2?"#203357":"#5f8aa6";ctx.beginPath();ctx.moveTo(0,h*0.7);for(let x=0;x<=w;x+=20)ctx.lineTo(x,h*0.6-Math.sin(x/90+loc.length)*12-R()*6);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();
 if(loc==="beach"){
  ctx.fillStyle=slot===2?"#1b3a66":"#2f6fa3";ctx.fillRect(0,h*0.62,w,h*0.2);
  ctx.strokeStyle="rgba(255,255,255,.5)";for(let i=0;i<6;i++){ctx.beginPath();const yy=h*0.66+i*5;ctx.moveTo(R()*w,yy);ctx.lineTo(R()*w,yy);ctx.stroke();}
  ctx.fillStyle="#d9c08f";ctx.fillRect(0,h*0.8,w,h*0.2);

  ctx.strokeStyle=slot===2?"#e8b860":"#ffffff";ctx.lineWidth=2;ctx.beginPath();for(let x=w*0.55;x<w*0.95;x+=4)ctx.lineTo(x,h*0.55-Math.abs(Math.sin((x-w*0.55)/30))*30);ctx.stroke();
 }else if(loc==="downtown"){
  for(let i=0;i<14;i++){const bw=40+R()*50,bx=i*(w/12)-20,bh=30+R()*55;ctx.fillStyle=slot===2?"#152846":"#3d5f80";ctx.fillRect(bx,h*0.82-bh,bw,bh);
   ctx.fillStyle=slot===2?"#ffd66b":"rgba(255,255,255,.4)";for(let j=0;j<5;j++)ctx.fillRect(bx+6+R()*(bw-12),h*0.82-bh+6+R()*(bh-14),5,6);}

 }else if(["library","office","store","home"].includes(loc)){
  // interior: wall + window with forest

  ctx.save();ctx.beginPath();ctx.rect(wx,wy,ww,wh);ctx.clip();sky(ctx,w,h,slot);
  for(let i=0;i<9;i++)redwood(ctx,wx+R()*ww,wy+wh+10,60+R()*50,slot===2?"#0e2a22":"#2c6a4c");ctx.restore();
  ctx.strokeStyle=slot===2?"#33475f":"#9fb2c4";ctx.lineWidth=4;ctx.strokeRect(wx,wy,ww,wh);ctx.beginPath();ctx.moveTo(wx+ww/2,wy);ctx.lineTo(wx+ww/2,wy+wh);ctx.stroke();
  ctx.fillStyle=slot===2?"#2a3d55":"#c4d2de";
  if(loc==="library"||loc==="store"){for(let r2=0;r2<4;r2++){ctx.fillRect(w*0.04,h*0.15+r2*h*0.17,w*0.42,4);for(let b=0;b<14;b++){const bh2=h*0.08+R()*h*0.05;ctx.fillStyle=["#003C6C","#FDC700","#7a9cb8","#b4362a","#2c6a4c"][Math.floor(R()*5)];ctx.fillRect(w*0.05+b*w*0.028,h*0.15+r2*h*0.17-bh2,w*0.022,bh2);}ctx.fillStyle=slot===2?"#2a3d55":"#c4d2de";}}
  else{ctx.fillRect(w*0.06,h*0.55,w*0.36,8);ctx.fillRect(w*0.08,h*0.55,6,h*0.3);ctx.fillRect(w*0.38,h*0.55,6,h*0.3);
   ctx.fillStyle=slot===2?"#9fd3ff":"#003C6C";ctx.fillRect(w*0.15,h*0.36,w*0.14,h*0.18);ctx.fillStyle=slot===2?"#1a2738":"#dfe7ee";ctx.fillRect(w*0.16,h*0.38,w*0.12,h*0.13);}
  ctx.fillStyle=slot===2?"#122033":"#c9d3dc";ctx.fillRect(0,h*0.86,w,h*0.14);
 }else{
  // campus / forest: meadow + redwoods + fog
  ctx.fillStyle=slot===2?"#2b3f2a":"#9cb873";ctx.fillRect(0,h*0.74,w,h*0.26);
  if(loc==="campus"){ctx.fillStyle=slot===2?"#22344f":"#e9eef3";ctx.fillRect(w*0.12,h*0.5,w*0.2,h*0.25);ctx.fillStyle=slot===2?"#ffd66b":"#7a9cb8";for(let i=0;i<6;i++)ctx.fillRect(w*0.14+i*w*0.03,h*0.56,w*0.015,h*0.05);}
  const n=loc==="forest"?22:13;
  for(let i=0;i<n;i++){const x=R()*w;if(loc==="campus"&&x>w*0.1&&x<w*0.34)continue;redwood(ctx,x,h*0.8+R()*6,60+R()*80,slot===2?"#0e2a22":(R()>.5?"#1f4d3a":"#2c6a4c"));}
  ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(0,h*0.55,w,h*0.12);
 }
 slugSprite(ctx,w*0.12,h*0.9,0.9);

let heroRAF=null;
function startHero(){
 const cv=document.getElementById("heroc");if(!cv)return;
 const reduce=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
 let t=0;
 function frame(){
  if(!document.body.contains(cv))return;
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr)){cv.width=r.width*dpr;cv.height=r.height*dpr;}
  const ctx=cv.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height,R=rng(7);
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"#021a30");g.addColorStop(.55,"#0a3d66");g.addColorStop(1,"#0f4d4a");ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.fillStyle="rgba(255,255,255,.75)";for(let i=0;i<50;i++)ctx.fillRect(R()*w,R()*h*0.45,1.2,1.2);
  ctx.fillStyle="#1c5a8a";ctx.fillRect(0,h*0.48,w,h*0.06);
  for(let layer=0;layer<3;layer++){const cols=["#0e3a4a","#0b3030","#062520"][layer];const n=[18,14,10][layer];
   for(let i=0;i<n;i++)redwood(ctx,(R()*w*1.1)-20,h*(0.62+layer*0.13),h*(0.28+layer*0.12)+R()*40,cols);}
  // fog band
  const fx=(t*0.3)%w;ctx.fillStyle="rgba(220,235,245,.10)";
  for(let k=-1;k<2;k++){ctx.beginPath();ctx.ellipse(fx+k*w,h*0.66,w*0.5,22,0,0,7);ctx.fill();}
  ctx.fillStyle="#04140f";ctx.fillRect(0,h*0.93,w,h*0.07);
  slugSprite(ctx,reduce?w*0.75:w*0.5+((t*0.35)%(w*0.55)),h*0.93,1.4);
  t++;if(!reduce)heroRAF=requestAnimationFrame(frame);
 }
 cancelAnimationFrame(heroRAF);frame();
}

const LC={};let lcN=0;
function niceStep(range,n){const raw=range/n,p=Math.pow(10,Math.floor(Math.log10(raw||1))),f=raw/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function fmtK(v){const a=Math.abs(v);return (v<0?"−":"")+(a>=1e6?"$"+(a/1e6).toFixed(a>=1e7?0:1)+"M":a>=1e4?"$"+Math.round(a/1e3)+"k":a>=1e3?"$"+(a/1e3).toFixed(1)+"k":"$"+Math.round(a));}
function lineSVG(series,opt={}){
 const id="lc"+(++lcN);
 const W=680,H=opt.h||260,pl=58,pr=18,pt=18,pb=34;
 const xs=series[0].pts.map(p=>p[0]);const xmin=xs[0],xmax=xs[xs.length-1];
 let ymax=Math.max(1,...series.flatMap(s=>s.pts.map(p=>p[1])));let ymin=Math.min(0,...series.flatMap(s=>s.pts.map(p=>p[1])));
 const st=niceStep(ymax-ymin,4);ymax=Math.ceil(ymax/st)*st;ymin=Math.floor(ymin/st)*st;
 const sx=x=>pl+(x-xmin)*(W-pl-pr)/((xmax-xmin)||1),sy=y=>pt+(ymax-y)*(H-pt-pb)/((ymax-ymin)||1);
 const yt=[];for(let v=ymin;v<=ymax+1e-9;v+=st)yt.push(v);
 const xst=niceStep(xmax-xmin,opt.xn||6);const xt=[];for(let v=Math.ceil(xmin/xst)*xst;v<=xmax+1e-9;v+=xst)xt.push(v);
 const xf=opt.xf||(x=>x);
 LC[id]={series,opt,W,H,pl,pr,xmin,xmax,sx,sy};
 const paths=series.map((s,i)=>{const d=s.pts.map((p,j)=>`${j?"L":"M"}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join("");
  const area=s.fill?`<path d="${d}L${sx(s.pts[s.pts.length-1][0])},${sy(Math.max(0,ymin))}L${sx(s.pts[0][0])},${sy(Math.max(0,ymin))}Z" fill="${s.c}" opacity=".12"/>`:"";
  return area+`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||2.6}" ${s.dash?'stroke-dasharray="6 5"':""} stroke-linejoin="round" stroke-linecap="round"/>`+`<circle cx="${sx(s.pts[s.pts.length-1][0])}" cy="${sy(s.pts[s.pts.length-1][1])}" r="4.5" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`}).join("");
 return `<div class="lc" data-lc="${id}"><div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join("")}</div>
 <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||"Chart")}">
  ${yt.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1" ${v===0?"":'stroke-dasharray="2 4"'}/><text x="${pl-8}" y="${sy(v)+4}" text-anchor="end" class="ax">${fmtK(v)}</text>`).join("")}
  ${xt.map(v=>`<text x="${sx(v)}" y="${H-10}" text-anchor="middle" class="ax">${xf(v)}</text>`).join("")}
  ${paths}
  <line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
  ${series.map((s,i)=>`<circle class="xd" data-i="${i}" r="5" fill="${s.c}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`).join("")}
 </svg><div class="tt" hidden></div></div>`;
}
function lcMove(e){

 const L=LC[box.dataset.lc];if(!L)return;const svg=box.querySelector("svg"),r=svg.getBoundingClientRect();
 const vx=(e.clientX-r.left)*L.W/r.width;let best=0,bd=1e9;const pts=L.series[0].pts;
 pts.forEach((p,i)=>{const d=Math.abs(L.sx(p[0])-vx);if(d<bd){bd=d;best=i}});
 const X=L.sx(pts[best][0]);const xh=svg.querySelector(".xh");xh.setAttribute("x1",X);xh.setAttribute("x2",X);xh.setAttribute("opacity",".5");
 svg.querySelectorAll(".xd").forEach(c=>{const s=L.series[+c.dataset.i];const p=s.pts[best];if(!p)return;c.setAttribute("cx",L.sx(p[0]));c.setAttribute("cy",L.sy(p[1]));c.setAttribute("opacity","1")});
 const tt=box.querySelector(".tt");tt.hidden=false;
 tt.innerHTML=`<b>${(L.opt.tf||L.opt.xf||(x=>x))(pts[best][0])}</b>`+L.series.map(s=>s.pts[best]?`<div><i style="background:${s.c}"></i>${s.n}<span>${s.pts[best][1]<-0.5?"−":""}${$(s.pts[best][1])}</span></div>`:"").join("");
 const px=X*r.width/L.W;tt.style.left=Math.min(Math.max(8,px+12),r.width-tt.offsetWidth-8)+"px";
}
function lcLeave(e){const box=e.target.closest&&e.target.closest(".lc");if(!box||box.contains(e.relatedTarget))return;

function donutViz(parts,center,caption){
 const tot=parts.reduce((a,p)=>a+p.v,0);let a0=-Math.PI/2;const R=70,r=44,cx=90,cy=90;
 const arcs=parts.map(p=>{const a1=a0+p.v/tot*Math.PI*2;const lg=a1-a0>Math.PI?1:0;
  const d=`M${cx+R*Math.cos(a0)},${cy+R*Math.sin(a0)}A${R},${R} 0 ${lg} 1 ${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)}L${cx+r*Math.cos(a1)},${cy+r*Math.sin(a1)}A${r},${r} 0 ${lg} 0 ${cx+r*Math.cos(a0)},${cy+r*Math.sin(a0)}Z`;a0=a1;return `<path d="${d}" fill="${p.c}" stroke="var(--surface)" stroke-width="2"/>`}).join("");

const C1="var(--accent)",C2="var(--gold-line)",C3="var(--bad)",C4="var(--good)";
const fv=(m,r,months)=>r?m*((Math.pow(1+r/12,months)-1)/(r/12)):m*months;
const ym=m=>{const y=Math.floor(m/12),mo=m%12;return [y?`${y} yr${y>1?"s":""}`:"",mo?`${mo} mo`:""].filter(Boolean).join(" ")||"0 mo"};
function amort(B,r,years,extra=0,lump=0){
 const P=pmt(B,r,years*12);let bal=Math.max(0,B-lump),m=0,int=0;const pts=[[0,bal]];
 while(bal>0.005&&m<600){const i=bal*r/12;const pay=Math.min(bal+i,P+extra);bal=bal+i-pay;int+=i;m++;if(m%12===0||bal<=0.005)pts.push([m/12,Math.max(0,bal)]);}
 return{P,months:m,int,pts};
}
function cardSim(B,apr,mode,fixed){
 let bal=B,m=0,int=0;const pts=[[0,B]];
 while(bal>0.005&&m<480){const i=bal*apr/12;let pay=mode==="min"?Math.max(25,bal*0.01+i):fixed;if(pay<=i&&mode!=="min")return{stuck:true,pts,months:Infinity,int:Infinity};pay=Math.min(pay,bal+i);bal=bal+i-pay;int+=i;m++;if(m%3===0||bal<=0.005)pts.push([m/12,Math.max(0,bal)]);}
 return{months:m,int,pts};
}

   <div class="seg presets">${T.presets.map((pr,i)=>`<button data-preset="${i}">${pr[0]}</button>`).join("")}</div>
   ${T.ctrls.map(([k,l,mn,mx,stp,f])=>`<div class="ctl"><div class="rangehead" data-sync="lh-${k}"><span>${l}</span><b>${f(p[k])}</b></div><input type="range" data-lp="${k}" min="${mn}" max="${mx}" step="${stp}" value="${p[k]}" aria-label="${esc(l)}"></div>`).join("")}
   <button class="btn ghost sm" id="labreset">Reset</button>
  </div>
  <div class="labout" data-sync="labout">
   <p class="verdict">${R.head}</p>
   <div class="kpis">${R.tiles.map(x=>`<div class="kpi ${x[2]==="gold"?"hi":""}"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}</div>
   <div class="chart">${R.chart}</div>
   <div class="tip">${SLUG(30)}<div><b>Why it matters</b>${R.note}</div></div>
  </div>
 </section>`;
}

const NAVY="var(--accent)",GOLDC="var(--gold-line)",SKY="#5B9BD5",SAGE="#4E9A6C",ROSE="var(--bad)",GREY="var(--muted)";
const MODULES=[
 {id:"loans",n:"Student loans",icon:"cap",d:"Grants vs. loans, subsidized vs. unsubsidized, and paying it back.",lessons:[
  {id:"l1",t:"Grants, work-study and loans",body:`<p>Your financial aid offer mixes three kinds of money. <b>Grants and scholarships</b> are free; you don't pay them back. <b>Work-study</b> is money you earn through a campus job. <b>Loans</b> are borrowed and must be repaid with interest.</p><p>Always use free money first, then earned money, and borrow only for what's left. You can accept part of a loan; you don't have to take the full amount offered.</p>`,
   viz:()=>stackViz([{l:"Grants & scholarships",v:9800,c:SAGE},{l:"Work-study",v:2500,c:SKY},{l:"Subsidized loan",v:3500,c:NAVY},{l:"Unsubsidized loan",v:2000,c:ROSE}],0,"Example yearly aid offer. Green and blue never need to be repaid."),
   key:["Accept aid in order: grants → work-study → subsidized → unsubsidized","You can reduce a loan amount any time before or after it's paid out","FAFSA or CA Dream Act applications open each fall; file early every year"],
   q:{q:"Which part of an aid offer do you never repay?",o:["Unsubsidized loans","Grants and scholarships","Parent PLUS loans","All aid is repaid"],a:1,ex:"Grants and scholarships are gift aid. Work-study is earned. Loans are repaid."},terms:["Refund (aid)"]},
  {id:"l2",t:"Subsidized vs. unsubsidized",body:`<p>Both are federal Direct Loans with the same fixed rate (6.52% for undergraduate loans first paid out July 2026 – June 2027). The difference is who pays the interest while you're in school.</p><p>With a <b>subsidized</b> loan, the government pays it while you're enrolled at least half-time and during your grace period. With an <b>unsubsidized</b> loan, interest starts the day it's paid out. If you don't pay it, it's added to your balance when repayment starts.</p><p>A small fee (about 1%) is also deducted before you get the money.</p>`,
   viz:()=>{const s=[],u=[];let acc=0;for(let m=0;m<=54;m+=3){if(m)acc+=2000*0.0652*3/12;s.push([m/12,2000]);u.push([m/12,2000+acc]);}return lineSVG([{n:"Subsidized $2,000",c:NAVY,pts:s},{n:"Unsubsidized $2,000",c:ROSE,pts:u,fill:1}],{xf:x=>"Yr "+x.toFixed(0),label:"Balance during school",h:220})},
   key:["Subsidized loans are need-based and have lower limits","Unsubsidized interest builds even while you study","Paying interest while in school keeps the balance from growing"],
   q:{q:"You borrow $2,000 unsubsidized as a freshman and pay nothing until after graduation. What happens?",o:["You owe exactly $2,000","Interest builds and is added to your balance","The government pays the interest","The loan is forgiven"],a:1,ex:"About $590 of interest builds over 4.5 years at 6.52%, and it's capitalized into your balance."},lab:"unsub",terms:["Subsidized loan","Unsubsidized loan","Origination fee"]},
  {id:"l3",t:"Paying it back",body:`<p>Repayment on federal loans usually starts after a <b>6-month grace period</b> once you graduate or drop below half-time. The standard plan spreads payments over 10 years.</p><p>Extra payments go straight to principal and there's no penalty for paying early. Income-driven repayment plans can lower payments based on income, but the plan rules changed recently, so check studentaid.gov for current options.</p><p>Never pay a company to "consolidate" or "forgive" your loans; those services are free through your servicer.</p>`,
   viz:()=>{const a=amort(27000,0.0652,10),b=amort(27000,0.0652,10,50);return lineSVG([{n:"Standard",c:ROSE,pts:a.pts,dash:1},{n:"+$50/month",c:NAVY,pts:b.pts,fill:1}],{xf:x=>"Yr "+Math.round(x),label:"Loan payoff",h:220})},
   key:["Know your servicer and log in before your first bill","Even $25 extra a month shortens repayment","Loan forgiveness scams are common; free help exists"],
   q:{q:"Someone offers to lower your federal loan payments for a $300 fee. Best move?",o:["Pay it, it's worth it","Use the free options through your servicer and studentaid.gov","Stop paying until they call back","Take a private loan to pay the fee"],a:1,ex:"Everything those companies offer can be done free through your servicer."},lab:"loan",terms:[]}]},
 {id:"pay",n:"Paychecks & taxes",icon:"receipt",d:"Gross vs. net pay, withholding, W-2s and filing for free.",lessons:[
  {id:"p1",t:"Gross pay vs. net pay",body:`<p><b>Gross pay</b> is hours × rate. <b>Net pay</b> is what reaches your bank after withholding: federal and state income tax, CA SDI and usually FICA (Social Security and Medicare).</p><p>Students working for their own school while enrolled at least half-time are usually exempt from FICA, so campus jobs often take home a little more per hour.</p><p>Always budget with net pay.</p>`,
   viz:()=>stackViz([{l:"Take-home (net)",v:343.56,c:SAGE,f:"$343.56"},{l:"Social Security + Medicare",v:30.29,c:SKY,f:"$30.29"},{l:"Federal tax",v:14,c:NAVY,f:"$14.00"},{l:"CA tax + SDI",v:8.15,c:GOLDC,f:"$8.15"}],0,"A $396 paycheck from an off-campus job."),
   key:["Check hours and rate on every stub","YTD totals help you estimate taxes","FICA = 6.2% Social Security + 1.45% Medicare"],
   q:{q:"You earn $18/hr for 20 hours. Which number should your budget use?",o:["$360 gross","Your net pay after withholding","$360 minus 50%","Your YTD total"],a:1,ex:"Budget with what actually arrives."},terms:["Gross pay","Net pay","Withholding","FICA","YTD"]},
  {id:"p2",t:"Your tax forms",body:`<p>By January 31, employers send a <b>W-2</b> (wages and tax withheld). Your school sends a <b>1098-T</b> (tuition billed, grants received), which may qualify you or your parents for an education credit. Freelance or gig work shows up on a <b>1099</b>.</p><p>The <b>standard deduction</b> means the first $16,100 of income (tax year 2026, single) isn't taxed. Many students owe nothing, but you only get your withholding back if you file.</p><p>Federal returns are due April 15.</p>`,
   viz:()=>stackViz([{l:"Untaxed: standard deduction",v:16100,c:SAGE},{l:"Taxed at 10%+",v:4000,c:ROSE}],0,"If you earned $20,100, only $4,000 would be taxable."),
   key:["Keep W-2s, 1098-T and 1099s together","File even if you owe nothing to get withholding back","If parents claim you, coordinate before filing"],
   q:{q:"You earned $9,000 with $280 federal tax withheld. If you file, you'll most likely…",o:["Owe more","Get about $280 back","Get nothing back","Get fined"],a:1,ex:"$9,000 is under the standard deduction, so withheld tax comes back."},terms:["W-2","1098-T","Standard deduction","Tax refund"]},
  {id:"p3",t:"Filing for free",body:`<p>Most students can file for free. <b>IRS Free File</b> partners and volunteer <b>VITA</b> clinics prepare simple returns at no cost, and VITA volunteers can check education credits.</p><p>Be careful with apps that start free and then charge for state returns, "max refund" upgrades or <b>refund advances</b>. Those fees come out of money that's already yours.</p><p>Choose direct deposit; refunds usually arrive in about three weeks.</p>`,
   viz:()=>stackViz([{l:"Your refund (free filing)",v:410,c:SAGE,f:"$410"},{l:"Paid app fees",v:108,c:ROSE,f:"−$108"}],0,"The same $410 refund, through a free option vs. a paid app."),
   key:["Search IRS Free File on irs.gov","Ask your campus or community about VITA dates","Never pay to file a W-2-only return"],
   q:{q:"An app says your refund is $410, but it will cost $69 plus a $39 advance fee. Free alternative?",o:["There isn't one","IRS Free File or a VITA clinic","Wait until next year","Ask your employer"],a:1,ex:"Both prepare simple returns at no cost."},terms:[]}]},
 {id:"credit",n:"Credit & cards",icon:"card",d:"How scores work, reading statements and building credit safely.",lessons:[
  {id:"c1",t:"How a credit score works",body:`<p>A credit score summarizes how you've handled borrowing. Lenders, landlords and some employers check it. The most common score, FICO, ranges from 300 to 850.</p><p>FICO publicly lists what matters: <b>payment history</b> is the biggest factor, then <b>amounts owed</b> (including credit utilization), <b>length of history</b>, <b>new credit</b> and <b>credit mix</b>.</p><p>One missed payment hurts more than almost anything else.</p>`,
   viz:()=>donutViz([{l:"Payment history",v:35,c:NAVY},{l:"Amounts owed",v:30,c:SKY},{l:"Length of history",v:15,c:SAGE},{l:"New credit",v:10,c:GOLDC},{l:"Credit mix",v:10,c:ROSE}],["FICO","factors"],"FICO's published weightings for the general population."),
   key:["Pay every bill on time, every time","Use under ~30% of your limit","Keep your oldest account open"],
   q:{q:"What affects your credit score the most?",o:["Your income","Paying on time","How many cards you have","Your bank balance"],a:1,ex:"Payment history is about 35% of a FICO score. Income isn't part of it."},terms:["Credit utilization"]},
  {id:"c2",t:"Reading a card statement",body:`<p>Every statement shows a <b>statement balance</b>, a <b>minimum payment</b> and a <b>due date</b>. Pay the full statement balance by the due date and you pay no interest on purchases, thanks to the <b>grace period</b>.</p><p>Pay only the minimum and the rest is charged interest at the card's <b>APR</b>, often 20–30% for students. The statement's minimum payment warning shows how long that would take.</p>`,
   viz:()=>{const a=cardSim(1200,0.2799,"min"),b=cardSim(1200,0.2799,"fixed",100);return lineSVG([{n:"Minimum only",c:ROSE,pts:a.pts,dash:1},{n:"$100/month",c:NAVY,pts:b.pts,fill:1}],{xf:x=>"Yr "+Math.round(x),label:"$1,200 card balance payoff",h:220})},
   key:["Autopay the full statement balance","Avoid cash advances: higher APR plus fees","A late fee can be up to about $40"],
   q:{q:"Your statement balance is $180 and minimum is $25. To pay no interest, pay…",o:["$25","$180 by the due date","$0, you have a grace period","$90"],a:1,ex:"The grace period only protects you if you pay the full statement balance."},lab:"card",terms:["APR","Grace period","Statement balance","Minimum payment"]},
  {id:"c3",t:"Building credit as a student",body:`<p>No history means no score, which can make renting harder. Common first steps: a <b>student or secured card</b>, or becoming an <b>authorized user</b> on a parent's card.</p><p>Put one small recurring bill on the card, set autopay for the full balance and never think about it again. Check your reports free at <b>AnnualCreditReport.com</b> to catch errors or fraud.</p>`,
   viz:()=>stackViz([{l:"Used: $90",v:90,c:NAVY},{l:"Available: $410",v:410,c:"var(--surface-2)"}],0,"$90 of a $500 limit = 18% utilization."),
   key:["One card, one small bill, autopay in full","Don't apply for many cards at once","Free reports: AnnualCreditReport.com"],
   q:{q:"Best way to build credit with your first card?",o:["Max it out and pay the minimum","Small purchases, paid in full on autopay","Never use it","Take cash advances"],a:1,ex:"Low use plus on-time, full payments builds history without interest."},terms:[]}]},
 {id:"budget",n:"Budgeting & spending",icon:"cart",d:"50/30/20, small habits and grocery strategy.",lessons:[
  {id:"b1",t:"The 50/30/20 starting point",body:`<p>A budget tells your money where to go before it disappears. A simple start: about <b>50% needs</b> (rent, groceries, bills, transport), <b>30% wants</b> (eating out, fun) and <b>20% savings or debt payoff</b>.</p><p>In Santa Cruz, rent often pushes needs above 50%. That's fine. Adjust the split, but keep some savings, even 5–10%, so surprises don't land on a credit card.</p>`,
   viz:()=>donutViz([{l:"Needs",v:50,c:NAVY},{l:"Wants",v:30,c:GOLDC},{l:"Savings & debt",v:20,c:SAGE}],["50/30/20","rule"],"A starting framework, not a strict rule."),
   key:["Budget by month, with net pay","Pay yourself first: move savings on payday","Track spending for one week to see the truth"],
   q:{q:"Your rent alone is 55% of income. What's the best adjustment?",o:["Give up on budgeting","Shrink wants, keep a small savings amount","Stop saving entirely","Put rent on a credit card"],a:1,ex:"The framework bends. Keep some savings so one surprise doesn't become debt."},terms:["50/30/20 budget"]},
  {id:"b2",t:"Small habits, big totals",body:`<p>A $6.50 coffee five times a week is about $1,690 a year. That isn't a reason to never buy coffee. It's a reason to buy it on purpose.</p><p>Try the <b>"cost per year"</b> test: multiply a habit by 52 weeks. Then decide which habits are worth it to you and trim the ones that aren't.</p>`,
   viz:()=>{const pts1=[],pts2=[];for(let y=0;y<=10;y++){pts1.push([y,1690*y]);pts2.push([y,fv(1690/12,0.07,y*12)])}return lineSVG([{n:"Spent on coffee",c:ROSE,pts:pts1},{n:"If invested at 7%",c:NAVY,pts:pts2,fill:1}],{xf:x=>"Yr "+x,label:"Coffee habit over 10 years",h:220})},
   key:["Weekly cost × 52 = yearly cost","Swap, don't quit: home coffee 3 days a week","Delivery fees and tips can add 30%+"],
   q:{q:"A $14 lunch out, 4 times a week, costs about how much per year?",o:["$728","$2,912","$5,600","$14,000"],a:1,ex:"$14 × 4 × 52 = $2,912."},lab:"habit",terms:[]},
  {id:"b3",t:"Groceries on a student budget",body:`<p>Cooking is the single biggest food saving. Plan 4–5 dinners, write a list and shop once a week. Compare the <b>unit price</b> (per ounce or serving), not the package price, and try store brands.</p><p>If money is tight, campus <b>food pantries</b> and <b>CalFresh</b> (California's food assistance program) are for students too. Many students qualify, for example if they work 20 hours a week or have work-study.</p>`,
   viz:()=>stackViz([{l:"Cooked at home",v:3.1,c:SAGE,f:"~$3/meal"},{l:"Takeout",v:14,c:GOLDC,f:"~$14/meal"},{l:"Delivery",v:24,c:ROSE,f:"~$24/meal"}],0,"Rough cost of one meal three ways."),
   key:["List + plan = fewer impulse buys","Unit price is the honest comparison","Using a pantry or CalFresh is smart, not shameful"],
   q:{q:"Which tells you the better deal?",o:["Package price","Unit price","Bigger package","Brand name"],a:1,ex:"Unit price compares across sizes and brands."},terms:["Unit price"]}]},
 {id:"housing",n:"Housing & bills",icon:"home",d:"Leases, deposits, splitting bills and promo traps.",lessons:[
  {id:"h1",t:"Read your lease",body:`<p>Before you sign, find: monthly rent and due date, the <b>late fee</b> and when it applies, how to pay (and any card fees), the <b>security deposit</b> and whether tenants are <b>jointly responsible</b> for the full rent.</p><p>In California, a landlord must return your deposit, with an itemized list of any deductions, within 21 days of move-out. Take dated photos when you move in and out.</p>`,
   viz:()=>stackViz([{l:"Rent (your share)",v:1150,c:NAVY},{l:"Utilities & internet",v:42,c:SKY},{l:"Renter's insurance",v:15,c:SAGE},{l:"Late fee if late",v:75,c:ROSE}],0,"A Westside renter's monthly housing costs, plus the fee to avoid."),
   key:["Joint responsibility means a roommate's missed rent can become your problem","Get every agreement in writing","Photos protect your deposit"],
   q:{q:"In California, how long does a landlord have to return a deposit?",o:["7 days","21 days","60 days","No limit"],a:1,ex:"21 days, with an itemized statement for deductions."},terms:["Security deposit","Late fee"]},
  {id:"h2",t:"Splitting bills with roommates",body:`<p>Agree on the split in writing before the first bill: who's on which account, when Venmo requests go out and what happens if someone's late.</p><p>Put shared bills in one person's name only if everyone trusts the system. Late utility bills can hurt that person's credit. A shared spreadsheet or bill-splitting app makes it transparent.</p>`,
   viz:()=>stackViz([{l:"You",v:1,c:NAVY,f:"$42"},{l:"Roommate 2",v:1,c:SKY,f:"$42"},{l:"Roommate 3",v:1,c:SAGE,f:"$42"}],0,"$126 utilities split three ways."),
   key:["Decide the split before move-in","Pay your share on time, every time","Renter's insurance covers your stuff; the landlord's doesn't"],
   q:{q:"A housemate pays utilities in their name and you pay them late. Who's hurt?",o:["Nobody","Your housemate's credit and trust","Only the utility","Only you"],a:1,ex:"The account holder is responsible to the utility."},terms:[]},
  {id:"h3",t:"Promos, autopay and subscriptions",body:`<p>Bills jump when <b>promotional rates</b> end. Put the end date in your calendar and call to ask for a new deal or a student discount.</p><p><b>Autopay</b> prevents late fees, as long as checking has a cushion. Review subscriptions every few months, and check what your student fees already cover, like campus recreation facilities and local buses.</p>`,
   viz:()=>stackViz([{l:"Kept",v:24.97,c:NAVY,f:"$24.97/mo"},{l:"Cut",v:42.97,c:SAGE,f:"$42.97/mo → $516/yr"}],0,"An example subscription audit."),
   key:["Calendar every promo end date","Autopay + a $100 checking cushion","Audit subscriptions each quarter"],
   q:{q:"Your phone bill went from $43 to $58 with no change in use. Most likely?",o:["Fraud","A promotional discount expired","Taxes doubled","Data overage"],a:1,ex:"Promo expirations are the most common cause."},terms:["Promotional rate"]}]},
 {id:"safety",n:"Saving & safety",icon:"shield",d:"Emergency funds, interest that works for you, and scams.",lessons:[
  {id:"s1",t:"Build an emergency fund",body:`<p>An <b>emergency fund</b> is cash you only touch for surprises: a flat tire, a medical copay, a late paycheck. Without one, surprises go on a credit card.</p><p>Start with <b>$500</b>, then build toward 3 months of expenses. Automate a small transfer on payday so you never have to decide.</p>`,
   viz:()=>{const pts=[];let b=0;for(let m=0;m<=24;m++){if(m)b+=50;pts.push([m,b])}return lineSVG([{n:"$50/month",c:NAVY,pts,fill:1}],{xf:x=>x+" mo",label:"Emergency fund growth",h:200})},
   key:["Keep it separate from checking","Automate it","Refill it after you use it"],
   q:{q:"A good first emergency fund goal for a student?",o:["$50","$500","$10,000","None until graduation"],a:1,ex:"$500 covers most common surprises."},lab:"save",terms:["Emergency fund"]},
  {id:"s2",t:"Make interest work for you",body:`<p>Banks pay you interest on savings, shown as <b>APY</b>. Many big-bank savings accounts pay close to 0%, while online high-yield accounts often pay far more. Always confirm FDIC or NCUA insurance.</p><p>Investing earlier matters even more. Thanks to compound growth, money invested at 20 has decades longer to grow than money invested at 30.</p>`,
   viz:()=>{const A=[],B=[];let va=0,vb=0;for(let age=20;age<=65;age++){A.push([age,va]);B.push([age,vb]);for(let i=0;i<12;i++){va=va*(1+0.07/12)+100;if(age>=30)vb=vb*(1+0.07/12)+100;}}return lineSVG([{n:"Start at 20",c:NAVY,pts:A,fill:1},{n:"Start at 30",c:GOLDC,pts:B}],{xf:x=>"Age "+x,label:"$100/month invested at 7%",h:220})},
   key:["Compare APYs; they change often","Insured accounts only","Time in the market beats timing it"],
   q:{q:"Same $100/month at 7%: who ends with more at 65?",o:["Starts at 30","Starts at 20","About the same","Depends on luck only"],a:1,ex:"Ten extra years of compounding roughly doubles the outcome."},lab:"early",terms:["APY"]},
  {id:"s3",t:"Spot the scam",body:`<p>Scams targeting students: fake "financial aid hold" texts, job offers that send you a check and ask you to send some back, rental listings that want a deposit before a tour, and anyone asking for gift cards or crypto.</p><p>The pattern is always <b>urgency + an unusual payment method + a link</b>. Go to the real site yourself, and report fraud to your bank right away.</p>`,
   viz:()=>stackViz([{l:"Urgency",v:1,c:ROSE,f:"\"within 24 hours\""},{l:"Odd payment",v:1,c:GOLDC,f:"gift cards, crypto"},{l:"Link or attachment",v:1,c:NAVY,f:"not the real domain"}],0,"Three red flags. Any two together: stop."),
   key:["Never share a login or one-time code","No real employer pays you before you start","See the apartment before paying anything"],
   q:{q:"A new 'remote job' mails you a $1,500 check and asks you to send $400 back for supplies. This is…",o:["A normal onboarding step","A fake check scam","A tax form","A paycheck advance"],a:1,ex:"The check bounces after you've sent real money."},terms:["Phishing"]}]}
];
const allLessons=()=>MODULES.flatMap(m=>m.lessons);
function modProg(m){return m.lessons.filter(l=>PROG.done.includes(l.id)).length;}
function ring(p,size=44){const r=size/2-4,c=2*Math.PI*r;return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--gold-line)" stroke-width="4" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="round"/></svg>`;}
function learnView(){
 const L=UI.learn,total=allLessons().length,done=PROG.done.length;
 if(L.mod===null){
  return `<section class="sechead"><span class="kicker">${ic("book",16)} Learn at your own pace</span><h1>Money skills, one short lesson at a time</h1><p class="lead">Six modules, eighteen lessons, about three minutes each. Every lesson ends with a quick check, and many link to the Decision Lab so you can try the numbers yourself.</p>
   <div class="progbar"><div class="meter"><i style="width:${done/total*100}%"></i></div><span>${done} of ${total} lessons complete</span></div></section>
   <div class="modgrid">${MODULES.map(m=>{const p=modProg(m);return `<button class="modcard" data-mod="${m.id}"><span class="mi">${ic(m.icon,26)}</span><span class="mt2"><b>${m.n}</b><span>${m.d}</span><em>${p}/${m.lessons.length} lessons${p===m.lessons.length?" · complete":""}</em></span><span class="rg">${ring(p/m.lessons.length)}</span></button>`}).join("")}</div>`;
 }
 const m=MODULES.find(x=>x.id===L.mod),les=m.lessons[L.les],a=L.ans[les.id],isDone=PROG.done.includes(les.id);
 return `<nav class="crumbs"><button class="link" id="lback">← All modules</button><span>${m.n}</span></nav>
 <div class="lessonlayout">
  <aside class="lessonnav">${m.lessons.map((l,i)=>`<button class="ln ${i===L.les?"on":""}" data-les="${i}"><span class="num ${PROG.done.includes(l.id)?"ok":""}">${PROG.done.includes(l.id)?ic("check",14):i+1}</span>${l.t}</button>`).join("")}</aside>
  <article class="lesson stage fade" id="stage"><div class="body">
   <span class="kicker">${m.n} · Lesson ${L.les+1} of ${m.lessons.length}</span>
   <h2>${les.t}</h2>
   <div class="lbody">${les.body}</div>
   ${les.viz()}
   <div class="keypts"><h4>Remember</h4><ul>${les.key.map(k=>`<li>${k}</li>`).join("")}</ul></div>
   <div class="q check"><span class="kicker">Quick check</span><div class="qq">${les.q.q}</div><div class="opts">${les.q.o.map((o,i)=>`<button class="opt ${a!==undefined&&i===les.q.a?"right":""} ${a===i&&i!==les.q.a?"wrong":""}" data-lq="${i}" ${a!==undefined&&a===les.q.a?"disabled":""}>${o}</button>`).join("")}</div>
    ${a!==undefined?`<p class="explain"><b class="${a===les.q.a?"good":"bad"}">${a===les.q.a?"Right.":"Not quite, try again."}</b> ${a===les.q.a?les.q.ex:""}</p>`:""}</div>
   <div class="lfoot">${les.lab?`<button class="btn ghost" data-golab="${les.lab}">${ic("flask",18)} Try it in the Decision Lab</button>`:""}
    <span style="flex:1"></span>

  F.bnpl.forEach(b=>{const n=Math.min(2,b.left),a=b.amt*n;if(F.checking<a)fee(10*n,"Buy now, pay later late fees");F.checking-=a;out("Buy now, pay later installments",a,"other");b.left-=n;});F.bnpl=F.bnpl.filter(b=>b.left>0);
  if(F.adv){F.checking-=F.adv.owe;out("Cash advance app repayment",F.adv.owe,"other");F.adv=null;}

   const B=c.bal;
   if(B>0.5){const minDue=Math.min(B,Math.max(25,B*0.01+it));const want=P.cardPay==="full"?B:P.cardPay==="fixed"?Math.min(B,Math.max(150,minDue)):minDue;

     if(!L.notes.includes("late"))L.notes.push("late");}
    F.checking-=paid;c.bal-=paid;c.carry=c.bal>0.5?c.bal:0;}else c.carry=0;}

 const T=turn(),P=F.policy,Q={};

  const tS=30+(P.units-15)*2.2+Math.max(0,P.hours-10)*1.3+(F.checking<200?10:0)+(F.card&&F.card.bal>F.card.limit*0.5?6:0)+FUN[P.fun].s+(F.savings>=1000?-5:0)+(F.gigOn?5:0);

  let g=3.35-(P.units-15)*0.045-Math.max(0,P.hours-12)*0.035-Math.max(0,F.stress-55)*0.018+(F.health-65)*0.006+(F.qAdj.gpa||0)+gauss()*0.16;
  g=Math.round(clamp(g,0,4)*100)/100;
  let ue=Math.max(0,P.units-(F.qAdj.drop||0));if(g<1)ue=Math.round(ue/2);
  F.units+=ue;F.gpaPts+=g*ue;F.gpaUnits+=ue;F.qgpa.push({l:qLabel(T),g});Q.gpa=g;Q.units=ue;

  if(P.hours>=8)F.resume+=2;if(F.social>=60)F.resume+=1;
 }else{const S=SUMMER[F.summer.plan];F.resume+=S.resume;
  F.stress=clamp(Math.round(F.stress*0.5+(S.rest?20:S.hrs>=40?40:32)*0.5));F.health=clamp(Math.round(F.health*0.5+(S.rest?84:70)*0.5));
  if(S.units){let g=Math.round(clamp(3.4+gauss()*0.15-(F.stress>60?0.2:0),0,4)*100)/100;F.units+=S.units;F.gpaPts+=g*S.units;F.gpaUnits+=S.units;Q.gpa=g;Q.units=S.units;F.qgpa.push({l:qLabel(T),g});}
  if(S.need)F.flags.interned=(F.flags.interned||0)+1;}
 F.resume=Math.min(100,F.resume);
 if(F.gigOn){F.gigOn.qLeft--;if(F.gigOn.qLeft<=0){F.gigOn=null;F.qLedger.notes.push("Your delivery gig wrapped up.");}}
 if(F.pendingRefund){F.checking+=F.pendingRefund;F.qLedger.inc["Tax refund"]=F.pendingRefund;F.tot.refunds+=F.pendingRefund;F.pendingRefund=0;}
 if(F.flags.scholarship&&F.flags.scholarship.t<F.t){F.checking+=F.flags.scholarship.amt;F.qLedger.inc["Scholarship"]=F.flags.scholarship.amt;F.flags.scholarship=null;}
 if(F.flags.friendDebt&&F.flags.friendDebt.t<F.t){if(rnd()<0.5){F.checking+=F.flags.friendDebt.amt;F.qLedger.inc["Friend paid you back"]=F.flags.friendDebt.amt;}else F.qLedger.notes.push(`Your friend still hasn't paid back the ${$(F.flags.friendDebt.amt)}.`);F.flags.friendDebt=null;}

function graduate(){
 F.nwGrad=fNet();F.debtGrad={fed:fedDebt(),other:otherDebt(),acc:F.loans.acc};
 const M=MAJORS[F.major],g=cumGpa();
 let sal=M.sal*(1+(g-3)*0.06)+F.resume*110;sal=Math.round(sal/500)*500;
 const delay=F.resume<20?6:F.resume<40?3:0;
 F.post={base:sal,salary:sal,delay,k401:0.06,health:"ppo",house:"room",carP:F.car?"keep":"none",life:"moderate",plan:"tiered",neg:null};
 F.phase="grad";render();window.scrollTo({top:0,behavior:"smooth"});
}
function tieredYears(b){return b<=25000?10:b<=50000?15:b<=100000?20:25;}
function lifeCosts(p){const P=p||F.post;
 const house={room:1450,studio:2700,home:300}[P.house];
 const car={none:90,keep:300,used:300+pmt(15000,0.09,60),newc:330+pmt(32000,0.07,72)}[P.carP];
 const life={lean:700,moderate:1200,lavish:2000}[P.life];
 const health=P.health==="ppo"?140:45;
 return{house,car,life,health,total:house+car+life+health};}
function netMonthly(sal,k){const pre=sal*k,ag=sal-pre;const t=fedTaxOn(ag)+caTaxOn(ag)+sal*0.0765+sal*SDI_R;return(sal-pre-t)/12;}
function rapPay(agi){if(agi<=10000)return 10;const pct=Math.min(10,Math.ceil(agi/10000)-1);return Math.max(10,agi*pct/100/12);}
function project(opts){
 const P={...F.post,...(opts||{})},r=LOAN_RATE;
 let sal=P.salary,fed=fedDebt(),card=F.card?F.card.bal:0,carB=F.carLoan?F.carLoan.bal:0,carPay=F.carLoan?F.carLoan.pay:0;
 let cash=F.checking,hysa=F.savings,inv=F.invest,k401=0,hsa=0,other=sum(F.bnpl,b=>b.amt*b.left)+(F.adv?F.adv.owe:0)+(F.irsOwe||0);
 cash-=other;
 if(P.carP==="used"){carB+=15000;carPay+=pmt(15000,0.09,60);}if(P.carP==="newc"){carB+=32000;carPay+=pmt(32000,0.07,72);}
 const L=lifeCosts(P);let exp=L.house+L.life+L.health+(P.carP==="none"?90:P.carP==="newc"?330:300);
 const disc={lean:0.8,moderate:0.45,lavish:0.2}[P.life];
 let pay=0,term=0,fedPaid=0,cardIntP=0,debtFree=null,cut=0,maxed=null;
 const pts={nw:[[0,fNet()]],fed:[[0,fed]],ret:[[0,F.invest]]};
 for(let m=0;m<120;m++){
  if(m>0&&m%12===0){sal*=1.04;exp*=1.035;}
  const working=m>=P.delay;const gross=working?sal/12:0;
  const net=working?netMonthly(sal,P.k401):0;
  if(working){k401+=gross*P.k401+gross*Math.min(P.k401,0.06)*0.5;if(P.health==="hdhp"&&m%12===0)hsa+=500;}
  cash+=net-exp;
  if(carB>0){const i=carB*0.085/12,p=Math.min(carPay,carB+i);carB+=i-p;cash-=p;}
  if(m===6){fed+=F.loans.unsub*r*0.5;term=tieredYears(fed);pay=pmt(fed,r,term*12);}
  if(m>=6&&fed>0.5){
   if(P.plan==="rap"){const agi=working?sal*(1-P.k401):0;const p=rapPay(agi),i=fed*r/12;const prin=Math.max(0,p-i),match=prin<50?50-prin:0;fed=Math.max(0,fed-prin-match);cash-=p;fedPaid+=p;}
   else{const extra=P.plan==="fast"?250:0;const i=fed*r/12,p=Math.min(pay+extra,fed+i);fed+=i-p;cash-=p;fedPaid+=p;}
   if(fed<=0.5&&debtFree==null){fed=0;debtFree=m;}}
  if(card>0){const i=card*0.2799/12;card+=i;cardIntP+=i;const p=Math.min(card,Math.max(0,cash-500));card-=p;cash-=p;}
  if(cash<0){card+=-cash;cash=0;}
  if(card>20000){const over=card-20000;card=20000;cut+=over;exp=Math.max(exp*0.85,exp-over);if(maxed==null)maxed=m;}
  const target=exp*3;
  if(cash>800){let x=cash-800;cash=800;const toH=Math.min(x,Math.max(0,target-hysa));hysa+=toH;x-=toH;inv+=x*disc;}
  hysa*=1+0.035/12;inv*=1+0.07/12;k401*=1+0.07/12;hsa*=1+0.05/12;
  if((m+1)%12===0){const y=(m+1)/12;pts.nw.push([y,cash+hysa+inv+k401+hsa-fed-card-carB]);pts.fed.push([y,fed]);pts.ret.push([y,k401+inv+hsa]);}
 }
 const nw10=pts.nw[pts.nw.length-1][1],ret10=k401+inv+hsa;
 const yrsTo65=65-(CH().id==="alex"?36:32);
 const annual=sal*(P.k401+Math.min(P.k401,0.06)*0.5);
 const ret65=ret10*Math.pow(1.07,yrsTo65)+annual*((Math.pow(1.07,yrsTo65)-1)/0.07);
 return{pts,nw10,ret10,ret65,fedLeft:fed,debtFree,fedPaid,cardIntP,cut,maxed,cardEnd:card,term,firstPay:P.plan==="rap"?rapPay(sal*(1-P.k401)):pay,hysa,cash};
}

 car:{loc:"campus",where:"Winter",title:"Do you need a car?",text:()=>"Friends with cars make weekend trips look easy. A 2018 sedan is listed for $9,000, and the dealer offers 11.5% financing for 60 months. Insurance for a 20-year-old would be about $150 a month.",

   {l:"Stay car-free",s:"Your student fees include local bus rides",fx:{social:-2},r:"Bus pass, bike and the occasional ride from friends.",tip:"Going car-free is one of the biggest savings available to students.",lab:{tool:"car",p:{}}}]},
 gig:{loc:"downtown",where:"App store",title:"Weekend delivery gig",text:()=>`A delivery app promises "$20+ an hour." About 8 hours on weekends could bring in roughly $620 a month before costs. You'd be an independent contractor: <b>no taxes withheld</b>, and gas and wear come out of your pocket.`,
  choices:()=>[

 abroad:{loc:"office",where:"Global Learning office",title:"Study abroad next year?",text:()=>"A quarter in Spain through the UC program. Your aid applies, but flights, travel and a weaker dollar add about $3,000.",
  choices:()=>[
   {l:"Go",s:"About $3,000 extra",fx:{pay:3000,resume:10,social:12,stress:-6},cat:"school",r:"Booked. It's a quarter you'll talk about in every interview.",tip:"Your aid usually follows you on approved programs. Ask about study-abroad scholarships before you assume you can't afford it."},

 career:{loc:"campus",where:"Career fair · Fall",title:"Senior-year job search",text:()=>`The fall career fair is next week. Your résumé score is <b>${F.resume}</b>. Employers are hiring for next summer now.`,
  choices:()=>[
   {l:"Résumé review, mock interview, then the fair",s:"Free at the Career Center, about 6 hours",fx:{stress:3,resume:9},r:"You leave the fair with three interviews lined up.",tip:"Most entry-level hiring for June starts in the fall. Starting early raises both your odds and your offer."},

 exit:{loc:"office",where:"studentaid.gov",title:"Loan exit counseling",text:()=>`Before you graduate, you must complete exit counseling for your federal loans. You owe <b>${$(fedDebt())}</b>, including <b>${$(F.loans.acc)}</b> of unpaid interest that will be added to your balance when repayment starts.`,
  choices:()=>[
   {l:"Do it carefully and save your servicer's info",s:"About 30 minutes",fx:{stress:-2},run(){F.flags.exitDone=true},r:"You know your servicer, your grace period ends six months after graduation, and you know the two plans for new loans: Tiered Standard and RAP.",tip:"Log in before your first bill. Missing your first payment because you didn't know your servicer is a common and avoidable mistake.",terms:["Subsidized loan","Unsubsidized loan"]},

 sap:{loc:"office",where:"Financial Aid Office",title:"Your aid is on hold",text:()=>"Two quarters under a 2.0 GPA means you're not meeting Satisfactory Academic Progress. Your grants and federal loans are suspended until you're back on track or an appeal is approved.",
  choices:()=>[
   {l:"Meet an advisor and file an appeal",s:"Explain what happened and your plan",fx:{stress:4},run(){if(rnd()<0.7){F.flags.sapLost=false;F.probation=0;return"Appeal approved on an academic plan. Your aid is restored this quarter.";}return"Appeal denied. You'll need to pay this quarter yourself and raise your GPA.";},tip:"Most schools require about a 2.0 GPA and completing roughly two-thirds of attempted units to keep federal aid. Appeals are allowed for real hardships."},
   {l:"Pay out of pocket for now",s:"Raise your GPA first",r:"No aid until your grades recover.",tip:"Losing aid often comes from stacking too many hours of work on a heavy load. Adjust the plan, not just the effort."}]},
 irs:{loc:"office",where:"Mail · Internal Revenue Service",title:"A letter from the IRS",text:()=>`You didn't file last year, and you owed tax on your gig income. The IRS now says you owe <b>${$(F.irsOwe)}</b> including failure-to-file and late-payment penalties.`,
  choices:()=>[
   {l:"Pay it now",s:"From checking or card",req:()=>canPay(F.irsOwe)?"":"Not enough available",run(){payVia(F.irsOwe,"other");F.irsOwe=0;},fx:{stress:-4},r:"Paid. Lesson learned.",tip:"Even if you can't pay, file on time. The failure-to-file penalty is much bigger than the failure-to-pay penalty."},
   {l:"Set up an IRS payment plan",s:"Small setup fee, monthly payments",run(){fee(22,"IRS payment plan setup fee");F.bnpl.push({amt:Math.ceil(F.irsOwe/6),left:6});F.irsOwe=0;},fx:{stress:-2},r:"Monthly payments for the next three months.",tip:"The IRS offers payment plans online. Ignoring a notice only adds penalties."}]},
 overdrawn:{loc:"home",where:"Banking app",title:"Your account is overdrawn",text:()=>`Checking is at <b>${$s(F.checking)}</b>. Every month it stays negative brings another fee. What do you do?`,
  choices:()=>[
   {l:"Use an instant cash advance app",s:"$300 now, repay $315 next month",fx:{checking:300},run(){F.adv={owe:315}},r:"$300 lands instantly.",tip:"A $15 fee on a one-month $300 advance works out to an APR around 60%. With weekly fees and tips, many advances cost far more.",terms:["APR"]},
   {l:"Apply for a campus emergency grant",s:"Short application, decision in a few days",run(){if(rnd()<0.65){F.checking+=500;return"Approved: a $500 grant you don't repay.";}return"Not approved this time. A financial aid counselor helps you adjust your budget.";},fx:{stress:-2},tip:"Many campuses offer emergency grants and short-term loans. Students who need them often don't know they exist."},

function fAvail(c){
 if(c.req){const r=c.req();if(r)return r;}
 const fx=c.fx||{};
 if(fx.checking<0&&F.checking<-fx.checking)return"Not enough in checking";
 if(fx.savings<0&&F.savings<-fx.savings)return"Not enough in savings";
 if(fx.card>0){if(!F.card)return"You don't have a credit card";if(F.card.limit-F.card.bal<fx.card)return"Over your credit limit";}
 if(fx.pay>0&&!canPay(fx.pay))return"Not enough in checking or on your card";
 return"";
}
function snapF(){return{checking:F.checking,savings:F.savings,card:F.card?F.card.bal:0,debt:otherDebt()-(F.card?F.card.bal:0),invest:F.invest,stress:F.stress,health:F.health,social:F.social,resume:F.resume};}
function fChoose(i){
 const ev=EV[F.cur],c=ev.choices()[i];if(!c||fAvail(c))return;
 const b=snapF(),fx=c.fx||{};
 if(fx.checking)F.checking+=fx.checking;
 if(fx.savings){F.savings+=fx.savings;if(fx.savings<0)spendCat(c.cat,-fx.savings);}
 if(fx.card){F.card.bal+=fx.card;spendCat(c.cat,fx.card);}
 if(fx.pay)payVia(fx.pay,c.cat);
 if(fx.checking<0)spendCat(c.cat,-fx.checking);
 ["stress","health","social"].forEach(k=>{if(fx[k])F[k]=clamp(F[k]+fx[k])});
 if(fx.resume)F.resume=Math.min(100,F.resume+fx.resume);
 const g=c.fxg||{};if(g.gpa)F.qAdj.gpa=(F.qAdj.gpa||0)+g.gpa;if(g.drop)F.qAdj.drop=(F.qAdj.drop||0)+g.drop;
 const extra=c.run?c.run():"";
 const a=snapF();
 const chips=[["checking","Checking",1],["savings","Savings",1],["card","Card owed",-1],["debt","Other debt",-1],["invest","Invested",1],["stress","Stress",-1],["health","Health",1],["social","Social",1],["resume","Résumé",1]]
  .map(([k,n,sgn])=>{const d=a[k]-b[k];if(Math.abs(d)<0.5)return"";const money=["checking","savings","card","debt","invest"].includes(k);return`<span class="fx ${d*sgn>0?"up":"down"}">${n} ${d>0?"+":"−"}${money?$(Math.abs(d)):Math.round(Math.abs(d))}</span>`}).join("")
  +(g.gpa?`<span class="fx ${g.gpa>0?"up":"down"}">GPA this quarter ${g.gpa>0?"+":"−"}${Math.abs(g.gpa).toFixed(2)}</span>`:"")+(g.drop?`<span class="fx down">Units −${g.drop}</span>`:"");
 learn(c.terms);
 F.log.push({q:qLabel(turn()),t:`${ev.title}: ${c.l}`});
 F.pending={result:[typeof c.r==="function"?c.r():c.r,extra].filter(Boolean).join(" "),tip:c.tip,chips,lab:c.lab||null,terms:c.terms||[]};
 render();const st=document.getElementById("stage");if(st)st.scrollIntoView({behavior:"smooth",block:"start"});
}

  if(T.extra){const lost=Math.round(g*0.6);g-=lost;notes.push(["Cal Grant and some UC grant years used up",-lost*3]);}
  const prev=F.aid;F.mg={lim,g,notes,sub:prev?Math.min(lim[1],Math.round(prev.subQ*3)):Math.min(lim[1],3500),unsub:prev?Math.min(lim[0]-lim[1],Math.round(prev.unsubQ*3)):0};}
 const m=F.mg,H=HOUSE[F.housing],sub=m.sub,uns=m.unsub;
 const billQ=TUITION_Q+H.billQ,credQ=m.g+C.famQ+(sub+uns)/3*(1-ORIG_FEE),netQ=credQ-billQ;

 const yrsLeft=F.turns.filter(x=>x.ac&&x.ay>T.ay).length/3;
 const projDebt=fedDebt()+(sub+uns)*(1+yrsLeft)+uns*LOAN_RATE*(yrsLeft+1)*1.2;
 const lostTotal=sum(m.notes,n=>n[1]);
 return`<section class="stage fade" id="stage"><div class="banner"><canvas data-loc="office" data-slot="0"></canvas><span class="loc">Financial aid portal</span><span class="day">${yrName(T.lvl)} · ${T.ay}–${String(T.ay+1).slice(2)}</span></div><div class="body">

  ${m.notes.length?`<div class="alert">${m.notes.map(n=>`<b>${n[0]}:</b> ${$s(n[1])} in grants this year.`).join("<br>")}</div>`:""}
  <div class="grid2">
   ${paperT(`${T.ay}–${String(T.ay+1).slice(2)} Financial Aid Offer (sample)`,[
