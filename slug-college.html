<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Slug College · Slugonomics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone-first life journal. Header card (who you are now), stat gauges, a year-by-year diary;
   a fixed dock at the bottom with five sections and the big Age button. UCSC blue and gold, redwood green for good news. */
:root{
  --bg:#EDF2F7; --surface:#FFFFFF; --surface-2:#E1E8F0; --ink:#0B1F33; --muted:#4F6377; --line:#CAD6E2;
  --kelp:#003C6C; --kelp-ink:#FFFFFF; --gold:#FDC700; --gold-ink:#2A2100; --sea:#2A6F9E; --coral:#C9472E; --good:#22804F; --warn:#9A6400;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --dock-h:74px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071624; --surface:#0F2236; --surface-2:#16304A; --ink:#E6EEF7; --muted:#9DB2C7; --line:#24405E;
  --kelp:#8EC1F0; --kelp-ink:#04121F; --gold:#F4C94A; --gold-ink:#221A00; --sea:#72B4E2; --coral:#FF8A70; --good:#6BD69A; --warn:#F2B84B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071624; --surface:#0F2236; --surface-2:#16304A; --ink:#E6EEF7; --muted:#9DB2C7; --line:#24405E;
  --kelp:#8EC1F0; --kelp-ink:#04121F; --gold:#F4C94A; --gold-ink:#221A00; --sea:#72B4E2; --coral:#FF8A70; --good:#6BD69A; --warn:#F2B84B; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--dock-h) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.good{color:var(--good)}.bad{color:var(--coral)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}

.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--kelp);color:var(--kelp-ink);font-weight:800;padding:12px 20px;border-radius:14px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.row:focus-visible,.chip:focus-visible,.dock button:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header card */
.who{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ava{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:var(--gold-ink);background:var(--gold);position:relative}
.ava small{position:absolute;bottom:-6px;right:-6px;background:var(--kelp);color:var(--kelp-ink);font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:8px}
.who h1{font-size:22px;line-height:1.1}
.who .sub{font-size:14px;color:var(--muted)}
.cash{text-align:right}
.cash b{display:block;font-family:var(--mono);font-size:18px;font-weight:500}
.cash span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.g{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.g .top{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.g .top b{font-family:var(--mono);font-weight:500}
.bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}

/* diary */
.diary{display:flex;flex-direction:column;gap:10px}
.yr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:52px 1fr;gap:10px}
.yr.now{border-color:var(--kelp);box-shadow:0 0 0 2px color-mix(in srgb,var(--kelp) 25%,transparent)}
.yr .age{font-family:var(--display);font-size:30px;line-height:1;color:var(--kelp)}
.yr .age small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:15px;min-width:0}
.yr li.k-good{color:var(--good)}.yr li.k-bad{color:var(--coral)}.yr li.k-big{font-weight:800}
.more{all:unset;cursor:pointer;color:var(--kelp);font-weight:800;font-size:14px;align-self:center;padding:6px 10px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--display);font-weight:400;font-size:22px}
.panel h3{font-size:16px}
.rows{display:flex;flex-direction:column}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-size:19px}
.row .t{font-weight:700;display:block}
.row .s{font-size:13px;color:var(--muted);display:block}
.row .r{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.row[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;padding:3px 0}
.kv span:last-child{font-family:var(--mono)}
.kv.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:600;background:var(--surface)}
.chip.on{background:var(--kelp);border-color:var(--kelp);color:var(--kelp-ink)}
.chip[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.energy{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.energy i{width:14px;height:14px;border-radius:5px;background:var(--surface-2);border:1.5px solid var(--line)}
.energy i.on{background:var(--gold);border-color:var(--gold)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;border:1.5px solid var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--surface))}
.badge.no{border-color:var(--line);background:transparent;opacity:.5;font-weight:500}
.note{font-size:13px;color:var(--muted)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.dock .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 76px repeat(3,minmax(0,1fr));gap:2px;align-items:end}
.dock button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);padding:6px 2px;border-radius:12px;min-width:0}
.dock button .e{font-size:20px;line-height:1}
.dock button.on{color:var(--kelp);background:var(--surface-2)}
.dock .age{background:var(--gold);color:var(--gold-ink);border-radius:22px;height:70px;margin-top:-26px;justify-content:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);font-size:12px}
.dock .age b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.dock .age[aria-disabled="true"]{opacity:.6}

/* modal sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,14,10,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:22px;width:min(560px,100%);max-height:88vh;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@keyframes up{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1}
.sheet .where{font-family:var(--mono);font-size:12px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);display:flex;justify-content:space-between;gap:10px;align-items:center}
.opt:hover{border-color:var(--kelp)}
.opt .t{font-weight:700}.opt .s{display:block;font-size:13px;color:var(--muted);font-weight:400}
.opt .tag{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--muted)}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}

/* create */
.hero{border-radius:24px;overflow:hidden;position:relative;background:#0E2B22;color:#F3F7F4;min-height:250px;display:flex;align-items:flex-end}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:22px;display:flex;flex-direction:column;gap:8px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,62px);line-height:.95;color:#F7F3E3}
.hero h1 span{color:#F2C230}
.hero p{color:#CFE2D7;max-width:46ch}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.cities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.cities{grid-template-columns:1fr}}
.city{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);min-width:0}
.city.on{border-color:var(--kelp);box-shadow:0 0 0 2px color-mix(in srgb,var(--kelp) 30%,transparent)}
.city b{display:block}.city span{font-size:12.5px;color:var(--muted)}
.city:focus-visible{outline:3px solid var(--gold)}
.credit{font-size:12px;color:var(--muted);text-align:center;margin:14px auto 4px;letter-spacing:.02em}
.credit b{color:var(--ink);font-weight:700}
.credit-about{font-weight:600;color:var(--kelp)}
footer{font-size:12px;color:var(--muted);text-align:center;max-width:60ch;margin:4px auto 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 30px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;max-width:90vw;text-align:center}

/* ===== v2: learning + tabs ===== */
.avbtn{all:unset;cursor:pointer;border-radius:18px}.avbtn:focus-visible{outline:3px solid var(--gold)}
.cash{all:unset;cursor:pointer;text-align:right}
.meter{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.g .top b em{font-style:normal;font-size:11px;margin-left:4px;padding:0 5px;border-radius:6px;animation:pop .5s ease}
.g .top b em.up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}.g .top b em.dn{color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
.lifebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pips{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.pips i{width:16px;height:16px;border-radius:6px;background:var(--surface-2);border:1.5px solid var(--line)}
.pips i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.nb{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line)}
.nb b{font-family:var(--mono);font-weight:500}.nb:focus-visible{outline:3px solid var(--gold)}
.nwline{font-size:14px;color:var(--muted)}
.goals{display:flex;flex-direction:column;gap:6px}
.goal{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--line);font-size:14px;font-weight:600}
.goal.ok{border-style:solid;border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.goal.no{opacity:.6}
.thead{display:flex;gap:12px;align-items:flex-start}
.thead h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.thead p{font-size:14px;color:var(--muted)}
.back{all:unset;cursor:pointer;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-weight:800;flex-shrink:0}
.back:focus-visible{outline:3px solid var(--gold)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph h3{font-size:17px}
.big{font-size:17px;font-weight:700}.big2{font-size:22px}
.hint{font-size:13px;color:var(--muted)}
.warn{color:var(--warn)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.spark{display:block}
.ladder{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--line);margin:4px 0 0 8px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0 6px 14px;position:relative;font-size:14px;color:var(--muted)}
.rung .dot{position:absolute;left:-9px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.rung.past{color:var(--ink)}.rung.past .dot{background:var(--kelp);border-color:var(--kelp)}
.rung.cur{color:var(--ink);font-weight:800}.rung.cur .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.rung .rn{grid-column:1/2}
.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.jobs{grid-template-columns:1fr}}
.job{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.jt{display:flex;flex-direction:column}.jm{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.req{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;border:1.5px solid currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--coral)}
.fxc{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--surface-2);white-space:nowrap}
.fxc b{font-family:var(--mono);font-weight:500}
.fxc.up{color:var(--good);background:color-mix(in srgb,var(--good) 13%,var(--surface))}
.fxc.dn{color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--surface))}
.fxc.cost{color:var(--gold-ink);background:var(--gold)}
.fxc.ok{color:var(--good);background:transparent;border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.fxc.warn{color:var(--warn);background:transparent;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.fxc.lockc{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.sub2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.lock{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.lock:last-child{border-bottom:0}
.nwp .nw{font-family:var(--display);font-size:40px;line-height:1;color:var(--kelp)}
.nwp .nw.bad{color:var(--coral)}
.split{display:flex;height:12px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.blist{display:flex;flex-direction:column}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border-bottom:0}
.share{display:flex;flex-direction:column;gap:4px}
.track{position:relative;height:10px;border-radius:6px;background:var(--surface-2)}
.track i{display:block;height:100%;border-radius:6px}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.6}
.alert{font-size:14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--coral) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--coral) 40%,var(--line))}
.seg .chip small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;opacity:.85}
.chip.on small{opacity:1}
input[type=range]{width:100%;accent-color:var(--kelp)}
.proj{font-size:15px}.proj b{font-family:var(--mono);color:var(--kelp)}
.debt{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.facts{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1.5px solid var(--gold);font-size:14px;font-weight:600}
.pgrid{display:flex;flex-direction:column;gap:10px}
.pc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
@media (max-width:440px){.pc{grid-template-columns:auto minmax(0,1fr)}.pb{grid-column:1/-1}}
.pav{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#14211B}
.pi{display:flex;flex-direction:column;min-width:0}
.pb{display:flex;gap:6px}
.cats{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
.cats .chip{flex-shrink:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
.tile:hover:not([aria-disabled="true"]){transform:translateY(-3px);border-color:var(--kelp);box-shadow:0 10px 22px -16px rgba(0,0,0,.5)}
.tile:active:not([aria-disabled="true"]){transform:scale(.97)}
.tile:focus-visible{outline:3px solid var(--gold)}
.tile[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.tile.locked{background:var(--bg)}
.ti{font-size:30px;line-height:1}
.tn{font-weight:800;font-size:15px;line-height:1.2}

.lbr{border-left:1.5px solid var(--line)}

/* ===== v5: cuter, friendlier skin ===== */
:root{--bg:#EAF3FC;--surface-2:#E3EDF8;--line:#CFDDEC;--pink:#F49AA0;--mint:#BFEBD3;--sky:#CFE6FF;--shadow-soft:0 10px 26px -16px rgba(0,60,108,.38)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pink:#C76D78;--mint:#1F5A43;--sky:#173A5E;--shadow-soft:0 10px 26px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--pink:#C76D78;--mint:#1F5A43;--sky:#173A5E;--shadow-soft:0 10px 26px -14px rgba(0,0,0,.7)}
body{background:radial-gradient(600px 400px at 0% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%),radial-gradient(700px 500px at 100% 30%,color-mix(in srgb,var(--sky) 70%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.panel{border-radius:24px;border:1.5px solid var(--line);box-shadow:var(--shadow-soft);padding:18px;gap:12px}
.panel h2{font-size:24px;color:var(--kelp)}
.panel h3,.rgrp h3{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.01em}
.btn{border-radius:999px;padding:13px 22px;box-shadow:0 4px 0 color-mix(in srgb,var(--kelp) 55%,#000);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--kelp) 55%,#000)}
.btn.gold{box-shadow:0 4px 0 #C99A00}.btn.gold:active{box-shadow:0 1px 0 #C99A00}
.btn.ghost{box-shadow:none;background:var(--surface)}.btn.ghost:active{transform:scale(.97)}
.btn.sm{border-radius:999px}
.btn.big{width:100%;font-size:18px;padding:16px 22px;font-family:var(--display);font-weight:400;letter-spacing:.02em}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.mode:focus-visible,.city:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chip{padding:9px 15px;font-weight:700;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{box-shadow:0 3px 0 color-mix(in srgb,var(--kelp) 55%,#000)}
.opt{border-radius:18px;background:var(--surface);transition:transform .12s,border-color .12s}
.opt:hover{border-color:var(--kelp);transform:translateY(-1px)}
.city{border-radius:18px;background:var(--surface)}
.city.on{background:color-mix(in srgb,var(--sky) 60%,var(--surface))}
.sheet{border-radius:28px;padding:22px;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.dock{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1.5px solid var(--line);border-radius:26px;box-shadow:0 14px 34px -14px rgba(0,30,60,.45);padding:8px 8px 6px}
.dock button{border-radius:16px;transition:transform .12s}
.dock button.on{background:color-mix(in srgb,var(--gold) 26%,var(--surface));color:var(--ink)}
.dock button.on .e{transform:scale(1.15)}
.dock .age{border-radius:50%;width:72px;height:72px;margin:-30px auto 0;border:4px solid var(--surface);box-shadow:0 5px 0 #C99A00,0 12px 24px -10px rgba(0,0,0,.45)}
.dock .age:active{transform:translateY(3px)}
.hero{border-radius:28px}
.hero .slug{position:absolute;right:14px;top:-62px;width:96px;height:64px;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.hero .in{position:relative}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.how>div{border-radius:20px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:20px;border:2px solid var(--line);background:var(--surface);min-width:0;transition:transform .12s}
.mode:active{transform:scale(.98)}
.mode .mi{font-size:28px;line-height:1}.mode b{font-size:16px}.mode small{font-size:13px;color:var(--muted);line-height:1.35}
.mode.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface));box-shadow:0 4px 0 #C99A00}
@media (max-width:420px){.modes{grid-template-columns:1fr}}
.rgrp{background:color-mix(in srgb,var(--sky) 35%,var(--surface));border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rgrp .rbf{border-bottom-color:color-mix(in srgb,var(--line) 70%,transparent)}
.rgrp select{font:inherit;font-size:16px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.rsum{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1.5px solid var(--gold)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:10px 12px}
.fc{font-size:15px;line-height:1.45;padding:10px 12px;border-radius:14px;background:var(--surface);margin-top:6px}
.fc.good{color:var(--ink);border-left:5px solid var(--good)}.fc.bad{color:var(--ink);border-left:5px solid var(--coral)}
.rbin input,.field input,.svq textarea{border-radius:14px}
.credit{opacity:.9}
.dock:empty{display:none}
@media (prefers-reduced-motion:reduce){.hero .slug{animation:none}.sheet{animation:none}.btn,.chip,.opt,.mode,.dock button{transition:none}}
/* ===== Slug College additions ===== */
.prog{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow-soft)}
.prog .pt{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.prog .pt b{color:var(--ink)}
.ticks{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:2px}
.ticks i{height:8px;border-radius:3px;background:var(--surface-2)}
.ticks i.done{background:var(--kelp)}.ticks i.cur{background:var(--gold)}.ticks i.sum{opacity:.55}
.ticks i.ny{margin-left:3px}
.gauges.g5{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gauges.g5 .g{padding:9px 10px}
.gauges.g5 .gs{display:none}
@media (max-width:780px){.gauges.g5 .gl{display:none}.gauges.g5 .gs{display:inline}}
@media (max-width:620px){
 .gauges.g5{gap:5px}
 .gauges.g5 .ge{display:none}
 .gauges.g5 .g{padding:7px 6px 8px;border-left-width:3px;text-align:center}
 .gauges.g5 .top{flex-direction:column;align-items:center;gap:1px;font-size:11px}
 .gauges.g5 .top b{font-size:15px;order:-1}
 .gauges.g5 .gl{display:none}.gauges.g5 .gs{display:inline}
 .gauges.g5 .meter{height:6px;margin-top:4px}
 .gauges.g5 .lowtxt{font-size:9.5px;letter-spacing:.04em}
}
.stressl{font-size:13px;font-weight:700;color:var(--muted)}
.stressl b{font-family:var(--mono);font-weight:500}
.yr .age.mo{font-size:28px}
.gpaq{display:flex;flex-wrap:wrap;gap:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.headline{font-size:18px;font-weight:700;line-height:1.45}
.turn{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.turn b{font-size:15px}.turn span{font-size:14px;color:var(--muted)}
.prev{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
/* back to the Slugonomics site */
.sitebar{max-width:640px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:700}
.sitebar a{color:var(--kelp);text-decoration:none}
.sitebar a:hover{text-decoration:underline}

<script>
/* ======================= SLUG COLLEGE: EVENTS & CONTENT =======================
   Plain data. Each month (0-47) has one main event. Phase 1: most are previews
   (title only, generic choices); the summer plan and major choice are real.
   Month index: 0 = September of year 1 ... 47 = August of year 4. */

const MAP=[
 /* Year 1 */
 "MOVEIN","RUSH","MIDTERM","WINTERBREAK",
 "CLUBFAIR","TAXES","SCHOLARSHIPS","HOUSING",
 "CARDTABLE","SUMMER","JULY","FURNISH",
 /* Year 2 */
 "LEASE","CALFRESH","MAJOR","SICK",
 "RA","MAJORCLUB","SPRINGBREAK","INTERN1",
 "HOUSING2","SUMMER","SHIFT2","BREAKDOWN",
 /* Year 3 */
 "OVERLOAD","APPLY3","RESEARCH","INTERVIEW3",
 "PRESIDENT","OFFERS3","ROOMMATE","ACCIDENT",
 "CONCERT","SUMMER","IMPRESS","RETURNOFFER",
 /* Year 4 */
 "PATH","FAIR","CAPSTONE","INTERVIEW4",
 "DATING","JOBOFFER","CREDITCHECK","POSTGRAD",
 "CAPGOWN","COMMENCEMENT","MOVING","GRACE"
];

/* Preview events: same shape as real ones, generic choices with small effects. */
function previewEvent(m){
 const t=MAP[m];
 return{title:t,where:"Preview event",preview:true,
  text:"This is a placeholder. The full story for this month, with its own choices, arrives in the next build.",
  choices:[
   {l:"Lean in",s:"More fun, more stress",go(){fx({happy:4,social:2,stress:4});return`You threw yourself into it: ${t.toLowerCase()}.`;}},
   {l:"Play it safe",s:"Calmer month",go(){fx({stress:-3});return`You kept things low-key this month.`;}}
  ]};
}

/* Year 1 helpers */
const LOCAL=["santacruz"];
const TRAVEL={santacruz:0,bay:40,la:180,sandiego:220,outofstate:450}; // round trip home, estimates
const GREEK_DUES=400;   // per quarter, estimate; dues vary by chapter
const roomie=()=>people("roommate")[0];
const greekWord=()=>C.gender==="woman"?"sorority":C.gender==="man"?"fraternity":"fraternity or sorority";

/* Real events */
const EV={
 /* ---------- Year 1 ---------- */
 movein:()=>{const r=roomie();
  if(!r)return{title:"First week of classes",where:"UC Santa Cruz · fall quarter",text:"Classes start this week. You're figuring out the buses, the hills and where everything is.",
   choices:[
    {l:"Go to your college's welcome events",s:"Meet people early",go(){fx({social:5,happy:3});return meetFriend("at a welcome event");}},
    {l:"Get your schedule and study spots figured out",s:"A calm, organized start",go(){C.effort+=1;fx({stress:-4});return"You mapped out your classes and found a quiet study spot.";}}]};
  return{title:"Move-in day",where:`${C.college} College · residence hall`,
   text:`You haul your stuff up the stairs and meet your roommate, ${r.name}. The room is small, there are two of you, and you'll share it until June.`,
   choices:[
    {l:"Set ground rules together",s:"Sleep, guests, cleaning, shared stuff",go(){r.bond=clamp(r.bond+12);fx({stress:-4});return{t:`You and ${r.name} talked through sleep schedules, guests and cleaning on day one.`,why:"Agreeing on rules early prevents most roommate fights. It works the same way with a lease later."};}},
    {l:"Decorate together",s:"A Target run for the room",tag:"−$120",go(){C.cash-=120;C.spent.other+=120;r.bond=clamp(r.bond+8);fx({happy:5});return`You and ${r.name} spent $120 on lights, a rug and posters. The room feels like home.`;}},
    {l:"Wait and see how it goes",s:"Keep things casual",go(){C.flags.noRules=true;return{t:`You unpacked and figured you'd sort things out with ${r.name} as you go.`,why:"Skipping the talk is easy now and harder later, when something already bothers you."};}}]};},
 rush:()=>{const r=roomie(),w=greekWord();return{title:`Rushing a ${w}`,where:"Fall rush week",
   text:`${r?r.name+" is":"Your floor is"} going to rush events all week and wants you to come. Members say it's the fastest way to make friends. Dues run about ${$(GREEK_DUES)} a quarter, plus a new member fee.`,
   choices:[
    {l:`Rush and join`,s:`About ${$(GREEK_DUES)} a quarter, plus $150 now`,tag:"−$150",go(){C.greek=true;C.cash-=150;C.spent.fun+=150;fx({social:10,happy:5,stress:3});if(r)r.bond=clamp(r.bond+8);teach("dues");return{t:`You joined a ${w}. The new member fee was $150, and dues of about ${$(GREEK_DUES)} come due every quarter.`,why:"Memberships are recurring costs. They feel small at sign-up, but $400 a quarter is $4,800 over four years."};}},
    {l:"Go to a few events, don't join",s:"Free food, no commitment",go(){fx({social:4,happy:2});return"You went to a few rush events for the free food and the people, but didn't join.";}},
    {l:"Not for you",s:"Find your people another way",go(){if(r)r.bond=clamp(r.bond-3);return"You skipped rush.";}}]};},
 winterbreak:()=>{const cost=TRAVEL[C.city]||0,job=C.fin.hours>0,place=cityName(C.city);
  return{title:"Finals are over. Now what?",where:"Winter break · three weeks",
   text:`Fall quarter is done. ${cost?`Getting home to ${place} and back costs about ${$(cost)}.`:`Home in ${place} is close by.`} Campus housing stays open, but the dining halls are on limited hours.`,
   choices:[
    {l:"Go home for break",s:cost?`About ${$(cost)} round trip`:"Free",tag:cost?"−"+$(cost):"",go(){C.cash-=cost;C.spent.other+=cost;people(["mother","father"]).forEach(p=>p.bond=clamp(p.bond+10));fx({happy:7,stress:-12});return`You spent winter break at home in ${place}.`;}},
    ...(job?[{l:"Stay and pick up extra shifts",s:"About 25 extra hours",go(){const pay=Math.round(C.fin.wage*25*(1-TAX));C.cash+=pay;C.spent.earned+=pay;fx({happy:-3,stress:2});return{t:`You stayed in Santa Cruz over break and earned ${$(pay)} in extra shifts.`,why:"Breaks are when students can work more without hurting their grades."};}}]:[]),
    {l:"Stay in Santa Cruz and rest",s:"Quiet, cheap, a little lonely",go(){fx({stress:-8,happy:-2});return"You stayed in Santa Cruz and slept a lot. The campus was very quiet.";}}]};},
 clubfair:()=>{const mc=C.major?MAJOR_CLUB[C.major]:null;return{title:"Winter club fair",where:"Quarry Plaza",
   text:"Dozens of tables line Quarry Plaza. Everyone's handing out flyers and sign-up sheets.",
   choices:[
    {l:mc?`Join the ${mc}`:"Join an academic club",s:"Builds your résumé for internships later",go(){C.flags.clubMajor=true;C.flags.club=(C.flags.club||0)+1;fx({social:3,stress:2});return{t:`You joined the ${mc||"pre-professional club for your interests"}.`,why:"Clubs related to your major help most with internships. Employers look for them."};}},
    {l:"Join a cultural or community org",s:"Find your people",go(){C.flags.clubCommunity=true;fx({social:6,happy:6,stress:-3});return meetFriend("at your new org's first meeting");}},
    {l:"Sign up for intramural sports",s:"$40 team fee",tag:"−$40",go(){C.cash-=40;C.spent.fun+=40;C.flags.intramural=true;fx({health:6,social:4,happy:3});return"You joined an intramural team at the East Field House.";}},
    {l:"Sign up for five things, go to none",s:"Very common",go(){return{t:"You put your email on five sign-up sheets and never went to a meeting.",why:"Getting involved takes showing up. One club you actually attend beats five you don't."};}}]};},
 taxes:()=>{const earned=C.spent.earned,withheld=Math.round(earned/(1-TAX)*TAX);
  if(earned<50)return{title:"Your first tax season",where:"Mail from UCSC",
   text:"You didn't have a job last year, so you have no W-2. But UCSC sent you a 1098-T form showing your tuition. Your parents may be able to claim an education tax credit with it.",
   choices:[
    {l:"Send the 1098-T to your family",s:"Takes five minutes",go(){people(["mother","father"]).forEach(p=>p.bond=clamp(p.bond+4));teach("taxes");if(C.wealth!=="low"){C.cash+=200;return{t:"You sent your family the 1098-T. They got an education tax credit and sent you $200 of it.",k:"k-good",why:"The 1098-T shows what you paid for tuition. Families can use it for the American Opportunity Tax Credit, worth up to $2,500 a year."};}return{t:"You sent your family the 1098-T for their taxes.",why:"The 1098-T shows what you paid for tuition. Families can use it for education tax credits."};}},
    {l:"Ignore the form",s:"It's probably not important",go(){teach("taxes");return{t:"You left the 1098-T in your inbox.",why:"Tax forms from school can be worth real money to your family. It's worth five minutes."};}}]};
  return{title:"Your first tax return",where:"W-2 from your job",
   text:`Your job sent you a W-2. About ${$(withheld)} in taxes was taken out of your paychecks last year. Students who earn this little usually get most of that back, but only if they file.`,
   choices:[
    {l:"File free with student volunteers",s:"UCSC's SlugCents runs free tax help each spring",go(){const r=Math.round(withheld*0.9);C.cash+=r;C.spent.earned+=r;teach("taxes");return{t:`Volunteers helped you file for free. Your refund was ${$(r)}.`,k:"k-good",why:"Free tax help exists for students. Most students with small incomes get back nearly everything that was withheld."};}},
    {l:"Pay a tax service",s:"Fast and easy",tag:"−$120",go(){const r=Math.round(withheld*0.9);C.cash+=r-120;teach("taxes");return{t:`You paid $120 to file and got a ${$(r)} refund. Free help would have saved you the $120.`,why:"Paid tax prep makes sense for complicated returns, not for a student with one W-2."};}},
    {l:"Don't file",s:"You barely earned anything",go(){teach("taxes");return{t:"You didn't file a tax return.",k:"k-bad",why:`You left about ${$(Math.round(withheld*0.9))} on the table. Filing is how you get withheld taxes back.`};}}]};},
 scholarships:()=>{const g=cumGpa()||3,odds=clamp(0.25+(g-3)*0.3,0.1,0.6);return{title:"Scholarship season",where:"UCSC Scholarship portal",
   text:`Applications for next year's scholarships are due this month. Each one takes an essay. You also got an email from a website promising a "guaranteed" scholarship for a $25 processing fee.`,
   choices:[
    {l:"Spend two weekends applying to several",s:`Essays and stress · about a ${Math.round(odds*100)}% chance of winning something`,go(){fx({stress:6});C.effort-=0.5;teach("scholarships");if(pr(odds)){const amt=pick([1000,1500,2000,2500]);C.flags.schol=amt;return{t:`You won a ${$(amt)} scholarship for next year!`,k:"k-good",why:"Scholarships are free money for school. Fewer students apply than you'd think, so the odds are better than they look."};}return{t:"You applied to four scholarships and didn't win any this year.",why:"Most applicants don't win every time. Essays you write now can be reused next year."};}},
    {l:"Pay the $25 for the guaranteed scholarship",s:"Easy money?",tag:"−$25",go(){C.cash-=25;C.spent.other+=25;fx({happy:-3});teach("scholarships");return{t:"The guaranteed scholarship site stopped answering emails after you paid. It was a scam.",k:"k-bad",why:"Real scholarships never charge a fee. 'Guaranteed' and 'processing fee' are the giveaways."};}},
    {l:"Skip it this year",s:"Too busy",go(){teach("scholarships");return"You skipped scholarship applications this year.";}}]};},
 housing:()=>{const cs=creditScore(),weak=!cs||cs<640,local=LOCAL.includes(C.city);return{title:"Where will you live next year?",where:"Housing portal · spring",
   text:`Housing applications for next year are open. Campus housing is tight and assigned by lottery. A Westside house shares rooms for about $1,350 a month on a 12-month lease, and landlords will run your credit${weak?". With "+(cs?"a "+cs+" score":"no credit history")+", you may need a co-signer or a bigger deposit":""}.`,
   choices:[
    {l:"Enter the campus housing lottery",s:"About $2,440 a month for 9 months, meals included",go(){teach("rent30");if(pr(0.6)){C.nextHome={home:"campus",rent:Math.round(UCSC_HOUSING/9)};return"You got campus housing for next year.";}C.nextHome={home:"shared",rent:1350,dep:weak?2:1};return{t:"You didn't get campus housing. You'll share a room on the Westside instead.",k:"k-bad",why:"Campus housing runs out every year. Off-campus leases usually run 12 months, so you pay rent in summer too."};}},
    {l:"Sign a Westside lease with friends",s:`$1,350 a month, 12 months${weak?" · co-signer or double deposit":""}`,go(){C.nextHome={home:"shared",rent:1350,dep:weak?2:1};fx({happy:4,social:3});teach("rent30");if(weak)teach("credit");return{t:`You signed a lease for a shared room on the Westside starting in September.${weak?" With little credit history, the landlord asked for a double deposit.":""}`,why:"12 months of rent is more than campus's 9, but there's no meal plan. Landlords check credit, which is why building it early matters."};}},
    ...(local?[{l:"Live at home and commute",s:"No rent, but a daily commute",go(){C.nextHome={home:"family",rent:0,commute:true};fx({social:-4});return{t:"You decided to live with your family next year and commute.",why:"Living at home is the biggest money saver most students have. The cost is time and campus social life."};}}]:[])
   ]};},
 july:()=>{
  if(C.summer==="work"||C.summer==="keep")return{title:"A slammed Saturday shift",where:"Summer job",
   text:"Your manager is short-staffed for the Fourth of July weekend and asks if you can work double shifts all weekend.",
   choices:[
    {l:"Work the doubles",s:"About 16 extra hours",go(){const pay=Math.round(Math.max(C.fin.wage,18.5)*16*(1-TAX)+120);C.cash+=pay;C.spent.earned+=pay;fx({stress:6,health:-2});return{t:`You worked doubles all weekend and made ${$(pay)} with tips.`,why:"Saying yes to extra shifts builds savings and earns trust with your manager, which helps when you need a reference."};}},
    {l:"Say you already have plans",s:"Fourth of July at the beach",go(){fx({happy:6,social:3});return"You turned down the extra shifts and spent the Fourth at the beach with friends.";}}]};
  return{title:"Old friends want to take a trip",where:"Group chat",
   text:"Your friends from high school are planning a weekend trip. Your share would be about $250 for gas, food and a cabin.",
   choices:[
    {l:"Go on the trip",s:"About $250",tag:"−$250",go(){C.cash-=250;C.spent.fun+=250;fx({happy:10,social:5,stress:-6});return"You went on the trip with your old friends. Worth it.";}},
    {l:"Pick up a short summer gig instead",s:"Babysitting, yard work or deliveries",go(){C.cash+=450;C.spent.earned+=450;fx({happy:-2});return{t:"You skipped the trip and made $450 on odd jobs.",why:"Even a few weeks of work over summer cushions fall, when aid has to stretch until December."};}},
    {l:"Skip it and rest",s:"Save money",go(){fx({stress:-4,happy:-3});return"You skipped the trip and stayed home.";}}]};},
 furnish:()=>{const off=C.nextHome&&C.nextHome.home==="shared";
  const item=off?"furnish your room: a bed, desk and kitchen stuff":"replace your dying laptop before classes start";
  const newCost=off?1200:1100,used=off?350:500;
  return{title:off?"Furnishing your first apartment":"Your laptop is dying",where:off?"Moving prep · August":"Back to school · August",
   text:`You need to ${item}. Buying new costs about ${$(newCost)}. ${off?"Used furniture from Marketplace or graduating students":"A refurbished one"} costs about ${$(used)}. The store also offers "4 easy payments" with buy now, pay later.`,
   choices:[
    {l:"Buy new and pay now",s:`${$(newCost)}`,ok:()=>C.cash>=newCost,tag:"−"+$(newCost),go(){C.cash-=newCost;C.spent.other+=newCost;fx({happy:5});return`You bought everything new for ${$(newCost)}.`;}},
    {l:off?"Buy used":"Buy refurbished",s:`About ${$(used)}`,ok:()=>C.cash>=used,tag:"−"+$(used),go(){C.cash-=used;C.spent.other+=used;fx({happy:2});return{t:`You spent ${$(used)} on ${off?"used furniture":"a refurbished laptop"}.`,k:"k-good",why:"Buying used is one of the easiest ways to save on big purchases."};}},
    {l:"Buy new with 4 payments",s:`4 payments of ${$(newCost/4)}, one a month`,go(){C.bnpl.push({amt:Math.round(newCost/4),left:4,what:off?"furniture":"laptop"});fx({happy:5});teach("bnpl");return{t:`You bought it new with buy now, pay later: 4 payments of ${$(newCost/4)}.`,why:"Buy now, pay later feels free, but it's still debt. Miss a payment and you pay late fees, and several plans at once add up fast."};}}]};},

 sar7:()=>({title:"Your CalFresh report is due",where:"Mail from the county · SAR 7",recurring:true,
   text:"Every six months you have to send the county a SAR 7 report about your income and household. If it's not turned in, your CalFresh benefits stop.",
   choices:[
    {l:"Fill it out and send it in",s:"About 15 minutes",go(){const cf=calfreshCalc();if(!cf.ok){C.calfresh=0;return{t:"You sent in your SAR 7. Your income changed, so you no longer qualify for CalFresh.",why:cf.why};}const old=C.calfresh;C.calfresh=cf.benefit;return{t:`You sent in your SAR 7. Your CalFresh continues at ${$(cf.benefit)} a month${cf.benefit!==old?` (was ${$(old)})`:""}.`,k:"k-good",why:"Reporting on time keeps your benefits coming. Benefits are recalculated from what you report."};}},
    {l:"Deal with it later",s:"It can wait",go(){if(pr(0.55)){C.calfresh=0;return{t:"You missed the SAR 7 deadline and your CalFresh stopped. You'll have to reapply.",k:"k-bad",why:"Missed paperwork is one of the most common reasons students lose benefits they still qualify for."};}return"You turned in your SAR 7 on the last day.";}}
   ]}),
 statement:()=>{const bal=Math.round(C.debt.card),mn=minPay(),half=Math.round(bal/2),po=payoff(bal,mn);
  return{title:"Your credit card statement",where:"Card app · payment due",recurring:true,
   text:`You owe ${$(bal)} at about 25% APR${C.lastInterest>1?`, including ${$(C.lastInterest)} in interest added this month`:""}. The minimum payment is ${$(mn)}.${loanRoom()>=250?` A student loan at ${(LOAN_RATE*100).toFixed(2)}% costs far less than this card, and you have ${$(loanRoom())} of room left this year (Money tab).`:""} Paying only the minimum, it would take ${po.months>=600?"decades":po.months+" months"} to pay off and cost about ${$(po.interest)} in interest.`,
   choices:[
    {l:"Pay in full",s:`${$(bal)} · no more interest`,ok:()=>C.cash>=bal,tag:"−"+$(bal),go(){C.cash-=bal;C.debt.card=0;onTimePay();return{t:`You paid your card balance in full: ${$(bal)}.`,k:"k-good",why:"Paying the full statement balance means no interest, and on-time payments build your credit score."};}},
    ...(half>mn?[{l:"Pay half",s:`${$(half)}`,ok:()=>C.cash>=half,tag:"−"+$(half),go(){C.cash-=half;C.debt.card-=half;onTimePay();return{t:`You paid ${$(half)} toward your card.`,why:"Paying more than the minimum shrinks the balance faster. Whatever's left keeps growing at about 2% a month."};}}]:[]),
    {l:"Pay the minimum",s:`${$(mn)}`,ok:()=>C.cash>=mn,tag:"−"+$(mn),go(){C.cash-=mn;C.debt.card-=mn;onTimePay();return{t:`You paid the ${$(mn)} minimum on your card.`,why:"The minimum keeps your credit safe but barely touches the balance. Most of it goes to interest."};}},
    {l:"Skip this month",s:"$30 late fee and a hit to your credit",go(){C.debt.card+=30;C.credit.late+=1;C.spent.interest+=30;fx({stress:4,happy:-2});teach("credit");return{t:"You missed your card payment. A $30 late fee was added and it was reported to the credit bureaus.",k:"k-bad",why:"Payment history is the biggest part of your credit score. A missed payment can stay on your report for years."};}}
   ]};},
 fafsa:()=>({title:"Renew your financial aid",where:"Email from UCSC Financial Aid · October",recurring:true,
   text:"The FAFSA (or California Dream Act application) for next year is open. You have to file it again every year. Miss the priority deadline and you can lose state grant money.",
   choices:[
    {l:"File it this week",s:"About an hour of forms",go(){fx({stress:1});teach("fafsa");return"You renewed your FAFSA for next year well before the deadline.";}},
    {l:"Do it later",s:"There's time, right?",go(){teach("fafsa");if(pr(0.45)){C.flags.fafsaMiss=true;return{t:"You kept putting it off and filed after the priority deadline. Next year's grants will be smaller.",k:"k-bad",why:"State grants like Cal Grant are awarded by deadline. Filing late can cost thousands."};}return"You filed a week before the deadline. Close call.";}}
   ]}),
 midterm:()=>({title:"Your first midterm goes badly",where:`${C.major?MAJORS[C.major].n:"Intro"} class · week 6`,
   text:"You got a D on your first college midterm. Your financial aid depends on grades: you need a 2.0 GPA or better and to pass at least 12 credits a quarter to keep it.",
   choices:[

 dating:()=>{const g=C.gender==="woman"?pick(["man","woman","man"]):C.gender==="man"?pick(["woman","man","woman"]):pick(["woman","man"]),n=pick(NAMES[g]);

    {l:"Negotiate politely",s:"Ask for about 7% more",go(){k.accepted=true;teach("negotiate");if(pr(0.8)){const n=Math.round(s*1.07/1000)*1000;k.offer.salary=n;return{t:`You asked for more and they agreed: ${$(n)} a year.`,k:"k-good k-big",why:"Most employers expect negotiation. A polite, specific ask rarely loses an offer."};}return{t:`They said ${$(s)} was firm. You accepted it.`,why:"Sometimes the answer is no. Asking politely almost never costs you the offer."};}}]};},
 creditcheck:()=>{const cs=creditScore();return{title:"Check your credit before apartment hunting",where:"Free credit report",text:`You'll be renting after graduation, and landlords will check your credit.${cs?` Your score is ${cs} (${creditBand(cs)}).`:" You don't have a credit score yet."}${C.debt.card>0?` You owe ${$(C.debt.card)} on your card.`:""}`,

    {l:"Skip it",s:"",go(){return"You didn't check your credit.";}}]};},
 postgrad:()=>{const partner=people("partner")[0];return{title:"Where will you live after graduation?",where:"Spring · senior year",text:`Your lease or campus housing ends after graduation.${C.career.accepted?` Your new job at ${C.career.offer.co} starts in July.`:""}`,
   choices:[...(partner?[{l:`Move in with ${partner.name}`,s:"Split a 1-bedroom, about $1,250 each",go(){C.postHome={home:"shared",rent:1250};return`You and ${partner.name} decided to move in together after graduation.`;}}]:[]),
    {l:"Get a place with friends",s:"About $1,350 each",go(){C.postHome={home:"shared",rent:1350};fx({social:3});return"You and friends found a place for after graduation.";}},
    {l:"Move back home for a while",s:"No rent, save money",go(){C.postHome={home:"family",rent:0};return{t:"You decided to move back home after graduation.",why:"Living at home for a year after college is one of the fastest ways to pay down loans."};}}]};},
 capgown:()=>({title:"Cap, gown and grad photos",where:"Bay Tree Bookstore",text:"Cap and gown rental is about $70. A grad photo session is about $150.",
   choices:[{l:"Cap, gown and photos",s:"$220",tag:"−$220",go(){C.cash-=220;C.spent.other+=220;fx({happy:5});return"You got your cap, gown and grad photos.";}},{l:"Just the cap and gown",s:"$70",tag:"−$70",go(){C.cash-=70;C.spent.other+=70;fx({happy:2});return"You got your cap and gown. A friend took your photos.";}}]}),

 moving:()=>{const k=C.career,job=k.accepted&&k.offer;
  if(!job)return{title:"Life after graduation",where:"July",text:"You're done with school. Rent is still due, and loan payments start in six months.",choices:[{l:"Pick up more hours",s:"",go(){C.fin.hours=Math.max(C.fin.hours,30);C.fin.wage=Math.max(C.fin.wage,18.5);return"You picked up more hours while you look for a full-time job.";}},{l:"Take a break first",s:"",go(){fx({stress:-10,happy:4});return"You took a few weeks off after graduating.";}}]};

    {l:"Ask about a signing bonus",s:"Some employers offer one",go(){C.career.started=true;if(pr(0.35)){C.cash+=2000;return{t:"They gave you a $2,000 signing bonus to cover your move.",k:"k-good"};}C.cash-=reloc?0:1500;return"No signing bonus, but it was worth asking.";}}]};},
 grace:()=>{const pay=pmt(C.debt.stu,LOAN_RATE/12,120);return{title:"Your loan grace period has started",where:"Email from your loan servicer",text:C.debt.stu>1?`You owe ${$(C.debt.stu)} in student loans. Payments of about ${$(pay)} a month start in about six months.`:"You graduated without student loans. Your loan servicer has nothing to say to you.",
   choices:C.debt.stu>1?[{l:"Set up autopay and budget for it now",s:"Many servicers lower your rate a little for autopay",go(){teach("grace");C.flags.loanPlan="autopay";return{t:"You set up autopay and built your loan payment into your budget.",k:"k-good",why:"Planning before the first bill is the easiest way to never miss a payment."};}},
    {l:"Start paying extra early",s:"Pay down interest during the grace period",go(){teach("grace");const a=Math.min(500,Math.max(0,C.cash-500));C.cash-=a;C.debt.stu-=a;C.flags.loanPlan="extra";return{t:`You paid ${$(a)} toward your loans during the grace period.`,k:"k-good",why:"Paying during the grace period chips away at interest before it's added to your balance."};}},
    {l:"Deal with it when the bill comes",s:"",go(){teach("grace");C.flags.loanPlan="later";return{t:"You decided to deal with loans when the first bill arrives.",why:"Missing payments hurts your credit and adds fees. Budgeting for them now is much easier."};}}]
   :[{l:"Celebrate",s:"",go(){teach("grace");fx({happy:5});return"You graduated debt-free from student loans.";}}]};}
});

<script>
/* ======================= SLUG COLLEGE: MORE EVENTS (replay variety) =======================
   Two kinds of variety, both picked at random each run:
   1. ALTS: some months swap their usual event for a different one that fits the same time of year.
   2. WILD: on many months a second, smaller Santa Cruz situation shows up. Each one happens at most once a run.
   Money figures are rounded estimates for Santa Cruz in 2026. */

LESSONS.scams={ic:"🎣",t:"Spotting scams",c:"Scams aimed at students copy real things: aid refunds, campus jobs, apartment listings. The tells are urgency, a link or payment app instead of the official site, and anyone sending you money and asking for some back.",tip:"Go to the official site or office yourself. Never pay a deposit for a place you haven't seen, and never send back part of a check."};

const ALTS={
 RUSH:["BIKETHEFT"],WINTERBREAK:["GIFTS"],CLUBFAIR:["TEXTBOOKS"],SCHOLARSHIPS:["GIGWORK"],CARDTABLE:["STORECARD"],
 SICK:["STORM"],SPRINGBREAK:["AQUARIUM"],BREAKDOWN:["RENTALSCAM"],ROOMMATE:["RENTHIKE"],ACCIDENT:["LAPTOPSTOLEN"],
 CONCERT:["CATALYST"],DATING:["FRIENDLOAN","COSIGN"],JULY:["REDWOODS"],MAJORCLUB:["SLUGCENTS"]
};
const ALT_P=0.5,WILD_P=0.3;
function pickMain(m){
 C.alts=C.alts||{};
 if(C.alts[m]==null){const k=MAP[m],a=ALTS[k];C.alts[m]=a&&pr(ALT_P)?pick(a):k;}
 return C.alts[m];
}
const offCampus=()=>C.home==="shared"||C.home==="own";
const hasCar=()=>C.fin.transit>=100;
const gig=(amt,what)=>{C.cash+=amt;C.spent.earned+=amt;return amt;};

Object.assign(EV,{
 /* ---------- alternates ---------- */
 biketheft:()=>({title:"Your bike is gone",where:`${C.college} College · bike rack`,
  text:"You come out of class and your bike is gone. The cable lock was cut. Bike theft is one of the most common crimes on campus.",
  choices:[
   {l:"Buy a used bike and a real U-lock",s:"About $180 for the bike, $50 for the lock",tag:"−$230",go(){C.cash-=230;C.spent.other+=230;teach("emergency");fx({stress:3});return{t:"You found a used bike on Marketplace and bought a heavy U-lock.",why:"A $50 lock protects a $180 bike. Cheap cable locks take seconds to cut."};}},
   {l:"Ride the Metro instead",s:"Free with your student ID",go(){fx({stress:2,health:-1});return{t:"You started taking the bus up the hill. Your student fees already pay for it.",why:"UCSC students ride Santa Cruz Metro free with their ID. Use what your fees already cover before buying something new."};}},
   {l:"Get an e-bike on buy now, pay later",s:"4 payments of $350",go(){C.bnpl.push({amt:350,left:4,what:"e-bike"});fx({happy:6});teach("bnpl");return{t:"You ordered an e-bike for $1,400 in four payments. The hill is easy now.",why:"Four payments of $350 is still $1,400 of debt, and it lands on top of rent and food for four months."};}}]}),
 gifts:()=>({title:"Holiday gifts",where:"December · downtown Santa Cruz",
  text:"Finals are done and you want to get gifts for your family and friends. Pacific Avenue is lit up and every store has a sale.",
  choices:[
   {l:"Set a $100 limit and stick to it",s:"Pay cash",tag:"−$100",go(){C.cash-=100;C.spent.fun+=100;people(["mother","father"]).forEach(p=>p.bond=clamp(p.bond+4));fx({happy:3});return{t:"You spent $100 on gifts and stayed on budget.",why:"Deciding the number before you shop is what keeps holiday spending from following you into January."};}},
   {l:"Get everyone something nice on a card",s:"About $400 at 25% APR",tag:"+$400 card",go(){C.debt.card+=400;C.card=true;C.spent.fun+=400;people(["mother","father"]).forEach(p=>p.bond=clamp(p.bond+6));fx({happy:5});teach("apr");return{t:"You put $400 of gifts on a credit card.",why:"Winter quarter aid has to cover rent and food first. Gifts on a card often get paid off slowly, with interest."};}},
   {l:"Make gifts and write cards",s:"About $20 in supplies",tag:"−$20",go(){C.cash-=20;C.spent.fun+=20;people(["mother","father"]).forEach(p=>p.bond=clamp(p.bond+6));fx({happy:4,stress:-2});return"You baked, wrote cards and framed photos. Your family loved them.";}}]}),
 textbooks:()=>({title:"Winter quarter textbooks",where:"Bay Tree Bookstore",
  text:"Your syllabi list about $260 in new textbooks and access codes for this quarter.",
  choices:[
   {l:"Buy everything new",s:"About $260",tag:"−$260",go(){C.cash-=260;C.spent.books+=260;C.effort+=0.5;return"You bought every book new.";}},
   {l:"Rent, buy used, and check the library first",s:"About $110",tag:"−$110",go(){C.cash-=110;C.spent.books+=110;C.effort+=0.4;return{t:"You rented two books, bought one used and found one on course reserve at the library. You spent $110.",k:"k-good",why:"The library keeps many required textbooks on course reserve. Checking before you buy is free."};}},
   {l:"Skip the books and hope for the best",s:"$0",go(){C.effort-=1;fx({stress:3});return{t:"You didn't buy the books. Homework took longer and you fell behind.",why:"Skipping required books saves money now but can cost grades, and grades protect your aid."};}}]}),

  text:`A friend makes extra money delivering food on weekends. Over the next three months you could earn about ${$(gross)} before gas and car costs of about ${$(gas)}. Delivery apps don't take any taxes out. You pay them yourself at tax time, including about 15% self-employment tax.`,
  choices:[

   {l:"Do it and spend it all",s:`Keep about ${$(gross-gas)} for now`,go(){gig(gross-gas);C.flags.gigOwe=(C.flags.gigOwe||0)+set;fx({stress:4,happy:2});C.effort-=0.5;teach("taxes");return{t:`You made ${$(gross-gas)} after gas and spent it as it came in.`,why:`You'll owe about ${$(set)} in taxes on it in April.`};}},
   {l:"Pass",s:"Keep your weekends for studying",go(){C.effort+=0.5;return"You passed on delivery work and kept your weekends free.";}}]};},
 storecard:()=>({title:"15% off if you open a store card",where:"Capitola Mall",
  text:"You're buying $120 of clothes. The cashier says you'll save 15% today if you open the store's credit card. You ask about the APR: about 30%.",
  choices:[
   {l:"Open it for the discount",s:"Save $18 today",tag:"−$102",go(){C.cash-=102;C.spent.other+=102;C.card=true;C.flags.storeCard=true;teach("apr");return{t:"You opened the store card and saved $18.",why:"Store cards often charge higher APRs than regular cards. The discount is gone the first month you carry a balance, and every new account is a hard inquiry on your credit."};}},
   {l:"Say no thanks and pay full price",s:"$120",tag:"−$120",go(){C.cash-=120;C.spent.other+=120;teach("apr");return{t:"You paid $120 and skipped the store card.",why:"Opening cards for one-time discounts adds accounts and inquiries you don't need."};}},
   {l:"Put the clothes back",s:"$0",go(){fx({happy:-1});return"You decided you didn't need the clothes after all.";}}]}),
 storm:()=>({title:"An atmospheric river hits Santa Cruz",where:"December · finals week",
  text:`Days of heavy rain knock out power ${offCampus()?"on your street":"across part of campus"}. Highway 17 has rockslide closures, and your phone is at 20%.`,
  choices:[
   {l:offCampus()?"Toss the spoiled food and restock":"Grab food and study at a friend's place in town",s:offCampus()?"About $70":"About $20",tag:offCampus()?"−$70":"−$20",go(){const c=offCampus()?70:20;C.cash-=c;C.spent.food+=c;teach("emergency");fx({stress:3});return{t:offCampus()?"Your fridge was out for two days. You threw out about $70 of food.":"You stayed with a friend in town with power and studied there.",why:"Storms and power shutoffs happen in Santa Cruz most winters. A small cushion turns them into an annoyance instead of a crisis."};}},
   {l:"Study by headlamp and ride it out",s:"Free, stressful",go(){fx({stress:7,happy:-3});C.effort-=0.5;return"You studied by headlamp for two nights. Finals felt harder.";}},
   {l:"Ask your professor for a short extension",s:"Email today",go(){fx({stress:-3});C.effort+=0.3;return{t:"Your professor gave everyone without power two extra days.",why:"Asking early and politely works more often than students expect."};}}]}),
 aquarium:()=>({title:"Spring break day trip",where:"Monterey Bay",
  text:"Friends want to drive down to the Monterey Bay Aquarium. Tickets are about $65 each, plus gas and lunch.",
  choices:[
   {l:"Go to the aquarium",s:"About $95 with gas and lunch",tag:"−$95",go(){C.cash-=95;C.spent.fun+=95;fx({happy:8,social:5,stress:-6});return"You spent the day at the aquarium. The sea otters were worth it.";}},
   {l:"Suggest tide pools at Natural Bridges instead",s:"Free, bring lunch",go(){fx({happy:6,social:4,stress:-6});return{t:"You explored the tide pools at Natural Bridges and had a picnic.",why:"Santa Cruz has a lot of free fun: beaches, tide pools, trails. Mixing in free days keeps a fun budget going longer."};}},
   {l:"Stay in and work",s:"Extra shifts if you have a job",go(){if(C.fin.hours>0){const p=Math.round(C.fin.wage*16*(1-TAX));C.cash+=p;C.spent.earned+=p;}fx({happy:-2});return"You stayed back and worked.";}}]}),
 rentalscam:()=>({title:"A room that's too good to be true",where:"Facebook Marketplace",
  text:"You're looking at places for next year. A private room downtown is listed at $900 a month, far below the usual $1,350. The owner says they're out of the country and will mail the keys once you send the deposit by Zelle.",
  choices:[
   {l:"Send the $900 deposit to hold it",s:"Before someone else does",tag:"−$900",go(){const a=Math.min(900,Math.max(0,C.cash));C.cash-=a;if(a<900)C.debt.card+=900-a;C.spent.housing+=900;fx({stress:10,happy:-6});teach("scams");return{t:"The keys never came and the listing disappeared. The $900 is gone.",k:"k-bad",why:"Owners who can't show the place, prices far below market and payment apps are the classic rental scam. Payment apps rarely refund scams."};}},

<script>
/* ======================= SLUG COLLEGE: ENGINE & UI =======================
   Four years at UC Santa Cruz, one month per turn (48 turns from September of
   year 1 to August of year 4). Money figures are rounded game estimates. */
const YEAR0=2026;
const MINWAGE=16.90;            // California minimum wage, 2026
const UCSC_FEES=17439;          // UCSC tuition + campus fees, entering CA residents 2026-27 (UCSC Financial Aid budget)
const UCSC_HOUSING=21957;
const NONRES_TUITION=39270;     // nonresident supplemental tuition, 2026-27 (UCSC Financial Aid budget)

/* ======================= LEADERBOARD =======================
   scores/<account id> = {entries:[best run per student]}. Everyone reads the
   collection; each account writes its own doc. Falls back to this device. */
let LB={db:null,uid:null,rows:null,state:"local",canWrite:false,timer:null};
const shortName=n=>{const p=String(n||"").trim().split(/\s+/);return p.length>1?`${p[0]} ${p[p.length-1][0]}.`:(p[0]||"A Slug");};
function lbLocal(){const a=lsGet("scBoardLocal",[]);return Array.isArray(a)?a:[];}
function bestPer(list){const m={};for(const e of list){if(!e||typeof e.score!=="number")continue;const k=e.pid||e.name;if(!m[k]||e.score>m[k].score)m[k]=e;}return Object.values(m).sort((a,b)=>b.score-a.score||a.t-b.t);}
let lbChain=Promise.resolve();
function lbRecord(){
 const e={pid:PROF?PROF.id:"guest",name:shortName(PROF?PROF.name:C.name),college:C.college,emoji:PROF?PROF.emoji:"🐌",color:PROF?PROF.color:"",
  score:C.score,stars:stars(C.score),gpa:Math.round(cumGpa()*100)/100,nw:Math.round(netWorth()),major:C.major?MAJORS[C.major].n:"",t:Date.now()};
 lsSet("scBoardLocal",bestPer(lbLocal().concat([e])).slice(0,50));
 if(!LB.db||!LB.uid||!LB.canWrite)return;
 lbChain=lbChain.then(async()=>{const ref=LB.db.doc("scores/"+LB.uid);const s=await ref.get();const old=s.exists&&Array.isArray(s.data().entries)?s.data().entries:[];await ref.set({entries:bestPer(old.concat([e])).slice(0,30)});})
  .catch(()=>{LB.err=true;lbPaint();});
}
function lbForget(ids){
 lsSet("scBoardLocal",lbLocal().filter(e=>!ids.includes(e.pid)));
 if(!LB.db||!LB.uid||!LB.canWrite)return;
 lbChain=lbChain.then(async()=>{const ref=LB.db.doc("scores/"+LB.uid);const s=await ref.get();if(!s.exists)return;const old=Array.isArray(s.data().entries)?s.data().entries:[];const keep=old.filter(e=>!ids.includes(e.pid));if(keep.length!==old.length)await ref.set({entries:keep});}).catch(()=>{});
}
function lbRows(){return LB.rows||bestPer(lbLocal());}
function lbRank(sc,pid){const r=lbRows();return{rank:1+r.filter(x=>x.score>sc&&x.pid!==pid).length,of:Math.max(r.length,1)};}
function lbHtml(){
 const rows=lbRows().slice(0,10),me=PROF?PROF.id:"guest";
 const status=LB.state==="live"?(LB.canWrite?(LB.err?"Couldn't post your last score. It's saved on this device.":"Live board · everyone who plays this link"):"Live board · view-only for you, so your runs save on this device only")
  :LB.state==="loading"?"Loading the shared board…":LB.state==="slow"?"Can't reach the shared board yet. Showing this device.":"Showing runs played on this device";
 const body=rows.length?`<ol class="lb">${rows.map((r,i)=>`<li class="${r.pid===me?"me":""}"><span class="rk">${i<3?["🥇","🥈","🥉"][i]:i+1}</span><span class="av" style="${r.color?`--av:${esc(r.color)}`:""}">${esc(r.emoji||"🐌")}</span><span class="lbn"><b>${esc(r.name)}${r.pid===me?" <em>you</em>":""}</b><small>${esc(r.college?r.college+" College":"")}${r.major?` · ${esc(r.major)}`:""} · GPA ${Number(r.gpa||0).toFixed(2)}</small></span><span class="pts"><b>${r.score|0}</b><small>${"★".repeat(r.stars|0)}${"☆".repeat(3-(r.stars|0))}</small></span></li>`).join("")}</ol>`
  :`<p class="hint">Nobody has graduated yet. Be the first Slug on the board.</p>`;
 return `${body}<p class="hint lbs">${status}</p>`;
}
function lbPaint(){document.querySelectorAll("[data-lb]").forEach(el=>{el.innerHTML=lbHtml();});const m=document.querySelector("[data-myrank]");if(m){const b=lsGet(bestKey(),0);if(b){const k=lbRank(b,PROF?PROF.id:"guest");m.innerHTML=`#${k.rank}<span> of ${k.of}</span>`;}}
 const r=document.querySelector("[data-lbrank]");if(r&&C&&C.score!=null){const k=lbRank(C.score,PROF?PROF.id:"guest");r.textContent=`#${k.rank} of ${k.of}`;}}
async function lbInit(){
 try{
  if(!window.claude||!window.claude.use)return;
  const db=await window.claude.use("db");if(!db)return;
  const user=await window.claude.use("user");
  LB.db=db;LB.uid=user?await user.id():null;
  const cw=user&&user.can?await user.can("data.write"):null;
  LB.canWrite=!!LB.uid&&cw!==false;
  LB.state="loading";lbPaint();
  LB.timer=setTimeout(()=>{if(LB.state==="loading"){LB.state="slow";lbPaint();}},10000);
  db.collection("scores").onSnapshot(snap=>{
   const all=[];snap.docs.forEach(d=>{const x=d.data();if(x&&Array.isArray(x.entries))x.entries.forEach(e=>all.push(e));});
   LB.rows=bestPer(all);LB.state="live";clearTimeout(LB.timer);lbPaint();
  },()=>{LB.state="local";LB.rows=null;clearTimeout(LB.timer);lbPaint();});
 }catch(e){LB.state="local";}
}

let PID=1;
function person(rel,opts={}){const g=opts.gender||pick(["woman","man"]);return{id:"p"+(PID++)+"_"+Math.floor(R()*1e5),rel,name:opts.name||pick(NAMES[g]),gender:g,bond:opts.bond??ri(55,80),alive:true};}

function newRun(o){
 const real=o.real?realDefaults({...o.real}):null;
 const gender=o.gender||"woman";
 const last=PROF&&lastName(PROF.name)&&(o.name||"").trim()===firstName(PROF.name)?lastName(PROF.name):pick(NAMES.last);
 const wealth=real?"real":o.wealth==="random"?(R()<0.33?"low":R()<0.72?"mid":"high"):o.wealth;
 const startM=real?((+real.uyear||1)-1)*12:0;
 const n=k=>real?rv(real,k):0;
 let fin,home,rent,cash,card=0,stu=0;
 if(real){
  fin={grants:n("grants"),loans:n("loans"),family:n("family"),wage:n("wage"),hours:n("hours"),fees:real.fees===""?0:n("fees"),food:n("food"),utils:n("utils"),transit:n("transit"),fun:n("fun"),other:n("other"),books:n("books")};
  home=real.home;rent=n("rent");cash=n("savings");card=n("card");stu=n("stu");
 }else{
  const W=WEALTH[wealth];
  /* Aid follows the cost of attendance, which includes UC SHIP when you're enrolled in it */
  const oos=o.city==="outofstate";
  var shipGrant=!oos&&(o.ins||"ship")==="ship"?{low:4209,mid:3200,high:0}[wealth]:0,shipFam=(o.ins||"ship")==="ship"&&(wealth==="high"||oos)?350:0;
  fin={grants:oos?(wealth==="low"?PELL_MAX:0):W.grants+shipGrant,loans:W.loans,family:W.family+shipFam,famQ:oos?Math.round((NONRES_TUITION+(wealth==="low"?UCSC_FEES+UCSC_HOUSING-PELL_MAX-W.loans-1500:W.grants))/3):0,plus:oos&&wealth==="low",wage:W.wage,hours:W.hours,fees:oos?OOS_FEES:UCSC_FEES,food:60,utils:50,transit:30,fun:120,other:200,books:400};
  home="campus";rent=Math.round(UCSC_HOUSING/9);cash=W.savings;
 }
 C={v:1,name:(o.name||"").trim()||pick(NAMES[gender]),last,gender,city:o.city||"santacruz",wealth,real:!!real,
  startM,m:startM,energy:2,effort:0,gpas:[],apt:clamp(2.9+gauss()*0.35,2.2,4),
  major:real?(MAJORS[real.major]?real.major:null):(PROF&&MAJORS[PROF.major]?PROF.major:null),
  college:PROF&&PROF.college?PROF.college:pick(UCSC_COLLEGES),
  st:{health:ri(70,90),happy:ri(62,80),social:ri(40,65),stress:ri(15,30)},
  cash,debt:{card,stu},card:card>0,fin,home,rent,summer:null,ins:o.ins||"ship",credit:{limit:1500,months:0,onTime:0,late:0},extraLoans:{},pendingLoan:0,career:{exp:0,perf:50},ra:false,postHome:null,greek:false,bnpl:[],nextHome:null,notice:false,plan:false,aidHold:false,calfresh:0,lastInterest:0,
  spent:{tuition:0,housing:0,food:0,fun:0,books:0,other:0,health:0,interest:0,earned:0,aid:0,borrowed:0},
  people:[],lessons:[],log:[{m:startM,lines:[]}],hist:[],worst:null,flags:{},pending:null,queue:[],lastMoney:null,done:false,score:null};
 const mo=person("mother",{gender:"woman"}),fa=person("father",{gender:"man"});C.people.push(mo,fa);
 const say1=real?`You're ${C.name}, starting year ${yearOf(startM)} at UC Santa Cruz in ${C.college} College, with your real numbers.`
  :`You're ${C.name}, a first-year at UC Santa Cruz. You just moved into ${C.college} College.`;
 say(say1,"k-big");
 if(C.home==="campus"&&yearOf(startM)===1){const rm=person("roommate",{gender:gender==="nonbinary"?pick(["woman","man"]):gender});C.people.push(rm);say(`Your roommate is ${rm.name}.`);}
 if(C.city==="outofstate")say(real?`As an out-of-state student, your tuition and fees are ${$(C.fin.fees)} a year.`:`You're from out of state, so tuition and fees are ${$(OOS_FEES)} a year. You don't qualify for Cal Grants or UC grants, so your family${wealth==="low"?" took out Parent PLUS loans to cover most of it":" is paying most of it"}.`,"k-bad");
 if(!real)say(`Your family is ${WEALTH[wealth].n.toLowerCase()} financially. You have ${$(C.cash)} saved${WEALTH[wealth].hours?` and a campus job lined up for about ${WEALTH[wealth].hours} hours a week`:""}.`);
 if(C.major)say(`You're planning to major in ${MAJORS[C.major].n}.`);

}

const jobWage=()=>{if(!inSchool()&&C.summer==="intern")return C.career.intern?C.career.intern.wage:0;return !inSchool()&&C.summer==="work"?Math.max(C.fin.wage,18.5):C.fin.wage;};
