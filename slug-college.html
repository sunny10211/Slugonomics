/* ======================= MONEY (start of each month) ======================= */
function monthStart(){
 const mi=moOf(C.m),F=C.fin,inc=[],out=[];
 const add=(arr,l,v)=>{if(v>0.5)arr.push([l,Math.round(v)]);};
 C.energy=2;
 if(mi===0){C.summer=null;C.fafsaCut=C.flags.fafsaMiss?0.85:1;C.flags.fafsaMiss=false;}
 // move off campus after year 1 (quick start)
 if(mi===0&&C.m>0){const nh=C.nextHome;C.nextHome=null;
  if(nh)moveTo(nh,add,out);else if(C.home==="campus"&&!C.real)moveTo({home:"shared",rent:1350},add,out);}
 // quarter start: aid in, tuition and books out
 if([0,4,7].includes(mi)){
  const hold=C.aidHold,g=hold?0:F.grants/3*(C.fafsaCut||1),l=hold?0:F.loans/3,fees=F.fees/3;
  if(hold)say("Your financial aid is on hold until your cumulative GPA is back above 2.0. Tuition is still due.","k-bad");
  else if((C.fafsaCut||1)<1&&F.grants)say(`Because you filed your FAFSA late, your grants are about ${$(F.grants/3*0.15)} smaller this quarter.`,"k-bad");
  C.cash+=g+l*(1-LOAN_FEE)-fees-F.books;C.debt.stu+=l;C.spent.aid+=g;C.spent.borrowed+=l;C.spent.tuition+=fees;C.spent.books+=F.books;
  add(inc,"Grants & scholarships",g);add(inc,"Student loans (after 1% fee)",l*(1-LOAN_FEE));add(out,"Tuition & fees",fees);add(out,"Books & supplies",F.books);
  if(F.famQ){C.cash+=F.famQ;if(F.plus)C.spent.plus=(C.spent.plus||0)+F.famQ;add(inc,F.plus?"Parent PLUS loan (your family's debt)":"Family paid toward tuition",F.famQ);}
  if(C.ins==="ship"){C.cash-=SHIP_Q;C.spent.health+=SHIP_Q;add(out,"UC SHIP health insurance",SHIP_Q);}
  if(C.greek){C.cash-=GREEK_DUES;C.spent.fun+=GREEK_DUES;add(out,`${greekWord()[0].toUpperCase()+greekWord().slice(1)} dues`,GREEK_DUES);}
  if(mi===7&&C.flags.gigOwe){const t=C.flags.gigOwe;C.flags.gigOwe=0;C.cash-=t;C.spent.other+=t;add(out,"Taxes owed on delivery income",t);say(`Tax time: you owed ${$(t)} on your delivery income and paid it from your account.`,"k-bad");}
  if(mi===0&&C.flags.schol){const s=C.flags.schol;C.flags.schol=0;C.cash+=s;C.spent.aid+=s;add(inc,"Scholarship",s);say(`Your ${$(s)} scholarship arrived.`,"k-good");}
  if(g+l>0){say(`${qOf(C.m)} quarter aid arrived: ${$(g+l)}${l?`, including ${$(l)} in loans`:""}. Tuition took ${$(fees)}.`);teach("aid");if(l)teach("loaninterest");}
  else if(fees)say(`${qOf(C.m)} quarter tuition is due: ${$(fees)}.`);
 }
 // after graduation: new home and first paychecks
 if(C.m===46&&C.postHome){moveTo(C.postHome,add,out);C.postHome=null;}
 if(C.m>=46&&C.career.accepted&&C.career.offer){const net=C.career.offer.salary/12*(1-0.24)*(C.m===46?0.5:1);C.fin.hours=0;C.cash+=net;C.spent.earned+=net;add(inc,`Paycheck: ${C.career.offer.co} (after tax)`,net);}
 if(C.flags.repay&&pr(0.35)){C.cash+=C.flags.repay;add(inc,"Roommate paid you back",C.flags.repay);say(`Your roommate paid you back ${$(C.flags.repay)}.`,"k-good");C.flags.repay=0;}
 if(isSummer()&&C.summer==="intern"&&C.career.intern&&C.career.intern.bay){C.cash-=300;C.spent.other+=300;add(out,"Highway 17 commute to your internship",300);}
 // extra loan requested last month
 if(C.pendingLoan>0){const a=C.pendingLoan;C.pendingLoan=0;C.cash+=a*(1-LOAN_FEE);C.debt.stu+=a;C.spent.borrowed+=a;add(inc,"Additional student loan (after 1% fee)",a*(1-LOAN_FEE));say(`Your additional ${$(a)} student loan arrived (${$(a*(1-LOAN_FEE))} after the 1% fee).`);teach("loaninterest");}
 // housing
 const rent=rentNow();if(rent){C.cash-=rent;C.spent.housing+=rent;add(out,C.home==="campus"?"Campus housing & meals":`Rent: ${HOMES[C.home].s}`,rent);}
 if(C.home!=="campus"&&C.home!=="family"&&isSummer()&&rent&&!C.flags.summerRentSaid){C.flags.summerRentSaid=1;teach("summer");}
 // living costs (cheaper while at home)
 const home=atHome(),food=F.food*(home&&C.home==="campus"?2:1)*(home?0.5:1);
 const living=food+F.utils+F.transit+F.fun+F.other;
 C.cash-=living;C.spent.food+=food;C.spent.fun+=F.fun;C.spent.other+=F.utils+F.transit+F.other;
 add(out,"Groceries",food);add(out,"Utilities, phone & transport",F.utils+F.transit);add(out,"Eating out & fun",F.fun);add(out,"Everything else",F.other);
 // buy now, pay later installments
 for(const b of C.bnpl){if(b.left>0){C.cash-=b.amt;C.spent.other+=0;b.left--;add(out,`Buy now, pay later: ${b.what} (${b.left} left)`,b.amt);}}
 C.bnpl=C.bnpl.filter(b=>b.left>0);
 // family help
 if(F.family){C.cash+=F.family;add(inc,"Help from family",F.family);}
 // CalFresh benefits (spent on groceries)
 if(C.calfresh>0){const b=Math.min(C.calfresh,food);C.cash+=b;C.spent.cf=(C.spent.cf||0)+b;add(inc,"CalFresh food benefits",b);}
 // job
 const h=jobHours();if(h>0){const gross=jobWage()*h*WEEKS,net=gross*(1-TAX);C.cash+=net;C.spent.earned+=net;add(inc,`Paycheck (${h} hrs/week, after tax)`,net);teach("netpay");}
 // interest
 C.lastInterest=0;if(C.debt.card>0){const i=C.debt.card*CARD_APR/12;C.debt.card+=i;C.spent.interest+=i;C.lastInterest=i;add(out,"Credit card interest",i);}
 if(C.debt.stu>0){C.debt.stu+=C.debt.stu*LOAN_RATE/12*0.5;} // about half of a typical loan mix accrues in school
 // shortfall goes on the card
 if(C.cash<0){const short=-C.cash,had=C.card;C.cash=0;C.debt.card+=short;C.card=true;C.flags.everShort=(C.flags.everShort||0)+1;
  if(!C.worst||short>C.worst.amt)C.worst={m:C.m,amt:short};
  say(`You came up ${$(short)} short this month. It went on ${had?"your":"a new"} credit card at 25% APR.${loanRoom()>=250?` You can still borrow up to ${$(loanRoom())} in student loans this year at ${(LOAN_RATE*100).toFixed(2)}%. See the Money tab.`:""}`,"k-bad");fx({happy:-5,stress:6});}
 if(C.card||C.debt.stu>0)C.credit.months++;
 C.lastMoney={inc,out,m:C.m};
 // card statement and FAFSA come before the month's main event
 if(C.debt.card>=1)C.queue.push({k:"statement"});
 if(C.calfresh&&C.cfMonth!=null&&C.m>C.cfMonth&&(C.m-C.cfMonth)%6===0)C.queue.push({k:"sar7"});
 if(mi===1&&yearOf(C.m)<4)C.queue.push({k:"fafsa"});
 // this month's main event
 const key=pickMain(C.m);
 if(key==="SUMMER")C.queue.push({k:"summer"});
 else if(EV[key.toLowerCase()]&&key===key.toUpperCase()&&key!=="MAJOR")C.queue.push({k:key.toLowerCase()});
 else if(key==="MAJOR"){if(!C.major)C.queue.push({k:"major"});else C.queue.push({k:"majorconfirm"});}
 else C.queue.push({k:"preview",m:C.m});
 if(C.m<46&&pr(WILD_P)){const w=pickWild();if(w)C.queue.push({k:w});}
 nextPending();
}

/* ======================= GRADES AND AID =======================
   UCSC: good standing needs a 2.0 term and cumulative GPA. Below that: academic notice.
   Term GPA under 1.5, or still under 2.0 cumulative while on notice: subject to disqualification,
   and financial aid stops without an approved appeal. */
function checkStanding(g){
 const cum=cumGpa();
 if(C.plan){C.plan=false;if(g<2){C.aidHold=true;say("You didn't meet your academic plan. Your financial aid is on hold until your GPA recovers.","k-bad");teach("gradesaid");return;}say("You met the terms of your academic plan. Your aid continues.","k-good");}
 if(C.aidHold&&cum>=2){C.aidHold=false;C.notice=false;say("Your cumulative GPA is back above 2.0. Your financial aid is restored.","k-good");return;}
 if(g<1.5||(C.notice&&cum<2)){if(!C.aidHold)C.queue.push({k:"probation"});teach("gradesaid");return;}
 if(g<2||cum<2){C.notice=true;say("You're on academic notice: your GPA fell below 2.0. Another quarter like this puts your aid at risk.","k-bad");teach("gradesaid");return;}
 if(C.notice){C.notice=false;say("You're back in good academic standing.","k-good");}
}

/* ======================= CREDIT ======================= */
function creditScore(){
 if(!C.card&&C.debt.stu<1&&!C.credit.months)return null;
 const u=C.card?C.debt.card/C.credit.limit:0;
 let s=650+Math.min(55,C.credit.months*1.3)+Math.min(25,C.credit.onTime*1.5);
 if(C.card)s+=u>0.9?-75:u>0.5?-40:u>0.3?-15:u<0.1?10:0;
 s-=C.credit.late*45;
 return clamp(Math.round(s),300,850);
}
const creditBand=s=>s>=740?"Very good":s>=670?"Good":s>=580?"Fair":"Poor";
function minPay(){const b=C.debt.card;return Math.round(Math.min(b,Math.max(25,b*0.01+(C.lastInterest||b*CARD_APR/12))));}
function payoff(bal,pay){let b=bal,n=0,int=0;const r=CARD_APR/12;while(b>0.5&&n<600){const i=b*r;int+=i;b+=i-pay;n++;if(pay<=i){n=600;break;}}return{months:n,interest:Math.round(int)};}

function onTimePay(){C.credit.onTime++;if(C.credit.onTime%6===0&&C.credit.limit<5000){C.credit.limit+=500;say(`Your card company raised your limit to ${$(C.credit.limit)} after ${C.credit.onTime} on-time payments.`,"k-good");}}

/* ======================= STUDENT LOANS ======================= */
function loanRoom(){if(!C||!inSchool())return 0;const y=yearOf(C.m);return Math.max(0,LOAN_LIMITS[y-1]-C.fin.loans-(C.extraLoans[y]||0));}
function loanCost(a){const yrs=Math.max(0,(47-C.m)/12)+0.5,grown=a*(1+LOAN_RATE*0.5*yrs),mo=pmt(grown,LOAN_RATE/12,120);return{mo,total:mo*120};}
function loanPanel(){
 const y=yearOf(C.m),lim=LOAN_LIMITS[y-1],took=C.fin.loans+(C.extraLoans[y]||0),room=loanRoom(),start=Math.min(room,Math.max(250,Math.round(room/2/250)*250));
 const cost=loanCost(start);
 return `<section class="panel"><div class="ph"><h3>🎓 Student loans</h3><span class="mono ${C.debt.stu>1?"bad":""}">${C.debt.stu>1?"−"+$(C.debt.stu):"$0"}</span></div>
  <div class="kv small"><span>Borrowed for year ${y}</span><span>${$(took)} of ${$(lim)}</span></div>
  ${C.pendingLoan?`<p class="hint good">${$(C.pendingLoan)} more is on its way and arrives next month.</p>`:""}
  ${!inSchool()?`<p class="hint">Student loans are tied to the school year. You can request more starting in September.</p>`
  :room>=250?`<label class="field" for="loanamt"><span class="kv small"><span>Request more</span><b class="mono" id="loanv">${$(start)}</b></span><input type="range" id="loanamt" min="250" max="${Math.floor(room/250)*250}" step="250" value="${start}"></label>
   <p class="hint" id="loancost">Arrives next month as ${$(start*(1-LOAN_FEE))} after the 1% fee. Adds about <b>${$(cost.mo)} a month for 10 years</b> after graduation, about ${$(cost.total)} in total.</p>
   <button class="btn sm" id="loango">Request loan</button>`
  :`<p class="hint">You've reached this year's federal limit for dependent students. Next year's limit is higher.</p>`}
  <p class="hint">Loans cost ${(LOAN_RATE*100).toFixed(2)}% a year, far less than a credit card at 25%. Borrow only what you need: every dollar comes back with interest.</p></section>`;
}

/* ======================= CALFRESH ======================= */
function calfreshCalc(){
 const F=C.fin,job=F.wage*F.hours*WEEKS,gross=job+F.family;
 if(C.home==="campus"&&!atHome())return{ok:false,why:"Students living on campus with a meal plan of 10 or more meals a week don't count as eligible students."};
 if(gross>CF_GROSS)return{ok:false,why:`Your monthly income (${$(gross)} from work and family) is over the ${$(CF_GROSS)} limit for one person. Financial aid doesn't count as income, but paychecks and cash from family do.`};
 // financial aid (grants, scholarships, loans) doesn't count; wages get a 20% earned income deduction; family cash counts
 const adj=Math.max(0,job*0.8+F.family-CF_STD),shelter=Math.min(CF_SHELTER,Math.max(0,(C.rent||0)+F.utils-adj/2)),net=Math.max(0,adj-shelter);
 return{ok:true,benefit:Math.round(clamp(CF_MAX-0.3*net,CF_MIN,CF_MAX))};
}
function applyCalfresh(){
 const cf=calfreshCalc();teach("calfresh");
 if(!cf.ok){fx({stress:1});return{t:"You applied for CalFresh but didn't qualify right now.",why:cf.why+" You can apply again if your situation changes."};}
 C.calfresh=cf.benefit;C.cfMonth=C.m;fx({stress:-3,happy:2});
 return{t:`You were approved for CalFresh: ${$(cf.benefit)} a month for groceries on an EBT card.`,k:"k-good",why:"That's food money you never pay back. It covers groceries so your aid and paycheck can go to rent and bills."};
}

/* Aid follows the cost of attendance: covered housing or living at home lowers need-based grants */
function setAidAdj(target){const F=C.fin,base=F.grants+(C.aidAdj||0),cut=Math.min(base,target);F.grants=base-cut;const changed=cut!==(C.aidAdj||0);C.aidAdj=cut;return changed?cut:null;}
function moveTo(nh,add,out){
 const from=C.home,F=C.fin;
 const adj=C.m>=46?null:setAidAdj(nh.ra?UCSC_HOUSING:nh.home==="family"?10000:0);
 if(adj!=null&&adj>0)say(`Because your ${nh.ra?"housing and meals are covered":"cost of living at home is lower"}, Financial Aid lowered your grants by ${$(adj)} a year.`,"k-bad");
 if(nh.renew){C.rent=nh.rent;say(`Your renewed lease started at ${$(nh.rent)} a month.`);return;}
 if(nh.ra){if(from!=="campus")F.food=Math.max(30,F.food-390);C.home="campus";C.rent=0;say("You moved into your RA room. Housing and meals are free this year.","k-big");return;}
 if(nh.home===from&&nh.rent===C.rent){if(from==="campus")say("You moved back into campus housing for the new year.");return;}
 if(from==="campus"&&nh.home!=="campus")F.food+=390;
 if(nh.home==="campus"&&from!=="campus")F.food=Math.max(30,F.food-390);
 C.home=nh.home;C.rent=nh.rent;
 if(nh.home==="shared"||nh.home==="own"){F.utils=Math.max(F.utils,90);F.transit=Math.max(F.transit,60);const dep=Math.round(nh.rent*(nh.dep||1));C.cash-=dep;C.spent.housing+=dep;add(out,"Security deposit",dep);
  say(`You moved into a shared room on the Westside. The lease runs all 12 months, and the deposit was ${$(dep)}.`,"k-big");teach("rent30");}
 else if(nh.home==="family"){F.food=Math.min(F.food,150);F.transit=F.transit+80;say("You moved back home and started commuting to campus.","k-big");}
 else say("You moved into campus housing for the new year.","k-big");
}

/* ======================= END OF MONTH ======================= */
function endMonth(){
 const mi=moOf(C.m);
 // quarter grade
 if([3,6,9].includes(mi)){
  const diff=C.major?MAJORS[C.major].diff:1;
  const g=Math.round(clamp(1.2+C.apt*0.55+Math.min(C.effort,7)*0.17-(C.st.stress>65?0.35:0)-(C.fin.hours>20?0.2:0)-(C.st.health<35?0.2:0)+gauss()*0.22-(diff-1)*0.8,0,4)*100)/100;
  C.gpas.push({m:C.m,q:qOf(C.m),y:yearOf(C.m),g});C.effort=0;
  say(`${qOf(C.m)} quarter grades are in: ${g.toFixed(2)} GPA (cumulative ${cumGpa().toFixed(2)}).`,g>=3.5?"k-good":g<2.3?"k-bad":"");
  checkStanding(g);
 }
 // drift
 const finals=[3,6,9].includes(mi);
 C.st.stress=clamp(Math.round(C.st.stress*0.85+(isSummer()?-4:ri(2,6))+(finals?8:0)+(C.fin.hours>15&&inSchool()?3:0)+(C.debt.card>1500?3:0)));
 const fl=foodFloor(),F=C.fin,funFx=F.fun<60?-5:F.fun<100?-2:F.fun>=200?3:0,otherFx=F.other<100?-2:0;
 const target=55+funFx+otherFx+(C.st.social>60?6:0)-(C.st.stress>65?9:0)-(C.cash<200?6:0)-(C.debt.card>2000?6:0)+(people("friend").filter(p=>p.bond>=60).length>=2?4:0);
 C.st.happy=clamp(Math.round(C.st.happy*0.75+target*0.25+ri(-3,3)));
 C.st.health=clamp(C.st.health+(C.st.stress>70?-2:ri(-1,1))-(F.food<fl&&!atHome()?2:0));
 C.st.social=clamp(C.st.social-1+(C.greek?2:0));
 if(jobHours()>0)C.career.exp+=0.08;
 if(C.st.health<45&&pr(0.3)){const cost=C.ins==="ship"?0:60;C.cash-=cost;C.spent.health+=cost;fx({stress:3});
  say(C.ins==="ship"?"You got sick and went to the Student Health Center. UC SHIP covered the visit.":`You got sick and saw a doctor in town. Your family's plan left you a ${$(cost)} copay.`,"k-bad");}
 for(const p of C.people)if(p.alive)p.bond=clamp(p.bond-(p.rel==="friend"?2:1));
 C.hist.push({m:C.m,happy:C.st.happy,health:C.st.health,stress:C.st.stress,nw:Math.round(netWorth())});
}
function nextMonth(){
 if(C.done||C.pending)return;
 endMonth();
 C.m++;
 if(C.m>=48){graduate();return;}
 C.log.push({m:C.m,lines:[]});
 monthStart();
 save();
}

/* ======================= EVENTS ======================= */
let PENDEV=null;
function pendEv(){if(!C.pending)return null;if(!PENDEV){const q=C.pending;PENDEV=q.k==="preview"?previewEvent(q.m):EV[q.k]();if(q.alt&&PENDEV.preview)PENDEV.title=q.alt;}return PENDEV;}
function nextPending(){while(C.queue.length&&!C.pending){C.pending=C.queue.shift();PENDEV=null;}if(C.pending)UI.sheet={kind:"event"};}
function snap(){return{...C.st,cash:C.cash-C.debt.card};}
function deltaChips(b){const a=snap(),d=[];for(const[k,l]of[["health","Health"],["happy","Happiness"],["social","Social"],["stress","Stress"]]){const x=Math.round(a[k]-b[k]);if(x)d.push({l,v:x,good:k==="stress"?x<0:x>0});}const m=Math.round(a.cash-b.cash);if(Math.abs(m)>=1)d.push({l:"Money",v:m,money:true,good:m>0});return d;}
function resolveEvent(i){
 const ev=pendEv();const c=ev.choices[i];if(!c||(c.ok&&!c.ok()))return;
 const b=snap();C.pending=null;PENDEV=null;
 const r=c.go();const t=r&&(r.t||r);if(t)say(t,r.k||"");
 UI.outcome={title:ev.title,choice:c.l,text:t||"Done.",chips:deltaChips(b),why:r&&r.why};
 UI.sheet={kind:"outcome"};save();
}

/* ======================= ACTIONS ======================= */
function doAct(a){
 if(C.energy<1){toast("No actions left. Tap +1 Month to continue.");return;}
 if(a.ok&&!a.ok())return;
 const cost=a.cost||0;if(cost&&C.cash<cost){toast(`You need ${$(cost)} in the bank.`);return;}
 const b=snap();C.cash-=cost;if(cost)C.spent.fun+=cost;C.energy--;
 const r=a.go();const t=r&&(r.t||r);if(t)say(t,r.k||"");
 UI.outcome={title:a.n,text:t||"Done.",chips:deltaChips(b),why:(r&&r.why)||a.why};UI.sheet={kind:"outcome"};save();render();
}
function spend(label,fn){
 if(C.energy<1){toast("No actions left. Tap +1 Month to continue.");return;}
 const b=snap();C.energy--;const r=fn();const t=r&&(r.t||r);if(t)say(t,r.k||"");
 UI.outcome={title:label,text:t||"Done.",chips:deltaChips(b),why:r&&r.why};UI.sheet={kind:"outcome"};save();render();
}

/* ======================= GRADUATION ======================= */
const stars=s=>s>=80?3:s>=60?2:s>=40?1:0;
function scoreParts(){
 const nw=netWorth(),H=C.hist,avg=k=>H.length?H.reduce((s,x)=>s+x[k],0)/H.length:C.st[k];
 const fin=clamp(Math.round(25*clamp((nw+40000)/50000,0,1)-Math.min(8,C.debt.card/1000)),0,25);
 const well=Math.round(avg("happy")/100*15+(100-avg("stress"))/100*10);
 const acad=Math.round(cumGpa()/4*25);
 const less=Math.round(C.lessons.length/Object.keys(LESSONS).length*25);
 return{fin,well,acad,less,total:clamp(fin+well+acad+less,0,100),avgHappy:avg("happy"),avgStress:avg("stress"),avgHealth:avg("health")};
}
function graduate(){
 C.m=47;C.done=true;C.pending=null;C.queue=[];
 const P=scoreParts();C.score=P.total;
 const best=lsGet(bestKey(),0);C.newBest=C.score>best;if(C.newBest)lsSet(bestKey(),C.score);
 try{lbRecord();}catch(e){}
 UI.sheet=null;UI.tab="life";save();
}

/* ======================= SMALL PIECES ======================= */

const meter=(v,c,lbl)=>`<div class="meter" role="img" aria-label="${lbl||""} ${Math.round(v)} of 100"><i style="width:${clamp(v)}%;background:${c}"></i></div>`;
const tone=v=>v>=60?"var(--good)":v>=35?"var(--gold)":"var(--coral)";
const chip=(l,v,cls="")=>`<span class="fxc ${cls}">${l}${v!==undefined&&v!==""?` <b>${v}</b>`:""}</span>`;

/* ======================= HEADER ======================= */

 <section class="gauges g5">${[["health","Health","❤️","--hp",st.health],["happy","Happiness","😊","--joy",st.happy],["stress","Stress","😣","--coral",st.stress],["social","Social","🤝","--soc",st.social],["gpa","GPA","🎓","--iq",g?g/4*100:0]].map(([k,l,e,c,v])=>{const bad=k==="stress"?v>65:k!=="gpa"&&v<35,txt=k==="gpa"?(g?g.toFixed(2):"—"):Math.round(v),col=k==="stress"?(v>65?"var(--coral)":v>=40?"var(--gold)":"var(--good)"):bad?"var(--coral)":`var(${c})`;return `<div class="g ${bad?"low":""}" style="--c:${k==="stress"?col:`var(${c})`}"><div class="top"><span><span class="ge" aria-hidden="true">${e} </span><span class="gl">${l}</span><span class="gs">${l==="Happiness"?"Happy":l}</span></span><b>${txt}</b></div>${meter(v,col,l)}${bad?`<span class="lowtxt">${k==="stress"?"High":"Low"}</span>`:""}</div>`;}).join("")}</section>`;
}
function progress(){
 const left=47-C.m;
 return `<section class="prog" aria-label="Progress to graduation"><div class="pt"><span>Month <b>${C.m+1}</b> of 48</span><span>${C.done?"Graduated":left?`${left} month${left>1?"s":""} to go`:"Final month"}</span></div>
 <div class="ticks" aria-hidden="true">${Array.from({length:48},(_,i)=>`<i class="${i<C.m||C.done?"done":i===C.m?"cur":""} ${moOf(i)>=10?"sum":""} ${i&&i%12===0?"ny":""}"></i>`).join("")}</div></section>`;
}

/* ======================= SPENDING PLAN ======================= */
const foodFloor=()=>C.home==="campus"?30:300;
const BUD={food:{l:"Groceries",camp:[0,400],off:[150,900]},fun:{l:"Eating out & fun",camp:[0,500],off:[0,500]},other:{l:"Clothes, subscriptions & personal",camp:[50,600],off:[50,600]}};
const PRESETS={frugal:{n:"Frugal",camp:{food:30,fun:40,other:120},off:{food:320,fun:40,other:120}},balanced:{n:"Balanced",camp:{food:60,fun:120,other:200},off:{food:450,fun:120,other:200}},comfy:{n:"Comfortable",camp:{food:120,fun:250,other:320},off:{food:600,fun:250,other:320}}};
function typicalMonth(){const F=C.fin,inc=(F.grants+F.loans)/9+F.family+F.wage*F.hours*WEEKS*(1-TAX),out=F.fees/9+C.rent+F.food+F.utils+F.transit+F.fun+F.other+F.books/3+(C.ins==="ship"?SHIP_Q/3:0);return inc-out;}
function budEffects(){const F=C.fin,fl=foodFloor(),t=[];
 if(F.fun<60)t.push("Almost no fun money: happiness drifts down each month.");else if(F.fun<100)t.push("Tight fun money: happiness slips a little.");else if(F.fun>=200)t.push("Generous fun money: a small happiness boost.");
 if(F.food<fl)t.push(`Groceries under ${$(fl)}: health drops each month.`);
 if(F.other<100)t.push("Very tight personal budget: a little less happy.");
 return t.length?t.join(" "):"A balanced plan: no effect on your stats.";}
function budgetPanel(){
 const F=C.fin,side=C.home==="campus"?"camp":"off",left=typicalMonth();
 const preset=Object.entries(PRESETS).find(([,p])=>Object.entries(p[side]).every(([k,v])=>F[k]===v));
 return `<section class="panel"><div class="ph"><h3>🧾 Your spending plan</h3><span class="mono ${left<0?"bad":"good"}" id="bud-left">${left<0?"−":"+"}${$(Math.abs(left))}</span></div>
  <p class="hint">The number above is what a typical school month leaves you with. Changes start next month.</p>
  <div class="seg">${Object.entries(PRESETS).map(([k,p])=>`<button class="chip ${preset&&preset[0]===k?"on":""}" data-preset="${k}" aria-pressed="${!!(preset&&preset[0]===k)}">${p.n}</button>`).join("")}</div>
  ${Object.entries(BUD).map(([k,b])=>{const[mn,mx]=b[side];return `<label class="field" for="bud-${k}"><span class="kv small"><span>${b.l}</span><b class="mono" id="budv-${k}">${$(F[k])}/mo</b></span><input type="range" id="bud-${k}" data-bud="${k}" min="${mn}" max="${mx}" step="10" value="${clamp(F[k],mn,mx)}"></label>`;}).join("")}
  <div class="kv small"><span>Housing${C.home==="campus"?" & meals (school months)":""}</span><span>${$(C.rent)}</span></div>
  <div class="kv small"><span>Utilities & phone</span><span>${$(F.utils)}</span></div><div class="kv small"><span>Transportation</span><span>${$(F.transit)}</span></div>
  <p class="fc ${/drops|down|less/.test(budEffects())?"bad":"good"}" id="bud-eff">${budEffects()}</p></section>`;
}
function budRefresh(){const l=document.getElementById("bud-left");if(!l)return;const left=typicalMonth();l.textContent=(left<0?"−":"+")+$(Math.abs(left));l.className="mono "+(left<0?"bad":"good");
 for(const k in BUD){const v=document.getElementById("budv-"+k);if(v)v.textContent=$(C.fin[k])+"/mo";}
 const e=document.getElementById("bud-eff");if(e){e.textContent=budEffects();e.className="fc "+(/drops|down|less/.test(e.textContent)?"bad":"good");}}

function lineChart(key,label,color){

 const W=320,Ht=90,px=i=>8+i/(H.length-1)*(W-16),py=v=>Ht-14-v/100*(Ht-24);
 const pts=H.map((x,i)=>`${px(i).toFixed(1)},${py(x[key]).toFixed(1)}`).join(" ");
 const yrs=H.map((x,i)=>moOf(x.m)===0?`<text x="${px(i).toFixed(1)}" y="${Ht-2}" text-anchor="middle">Y${yearOf(x.m)}</text>`:"").join("");
 return `<svg class="chart" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${label} by month"><line x1="8" x2="${W-8}" y1="${py(50)}" y2="${py(50)}" stroke="var(--line)" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>${yrs}</svg>`;
}

 on("showall",()=>{UI.showAll=true;render();});
 q("[data-cat]",b=>b.onclick=()=>{UI.cat=b.dataset.cat;render();});
 const pc=document.getElementById("paycard");if(pc)pc.oninput=()=>{document.getElementById("paycardv").textContent=$(+pc.value);};
 q("[data-bud]",r=>{r.oninput=()=>{C.fin[r.dataset.bud]=+r.value;budRefresh();};r.onchange=()=>{save();document.querySelectorAll("[data-preset]").forEach(b=>{b.classList.remove("on");b.setAttribute("aria-pressed","false");});toast("Budget saved. It starts next month.");};});
 q("[data-preset]",b=>b.onclick=()=>{const p=PRESETS[b.dataset.preset][C.home==="campus"?"camp":"off"];Object.assign(C.fin,p);save();toast(`${PRESETS[b.dataset.preset].n} plan saved. It starts next month.`);render();});
 const la=document.getElementById("loanamt");if(la)la.oninput=()=>{const a=+la.value,k=loanCost(a);document.getElementById("loanv").textContent=$(a);document.getElementById("loancost").innerHTML=`Arrives next month as ${$(a*(1-LOAN_FEE))} after the 1% fee. Adds about <b>${$(k.mo)} a month for 10 years</b> after graduation, about ${$(k.total)} in total.`;};
 on("loango",()=>{const a=Math.min(+document.getElementById("loanamt").value,loanRoom());if(a<250)return;const y=yearOf(C.m);C.pendingLoan+=a;C.extraLoans[y]=(C.extraLoans[y]||0)+a;say(`You asked Financial Aid for ${$(a)} more in student loans. It arrives next month.`);save();toast(`Requested ${$(a)}. It arrives next month.`);render();});
 on("paycardgo",()=>{const a=Math.min(+document.getElementById("paycard").value,C.cash,C.debt.card);if(a<=0)return;C.cash-=a;C.debt.card-=a;if(C.debt.card<1)C.debt.card=0;say(`You paid ${$(a)} toward your credit card.`,"k-good");save();toast(`Paid ${$(a)}`);render();});
 // create
 const ni=document.getElementById("c-name");if(ni)ni.oninput=()=>{UI.create.name=ni.value;};
 on("c-rand",()=>{UI.create.name=pick(NAMES[UI.create.gender]);render();});
 q("[data-mode]",b=>b.onclick=()=>{UI.create.mode=b.dataset.mode;render();});
 bindRealForm();
 q("[data-cg]",b=>b.onclick=()=>{UI.create.gender=b.dataset.cg;render();});
 q("[data-cc]",b=>b.onclick=()=>{UI.create.city=b.dataset.cc;render();});
 q("[data-cw]",b=>b.onclick=()=>{UI.create.wealth=b.dataset.cw;render();});
 q("[data-ci]",b=>b.onclick=()=>{UI.create.ins=b.dataset.ci;render();});
 q("[data-ins]",b=>b.onclick=()=>{const k=b.dataset.ins;if(k!==C.ins){C.ins=k;say(k==="ship"?"You enrolled in UC SHIP starting next quarter.":"You filed a UC SHIP waiver to use your family's plan starting next quarter.");save();toast(k==="ship"?"Switched to UC SHIP next quarter":"Waiver filed for next quarter");}render();});
 on("c-go",()=>{const real=(UI.create.mode||"real")==="real";const nm=(ni?ni.value:UI.create.name).trim();
  UIQ.lessons=[];PENDEV=null;
  newRun({...UI.create,name:nm||(PROF?firstName(PROF.name):""),real:real?rbGet():null});
  UI.create.name="";UI.screen="game";UI.tab="life";
  UI.sheet=!lsGet("scHowto",0)?{kind:"howto"}:C.pending?{kind:"event"}:null;
  render();window.scrollTo(0,0);});
 on("resume",()=>{UI.screen="game";UI.tab="life";if(C.pending)UI.sheet={kind:"event"};render();});
}

/* ======================= SCENERY ======================= */
function drawHero(cv){
 const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
 const c=cv.getContext&&cv.getContext("2d");if(!c)return;c.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height;let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
 const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,"#163B5A");g.addColorStop(.55,"#E9946A");g.addColorStop(.62,"#F2C230");c.fillStyle=g;c.fillRect(0,0,w,h);
 c.fillStyle="#1F5878";c.fillRect(0,h*.6,w,h*.4);
 c.fillStyle="rgba(255,255,255,.25)";for(let i=0;i<14;i++){c.fillRect(rnd()*w,h*.62+rnd()*h*.12,20+rnd()*40,1.5);}
 const tree=(x,base,ht,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(x,base-ht);c.lineTo(x+ht*.13,base);c.lineTo(x-ht*.13,base);c.closePath();c.fill();};
 for(let i=0;i<22;i++)tree(w*.55+rnd()*w*.5,h*.62,h*(.18+rnd()*.25),"#0E2B22");
 for(let i=0;i<10;i++)tree(rnd()*w*.35,h*.62,h*(.1+rnd()*.15),"#12352A");
 c.fillStyle="#0B241C";c.fillRect(0,h*.86,w,h*.14);
 c.save();c.translate(w*.2,h*.86);c.scale(1.3,1.3);c.fillStyle="#F2C230";c.beginPath();c.moveTo(-30,0);c.quadraticCurveTo(-28,-14,0,-14);c.quadraticCurveTo(16,-14,22,-22);c.lineTo(27,-20);c.quadraticCurveTo(24,-2,0,0);c.closePath();c.fill();
 c.strokeStyle="#F2C230";c.lineWidth=2.2;c.lineCap="round";c.beginPath();c.moveTo(22,-21);c.lineTo(24,-32);c.moveTo(25,-20);c.lineTo(31,-30);c.stroke();c.restore();
}

/* ======================= BOOT ======================= */
function boot(data){
 if(lsGet("scBig",false))document.documentElement.dataset.size="lg";
 if(data&&data.UI)UI=data.UI;
 UI.pf=UI.pf||newPF();
 if(!PROF){C=null;UI.screen=PROFILES.length?"picker":"profile";}
 else{C=(data&&data.C)||lsGet(gameKey(),null);fixState();if(!["profile","picker","check"].includes(UI.screen))UI.screen=C&&UI.screen!=="create"?"game":"create";}
 if(C&&C.pending&&UI.screen==="game")UI.sheet={kind:"event"};
 else if(!(data&&data.UI)&&!lsGet("scWelcomeOff",false)&&lsGet("scHowto",0))UI.sheet=null;
 render();
 lbInit();stInit();
}
window.claude?.hot?.snapshot?.(()=>({C,UI}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

</script>
